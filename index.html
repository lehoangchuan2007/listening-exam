<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="config.js"></script>
<style>
:root{--p:#2563eb;--p2:#1d4ed8;--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--ok:#16a34a;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.top{background:linear-gradient(135deg,#172554,#2563eb 55%,#38bdf8);color:white;padding:22px 18px}.wrap{max-width:1150px;margin:auto;padding:0 18px}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:25px;font-weight:850}.sub{opacity:.9;margin-top:4px}.badge{padding:6px 10px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff55;font-size:12px;font-weight:800}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--p);color:white;font-weight:750;cursor:pointer}.btn:hover{background:var(--p2)}.btn.gray{background:#e8eef7;color:var(--text)}.btn.green{background:var(--ok)}.btn.red{background:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:21px;margin-bottom:17px;box-shadow:0 5px 20px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.field label{display:block;font-weight:750;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.notice{padding:13px 15px;border-radius:11px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;margin-bottom:15px}.notice.warn{background:#fff7ed;border-color:#fed7aa;color:#92400e}.muted{color:var(--muted);font-size:14px}.hidden{display:none!important}.auth{max-width:480px;margin:50px auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.tab.active{background:var(--p);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.exam{border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:10px}.exam h3{margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:15px}.stat b{display:block;font-size:25px}.upload{border:2px dashed #93c5fd;background:#f8fbff;padding:17px;border-radius:13px}.q{border:1px solid var(--line);background:#fbfdff;border-radius:13px;padding:16px;margin-top:12px}.qhead{display:flex;justify-content:space-between;align-items:center}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.opt{display:flex;gap:7px;align-items:center}.linkbox{word-break:break-all;background:#eff6ff;border:1px dashed #60a5fa;border-radius:10px;padding:12px}.studentq{padding:17px 0;border-bottom:1px solid var(--line)}.choice{display:block;border:1px solid var(--line);padding:11px;border-radius:9px;margin:7px 0;cursor:pointer}.choice:hover{background:#f8fafc}.result{text-align:center;font-size:38px;font-weight:900;color:var(--p)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:28px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:28px}@media(max-width:700px){.grid,.opts,.stats{grid-template-columns:1fr}.top .wrap{display:block}.badge{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div><div class="brand">🎧 English Studio</div><div class="sub">Tạo đề • Upload Word/MP3 • Thi online • Tự động chấm</div></div><span class="badge">ONLINE</span></div></header>
<main class="wrap"><div id="app"></div></main><footer>English Studio • GitHub Pages + Supabase</footer>
<script>
const cfg=window.SUPABASE_CONFIG||{};const configured=cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_')&&!cfg.anonKey.includes('YOUR_');const sb=configured?supabase.createClient(cfg.url,cfg.anonKey):null;let questions=[],currentExam=null,timer=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shell(x){$('app').innerHTML=x}function setup(){shell(`<div class="card" style="margin-top:35px"><h2>⚙️ Kết nối cơ sở dữ liệu</h2><p>Website đã có sẵn hệ thống giáo viên, upload MP3, đề online và lưu điểm. Cần kết nối Supabase một lần.</p><ol><li>Tạo project Supabase miễn phí.</li><li>Mở <b>SQL Editor</b> và chạy toàn bộ file <b>supabase-schema.sql</b>.</li><li>Vào <b>Project Settings → API</b>, lấy <b>Project URL</b> và <b>anon public key</b>.</li><li>Mở <b>config.js</b> trên GitHub và thay 2 giá trị mẫu.</li></ol><div class="notice warn"><b>Không dùng service_role key.</b> Chỉ dùng anon/public key.</div><div class="toolbar"><a class="btn" href="https://supabase.com/" target="_blank" style="text-decoration:none">Mở Supabase</a><a class="btn gray" href="https://github.com/lehoangchuan2007/listening-exam/blob/main/supabase-schema.sql" target="_blank" style="text-decoration:none">Mở SQL</a></div></div>`)}
async function start(){if(location.hash.startsWith('#exam='))return loadPublicExam(location.hash.slice(6));if(!configured)return setup();const {data:{session}}=await sb.auth.getSession();session?dashboard(session):auth()}
function auth(){shell(`<div class="auth"><div class="card"><h2 style="text-align:center">👨‍🏫 Giáo viên</h2><div class="tabs"><button class="tab active" id="loginTab" onclick="authMode('login')">Đăng nhập</button><button class="tab" id="signupTab" onclick="authMode('signup')">Tạo tài khoản</button></div><div id="authForm"></div><p id="authMsg" class="muted"></p></div></div>`);authMode('login')}
function authMode(m){$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('authForm').innerHTML=`<div class="field"><label>Email</label><input id="email" type="email" placeholder="teacher@example.com"></div><div class="field" style="margin-top:10px"><label>Mật khẩu</label><input id="password" type="password" placeholder="Ít nhất 6 ký tự"></div><div class="toolbar"><button class="btn" onclick="doAuth('${m}')">${m==='login'?'🔐 Đăng nhập':'✨ Tạo tài khoản'}</button></div>`}
async function doAuth(m){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Hãy nhập email và mật khẩu.');msg('Đang xử lý...');const r=m==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error)return msg('❌ '+r.error.message);m==='signup'?msg('✅ Tài khoản đã tạo. Nếu bật xác nhận email, hãy xác nhận rồi đăng nhập.'):dashboard(r.data.session)}function msg(x){$('authMsg').textContent=x}
async function dashboard(session){shell(`<div class="toolbar"><button class="btn" onclick="showCreate()">＋ Tạo đề</button><button class="btn gray" onclick="showDashboard()">📚 Đề của tôi</button><button class="btn gray" onclick="showResults()">📊 Kết quả</button><span style="margin-left:auto"></span><span class="muted">${esc(session.user.email)}</span><button class="btn red small" onclick="logout()">Đăng xuất</button></div><div id="panel"></div>`);showDashboard()}async function logout(){await sb.auth.signOut();location.hash='';auth()}
async function showDashboard(){const r=await sb.from('exams').select('*').order('created_at',{ascending:false});$('panel').innerHTML=`<div class="card"><div class="row"><div><h2>📚 Đề của tôi</h2><div class="muted">Các đề được lưu online.</div></div><button class="btn" onclick="showCreate()">＋ Tạo đề mới</button></div>${r.error?'<p>❌ '+esc(r.error.message)+'</p>':r.data?.length?r.data.map(examCard).join(''):'<div class="empty">Chưa có đề. Hãy tạo đề đầu tiên.</div>'}</div>`}function examCard(e){const link=location.href.split('#')[0]+'#exam='+e.id;return `<div class="exam"><div class="row"><div><h3>${esc(e.title)}</h3><div class="muted">${e.questions.length} câu • ${e.duration_minutes} phút • ${e.published?'Đang mở':'Đã đóng'}</div></div><div class="toolbar" style="margin:0"><button class="btn small" onclick="copyText('${link}')">🔗 Copy link</button><button class="btn gray small" onclick="showResults('${e.id}')">📊 Điểm</button><button class="btn red small" onclick="deleteExam('${e.id}')">Xóa</button></div></div></div>`}async function deleteExam(id){if(!confirm('Xóa đề này và toàn bộ kết quả?'))return;await sb.from('exams').delete().eq('id',id);showDashboard()}
function showCreate(){questions=[];shell(`<div class="card"><div class="row"><div><h2>📝 Tạo đề Listening</h2><div class="muted">Import Word hoặc nhập thủ công.</div></div><button class="btn gray" onclick="showDashboard()">← Quay lại</button></div></div><div class="card"><h3>📄 Import Word (.docx)</h3><div class="upload"><input id="word" type="file" accept=".docx"><div id="wordStatus" class="muted" style="margin-top:7px"></div></div><div class="toolbar"><button class="btn" onclick="importWord()">📥 Đọc Word</button></div><div class="muted">Mẫu: Câu 1. ... / A. ... / B. ... / C. ... / D. ... / Đáp án: A</div></div><div class="card"><h3>ℹ️ Thông tin đề</h3><div class="grid"><div class="field"><label>Tên đề</label><input id="title" placeholder="Listening Test 01"></div><div class="field"><label>Thời gian (phút)</label><input id="duration" type="number" value="30" min="1"></div><div class="field full"><label>Hướng dẫn</label><textarea id="desc" placeholder="Read each question carefully."></textarea></div></div></div><div class="card"><h3>🎵 Audio</h3><div class="upload"><input id="audio" type="file" accept=".mp3,.wav,.m4a,audio/*"><div id="audioStatus" class="muted" style="margin-top:7px">Chưa chọn file</div><audio id="preview" class="hidden" controls style="width:100%;margin-top:10px"></audio></div></div><div class="card"><h3>❓ Câu hỏi</h3><div id="qs"></div><div class="toolbar"><button class="btn gray" onclick="addQ()">＋ Thêm câu</button><button class="btn green" onclick="saveExam()">☁️ Lưu & tạo link</button></div></div>`);addQ();$('audio').onchange=previewAudio}
function addQ(q={}){questions.push({text:q.text||'',options:q.options||['','','',''],answer:Number.isInteger(q.answer)?q.answer:0});renderQ()}function renderQ(){let h='';questions.forEach((q,i)=>h+=`<div class="q"><div class="qhead"><b>Câu ${i+1}</b><button class="btn red small" onclick="removeQ(${i})">Xóa</button></div><div class="field" style="margin-top:10px"><label>Nội dung</label><input class="qt" data-i="${i}" value="${esc(q.text)}"></div><div class="opts">${['A','B','C','D'].map((l,j)=>`<div class="opt"><b>${l}.</b><input class="qo" data-i="${i}" data-j="${j}" value="${esc(q.options[j])}"></div>`).join('')}</div><div class="field" style="margin-top:10px"><label>Đáp án đúng</label><select class="qa" data-i="${i}">${['A','B','C','D'].map((l,j)=>`<option value="${j}" ${q.answer===j?'selected':''}>${l}</option>`).join('')}</select></div></div>`);$('qs').innerHTML=h}function removeQ(i){questions.splice(i,1);if(!questions.length)addQ();else renderQ()}function syncQ(){document.querySelectorAll('.qt').forEach(e=>questions[+e.dataset.i].text=e.value);document.querySelectorAll('.qo').forEach(e=>questions[+e.dataset.i].options[+e.dataset.j]=e.value);document.querySelectorAll('.qa').forEach(e=>questions[+e.dataset.i].answer=+e.value)}
async function importWord(){const f=$('word').files[0];if(!f)return alert('Chọn file Word trước.');$('wordStatus').textContent='⏳ Đang đọc...';try{const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});const p=parseWord(r.value);if(!p.length)return $('wordStatus').textContent='⚠️ Không nhận diện được. Kiểm tra mẫu câu hỏi.';questions=p;renderQ();$('wordStatus').textContent=`✅ Đã nhập ${p.length} câu.`}catch(e){$('wordStatus').textContent='❌ '+e.message}}function parseWord(text){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[];let cur=null,keys={};for(const line of lines){let m=line.match(/^(?:Câu\s*)?(\d+)\s*[\.)\-:]\s*(.*)$/i);if(m){if(cur)out.push(cur);cur={n:+m[1],text:m[2],options:['','','',''],answer:0};continue}m=line.match(/^([ABCD])\s*[\.)\-:]\s*(.*)$/i);if(m&&cur){cur.options['ABCD'.indexOf(m[1].toUpperCase())]=m[2];continue}m=line.match(/^(?:Đáp\s*án|Answer|Key)\s*(?:câu\s*)?(\d+)\s*[:\-]?\s*([ABCD])/i);if(m)keys[+m[1]]='ABCD'.indexOf(m[2].toUpperCase())}if(cur)out.push(cur);return out.map(q=>({...q,answer:keys[q.n]??q.answer})).filter(q=>q.text&&q.options.every(Boolean)).map(({n,...q})=>q)}
function previewAudio(){const f=$('audio').files[0];if(!f)return;$('audioStatus').textContent=`🎵 ${f.name} • ${(f.size/1048576).toFixed(2)} MB`;$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')}
async function saveExam(){syncQ();const title=$('title').value.trim(),f=$('audio').files[0];if(!title||!questions.length||questions.some(q=>!q.text||q.options.some(x=>!x.trim())))return alert('Hãy điền đủ tên đề và câu hỏi.');let url=null;if(f){if(f.size>50*1024*1024)return alert('MP3 quá lớn. Hãy dùng file dưới 50 MB.');const u=(await sb.auth.getUser()).data.user;const path=`${u.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('listening-audio').upload(path,f,{contentType:f.type||'audio/mpeg'});if(up.error)return alert('Upload MP3 lỗi: '+up.error.message);url=sb.storage.from('listening-audio').getPublicUrl(path).data.publicUrl}const clean=questions.map(q=>({text:q.text,options:q.options})),keys=questions.map(q=>q.answer),u=(await sb.auth.getUser()).data.user;const r=await sb.from('exams').insert({owner_id:u.id,title,description:$('desc').value,duration_minutes:+$('duration').value||30,audio_url:url,audio_name:f?.name||'',questions:clean,answer_key:keys,published:true}).select().single();if(r.error)return alert('Lưu đề lỗi: '+r.error.message);alert('🎉 Đã lưu đề và upload audio!');showDashboard();setTimeout(()=>copyText(location.href.split('#')[0]+'#exam='+r.data.id),400)}
async function showResults(examId){let q=sb.from('submissions').select('*,exams!inner(title,owner_id)').order('submitted_at',{ascending:false});if(examId)q=q.eq('exam_id',examId);const r=await q;window.lastRows=r.data||[];shell(`<div class="card"><div class="row"><div><h2>📊 Kết quả</h2><div class="muted">Điểm được lưu online.</div></div><div class="toolbar" style="margin:0"><button class="btn gray" onclick="showDashboard()">← Đề của tôi</button><button class="btn green" onclick="exportCSV()">📥 Xuất Excel/CSV</button></div></div>${r.error?'<p>❌ '+esc(r.error.message)+'</p>':window.lastRows.length?`<div style="overflow:auto"><table><thead><tr><th>Đề</th><th>Họ tên</th><th>MSSV</th><th>Đúng</th><th>Điểm</th><th>Thời gian</th></tr></thead><tbody>${window.lastRows.map(x=>`<tr><td>${esc(x.exams?.title)}</td><td>${esc(x.student_name)}</td><td>${esc(x.student_id)}</td><td>${x.correct_count}/${x.total_questions}</td><td><b>${x.score}</b></td><td>${new Date(x.submitted_at).toLocaleString('vi-VN')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có học sinh nộp bài.</div>'}</div>`)}
function exportCSV(){const rows=window.lastRows||[];const csv=['Đề,Họ tên,MSSV,Đúng,Tổng,Điểm,Thời gian',...rows.map(x=>[x.exams?.title,x.student_name,x.student_id,x.correct_count,x.total_questions,x.score,new Date(x.submitted_at).toLocaleString('vi-VN')].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='ket-qua-listening.csv';a.click()}
async function loadPublicExam(id){if(!configured)return setup();const r=await sb.rpc('get_public_exam',{p_exam_id:id});if(r.error||!r.data)return shell(`<div class="card" style="margin-top:35px"><h2>❌ Không tìm thấy đề</h2><p>${esc(r.error?.message||'Link không hợp lệ hoặc đề đã đóng.')}</p></div>`);currentExam=r.data;renderStudent(r.data)}
function renderStudent(ex){shell(`<div class="card" style="margin-top:25px"><span class="badge" style="background:#dbeafe;color:#1d4ed8;border:0">🎧 BÀI THI LISTENING</span><h1 style="margin:10px 0">${esc(ex.title)}</h1><p>${esc(ex.description||'')}</p>${ex.audio_url?`<audio controls style="width:100%;margin:10px 0" src="${esc(ex.audio_url)}"></audio>`:'<div class="notice warn">Đề này chưa có file nghe.</div>'}<div class="grid"><div class="field"><label>Họ và tên *</label><input id="studentName" placeholder="Nguyễn Văn A"></div><div class="field"><label>MSSV (nếu có)</label><input id="studentId" placeholder="B23xxxxx"></div></div><div id="studentQs"></div><div id="countdown" class="notice" style="margin-top:15px">⏱️ Đang chuẩn bị...</div><button class="btn green" onclick="submitStudent(false)">Nộp bài</button><div id="studentResult"></div></div>`);window.studentAnswers=Array(ex.questions.length).fill(null);$('studentQs').innerHTML=ex.questions.map((q,i)=>`<div class="studentq"><b>Câu ${i+1}. ${esc(q.text)}</b>${q.options.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" onchange="studentAnswers[${i}]=${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join('')}</div>`).join('');startTimer(ex.duration_minutes*60)}function startTimer(sec){clearInterval(timer);let left=sec;const tick=()=>{if($('countdown'))$('countdown').textContent=`⏱️ Còn ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(timer);submitStudent(true)}left--};tick();timer=setInterval(tick,1000)}
async function submitStudent(auto){const name=$('studentName').value.trim();if(!name&&!auto)return alert('Hãy nhập họ tên.');if(!auto&&!confirm('Bạn chắc chắn muốn nộp bài?'))return;clearInterval(timer);const r=await sb.rpc('submit_exam',{p_exam_id:currentExam.id,p_student_name:name||'Không ghi tên',p_student_id:$('studentId').value.trim(),p_answers:window.studentAnswers});if(r.error)return alert('Không thể nộp bài: '+r.error.message);$('studentResult').innerHTML=`<div class="card" style="margin-top:18px"><div class="result">${r.data.score}/10</div><p style="text-align:center">Đúng <b>${r.data.correct_count}/${r.data.total_questions}</b> câu. Bài đã được lưu.</p></div>`;document.querySelectorAll('input,button').forEach(x=>x.disabled=true)}
function copyText(t){navigator.clipboard?.writeText(t);alert('🔗 Đã sao chép link đề!')}start();
</script></body></html>
