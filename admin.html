<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Exam Studio - Giáo viên</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 24px rgba(15,23,42,.06)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.btn.red{background:#dc2626}.btn.green{background:#16a34a}.muted{color:#64748b;font-size:14px}.hidden{display:none}.auth{max-width:450px;margin:50px auto}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.search{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:16px}.stat span{color:#64748b;font-size:14px}.stat b{display:block;font-size:27px;margin-top:5px}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:11px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.badge.off{background:#f1f5f9;color:#475569}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e2e8f0;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:13px}.pill{padding:5px 9px;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-weight:700}.detail{background:#f8fafc;border-radius:12px;padding:14px;margin-top:10px}.correct{color:#15803d;font-weight:700}.wrong{color:#b91c1c;font-weight:700}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:22px}.close{float:right;border:0;background:#eef2ff;border-radius:9px;padding:8px 11px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}th,td{padding:8px;font-size:13px}}@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:16px 12px}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Listening Exam Studio</h1><div>👨‍🏫 Trang quản lý giáo viên</div></div></header><main class="wrap"><div id="app"></div></main><div id="modalRoot"></div><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);const app=document.getElementById('app');let exams=[],allSubmissions=[],currentExamId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const{data:{session}}=await sb.auth.getSession();session?dashboard(session):auth()}function auth(){app.innerHTML='<div class="auth card"><h2>🔐 Đăng nhập giáo viên</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mật khẩu</label><input id="pass" type="password"></div><button class="btn" id="loginBtn">Đăng nhập</button><p id="msg" class="muted"></p></div>';document.getElementById('loginBtn').onclick=login}async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value,r=await sb.auth.signInWithPassword({email,password});if(r.error)document.getElementById('msg').textContent='❌ '+r.error.message;else dashboard(r.data.session)}async function dashboard(session){app.innerHTML='<div class="row"><div><h2>📊 Bảng điều khiển</h2><span class="muted">'+esc(session.user.email)+'</span></div><div class="toolbar"><button class="btn" id="createBtn">＋ Tạo đề</button><button class="btn green" id="manageBtn">⚙️ Quản lý đề</button><button class="btn gray" id="refreshBtn">↻ Làm mới</button><button class="btn red" id="logoutBtn">Đăng xuất</button></div></div><div id="stats"></div><div id="list"></div><div id="results" class="card hidden"></div>';document.getElementById('createBtn').onclick=()=>location.href='./';document.getElementById('manageBtn').onclick=()=>location.href='./manage.html';document.getElementById('refreshBtn').onclick=loadExams;document.getElementById('logoutBtn').onclick=logout;loadExams()}async function loadExams(){const{data,error}=await sb.from('exams').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').innerHTML='<div class="card">❌ '+esc(error.message)+'</div>';return}exams=data||[];let total=0;for(const e of exams){const r=await sb.from('submissions').select('id',{count:'exact',head:true}).eq('exam_id',e.id);total+=r.count||0}document.getElementById('stats').innerHTML='<div class="stats"><div class="stat"><span>📝 Đề thi</span><b>'+exams.length+'</b></div><div class="stat"><span>👨‍🎓 Lượt làm</span><b>'+total+'</b></div><div class="stat"><span>🟢 Đang mở</span><b>'+exams.filter(x=>x.published).length+'</b></div><div class="stat"><span>👨‍🏫 Tài khoản</span><b>Giáo viên</b></div></div>';renderExamList()}function renderExamList(){document.getElementById('list').innerHTML='<div class="card"><div class="row"><div><h2>📝 Quản lý đề thi</h2><div class="muted">Quản lý link và xem kết quả từng đề</div></div><button class="btn green" id="exportAllBtn">📥 Xuất tất cả</button></div>'+(exams.length?exams.map(card).join(''):'<p class="muted">Chưa có đề.</p>')+'</div>';document.getElementById('exportAllBtn').onclick=exportAll;document.querySelectorAll('[data-result-id]').forEach(b=>b.addEventListener('click',()=>showResults(b.dataset.resultId)));document.querySelectorAll('[data-copy-id]').forEach(b=>b.addEventListener('click',()=>copyLink(b.dataset.copyId)));document.querySelectorAll('[data-delete-id]').forEach(b=>b.addEventListener('click',()=>removeExam(b.dataset.deleteId)))}function card(e){const link=location.origin+location.pathname.replace(/admin\.html$/,'')+'#exam='+e.id;const qs=e.questions??e.question??[];return '<div class="exam"><div class="row"><div><b>'+esc(e.title)+'</b><div class="muted">'+(qs.length||0)+' câu • '+e.duration_minutes+' phút • '+new Date(e.created_at).toLocaleString('vi-VN')+'</div><div style="margin-top:7px"><span class="badge '+(e.published?'':'off')+'">'+(e.published?'Đang mở':'Đã đóng')+'</span></div></div><div class="toolbar"><button class="btn" data-copy-id="'+esc(link)+'">🔗 Copy link</button><button class="btn gray" data-result-id="'+esc(e.id)+'">📊 Kết quả</button><button class="btn red" data-delete-id="'+esc(e.id)+'">Xóa</button></div></div></div>'}async function showResults(id){currentExamId=id;const e=exams.find(x=>String(x.id)===String(id)),box=document.getElementById('results');box.classList.remove('hidden');box.scrollIntoView({behavior:'smooth',block:'start'});box.innerHTML='<h2>📊 Kết quả: '+esc(e?.title||'')+'</h2><p class="muted">Đang tải dữ liệu...</p>';const r=await sb.from('submissions').select('*').eq('exam_id',id).order('submitted_at',{ascending:false});if(r.error){box.innerHTML+='<p>❌ '+esc(r.error.message)+'</p>';return}allSubmissions=r.data||[];renderResults(e,allSubmissions)}function renderResults(e,rows){const avg=rows.length?rows.reduce((s,x)=>s+Number(x.score||0),0)/rows.length:0,high=rows.length?Math.max(...rows.map(x=>Number(x.score||0))):0,box=document.getElementById('results'),qs=e?.questions??e?.question??[];box.innerHTML='<div class="row"><div><h2>📊 Kết quả: '+esc(e?.title||'')+'</h2><span class="muted">'+rows.length+' bài đã nộp</span></div><div class="toolbar"><button class="btn green" id="exportExamBtn">📥 Xuất Excel/CSV</button><button class="btn gray" id="closeResultsBtn">Đóng</button></div></div><div class="stats"><div class="stat"><span>👥 Bài đã nộp</span><b>'+rows.length+'</b></div><div class="stat"><span>📈 Điểm trung bình</span><b>'+avg.toFixed(2)+'</b></div><div class="stat"><span>🏆 Điểm cao nhất</span><b>'+high.toFixed(2)+'</b></div><div class="stat"><span>📝 Số câu</span><b>'+qs.length+'</b></div></div><div class="toolbar" style="margin:14px 0"><input class="search" id="studentSearch" placeholder="🔎 Tìm theo họ tên hoặc MSSV..."></div><div id="resultsTable"></div>';document.getElementById('exportExamBtn').onclick=()=>exportExam(e.id);document.getElementById('closeResultsBtn').onclick=()=>box.classList.add('hidden');document.getElementById('studentSearch').oninput=x=>filterResults(x.target.value);renderTable(rows,e)}function filterResults(q){const e=exams.find(x=>String(x.id)===String(currentExamId));q=q.trim().toLowerCase();renderTable(allSubmissions.filter(x=>(String(x.student_name||'')+' '+String(x.student_id||'')).toLowerCase().includes(q)),e)}function renderTable(rows,e){const t=document.getElementById('resultsTable');if(!rows.length){t.innerHTML='<p class="muted">Chưa có bài phù hợp.</p>';return}t.innerHTML='<div style="overflow:auto"><table><thead><tr><th>#</th><th>Họ tên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Nộp lúc</th><th>Chi tiết</th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(x.student_name)+'</b></td><td>'+esc(x.student_id)+'</td><td><span class="pill">'+esc(x.score)+'</span></td><td>'+esc(x.correct_count)+'/'+esc(x.total_questions)+'</td><td>'+new Date(x.submitted_at).toLocaleString('vi-VN')+'</td><td><button class="btn gray detailBtn" data-sub-id="'+esc(x.id)+'">Xem bài</button></td></tr>').join('')+'</tbody></table></div>';document.querySelectorAll('.detailBtn').forEach(b=>b.onclick=()=>viewSubmission(b.dataset.subId))}function viewSubmission(id){const row=allSubmissions.find(x=>String(x.id)===String(id));if(!row)return;const e=exams.find(x=>String(x.id)===String(row.exam_id));let answers=row.answers||row.student_answers||{};if(typeof answers==='string'){try{answers=JSON.parse(answers)}catch{answers={}}}let key=e?.answer_key??row.answer_key??[];if(typeof key==='string'){try{key=JSON.parse(key)}catch{key=[]}}if(!Array.isArray(key))key=Object.values(key||{});let qs=e?.questions??e?.question??[];if(typeof qs==='string'){try{qs=JSON.parse(qs)}catch{qs=[]}}function idx(v){if(v===undefined||v===null||v==='')return null;if(typeof v==='object'&&v.value!==undefined)v=v.value;const s=String(v).trim();if(/^[A-Da-d]$/.test(s))return s.toUpperCase().charCodeAt(0)-65;if(/^\d+$/.test(s))return Number(s);return null}let html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>📋 Chi tiết bài làm</h2><p><b>Họ tên:</b> '+esc(row.student_name)+'<br><b>MSSV:</b> '+esc(row.student_id)+'<br><b>Điểm:</b> '+esc(row.score)+' • <b>Đúng:</b> '+esc(row.correct_count)+'/'+esc(row.total_questions)+'</p><hr>';qs.forEach((q,i)=>{const given=idx(answers[String(i)]??answers[i]??answers[q.id]),correct=idx(key[i]),ok=given!==null&&correct!==null&&given===correct,opts=q.options||[];const givenText=given===null?'Chưa trả lời':(opts[given]??String(given)),correctText=correct===null?'Chưa có đáp án':(opts[correct]??String(correct));html+='<div class="detail"><b>Câu '+(i+1)+'.</b> '+esc(q.text||q.question||'')+'<br><span class="'+(ok?'correct':'wrong')+'">'+(ok?'✅ Đúng':'❌ Sai')+'</span><br>Đáp án chọn: <b>'+esc(given===null?'Chưa trả lời':String(given)+'. '+givenText)+'</b> • Đáp án đúng: <b>'+esc(correct===null?'Chưa có đáp án':String(correct)+'. '+correctText)+'</b></div>'});html+='</div></div>';document.getElementById('modalRoot').innerHTML=html}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function csv(rows,filename){if(!rows.length)return alert('Chưa có dữ liệu.');const keys=Object.keys(rows[0]);const text='\ufeff'+[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function exportExam(id){const e=exams.find(x=>String(x.id)===String(id));const r=await sb.from('submissions').select('student_name,student_id,score,correct_count,total_questions,submitted_at').eq('exam_id',id).order('submitted_at');csv((r.data||[]).map(x=>({'Đề':e?.title||'',...x})),'ket-qua-listening.csv')}async function exportAll(){let rows=[];for(const e of exams){const r=await sb.from('submissions').select('student_name,student_id,score,correct_count,total_questions,submitted_at').eq('exam_id',e.id);(r.data||[]).forEach(x=>rows.push({'Đề':e.title,...x}))}csv(rows,'tat-ca-ket-qua-listening.csv')}async function removeExam(id){if(!confirm('Xóa đề này?'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert(r.error.message);loadExams()}async function copyLink(x){try{await navigator.clipboard.writeText(x);alert('Đã copy link làm bài!')}catch{prompt('Copy link:',x)}}async function logout(){await sb.auth.signOut();auth()}init();</script></body></html>
