<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio - Giáo viên</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 24px rgba(15,23,42,.06)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.btn.red{background:#dc2626}.btn.green{background:#16a34a}.muted{color:#64748b;font-size:14px}.hidden{display:none}.auth{max-width:450px;margin:50px auto}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.search{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:16px}.stat span{color:#64748b;font-size:14px}.stat b{display:block;font-size:27px;margin-top:5px}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:11px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.badge.off{background:#f1f5f9;color:#475569}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e2e8f0;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:13px}.pill{padding:5px 9px;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-weight:700}.detail{background:#f8fafc;border-radius:12px;padding:14px;margin-top:10px}.correct{color:#15803d;font-weight:700}.wrong{color:#b91c1c;font-weight:700}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:22px}.close{float:right;border:0;background:#eef2ff;border-radius:9px;padding:8px 11px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:16px 12px}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 English Studio</h1><div>👨‍🏫 Trang quản lý giáo viên</div></div></header><main class="wrap"><div id="app"></div></main><div id="modalRoot"></div><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey),app=document.getElementById('app');let exams=[],allSubmissions=[],currentExamId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function parseJson(v,f){if(typeof v!=='string')return v??f;try{return JSON.parse(v)}catch{return f}}function idx(v){if(v===undefined||v===null||v==='')return null;const s=String(v).trim();if(/^[A-Da-d]$/.test(s))return s.toUpperCase().charCodeAt(0)-65;if(/^\d+$/.test(s))return Number(s);return null}function currentKey(e){let k=parseJson(e?.answer_key,[]);return Array.isArray(k)?k:Object.values(k||{})}function currentQuestions(e){let q=e?.questions??e?.question??[];return parseJson(q,[])}function recalcSubmission(s,e){const answers=parseJson(s.answers??s.student_answers,{});const key=currentKey(e),qs=currentQuestions(e);const total=qs.length||key.length||Number(s.total_questions||0);let correct=0;for(let i=0;i<total;i++){const a=idx(answers?.[String(i)]??answers?.[i]),c=idx(key[i]);if(a!==null&&c!==null&&a===c)correct++}const score=total?Number((correct/total*10).toFixed(2)):0;return {...s,exam_title:e?.title||s.exam_title,exam_id:e?.id||s.exam_id,correct_count:correct,total_questions:total,score}}async function init(){const{data:{session}}=await sb.auth.getSession();session?dashboard(session):auth()}function auth(){app.innerHTML='<div class="auth card"><h2>🔐 Đăng nhập giáo viên</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mật khẩu</label><input id="pass" type="password"></div><button class="btn" id="loginBtn">Đăng nhập</button><p id="msg" class="muted"></p></div>';loginBtn.onclick=login}async function login(){const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)msg.textContent='❌ '+r.error.message;else dashboard(r.data.session)}async function dashboard(session){app.innerHTML='<div class="row"><div><h2>📊 Bảng điều khiển</h2></div><div class="toolbar"><button class="btn" onclick="location.href=\'./manage.html\'">＋ Tạo đề</button><button class="btn green" onclick="location.href=\'./manage.html\'">⚙️ Quản lý đề</button><button class="btn gray" onclick="loadExams()">↻ Làm mới</button><button class="btn red" onclick="logout()">Đăng xuất</button></div></div><div id="stats"></div><div id="dashboard"></div><div id="list"></div><div id="results" class="card hidden"></div>';loadExams()}async function loadExams(){const r=await sb.from('exams').select('*').order('created_at',{ascending:false});if(r.error)return list.innerHTML='<div class="card">❌ '+esc(r.error.message)+'</div>';exams=r.data||[];let subs=[];for(const e of exams){const q=await sb.from('submissions').select('*').eq('exam_id',e.id);if(q.data)subs.push(...q.data.map(x=>recalcSubmission(x,e)))}allSubmissions=subs;renderDashboard();renderExamList()}function renderDashboard(){const rows=allSubmissions,avg=rows.length?rows.reduce((s,x)=>s+Number(x.score||0),0)/rows.length:0,high=rows.length?Math.max(...rows.map(x=>Number(x.score||0))):0,low=rows.length?Math.min(...rows.map(x=>Number(x.score||0))):0,pass=rows.length?rows.filter(x=>Number(x.score||0)>=5).length/rows.length*100:0,students=new Set(rows.map(x=>String(x.student_id||x.student_name||'').trim()).filter(Boolean)).size;stats.innerHTML='<div class="stats"><div class="stat"><span>📝 Đề thi</span><b>'+exams.length+'</b></div><div class="stat"><span>🟢 Đang mở</span><b>'+exams.filter(x=>x.published).length+'</b></div><div class="stat"><span>📋 Bài đã nộp</span><b>'+rows.length+'</b></div><div class="stat"><span>👨‍🎓 Sinh viên</span><b>'+students+'</b></div></div>';dashboard.innerHTML='<div class="card"><div class="row"><div><h2>📈 Tổng quan kết quả</h2><span class="muted">Dữ liệu được đối chiếu theo đáp án hiện tại của từng đề</span></div></div><div class="stats"><div class="stat"><span>📊 Điểm trung bình</span><b>'+avg.toFixed(2)+'</b></div><div class="stat"><span>🏆 Cao nhất</span><b>'+high.toFixed(2)+'</b></div><div class="stat"><span>📉 Thấp nhất</span><b>'+low.toFixed(2)+'</b></div><div class="stat"><span>🎯 Tỷ lệ đạt ≥ 5</span><b>'+pass.toFixed(1)+'%</b></div></div><h3>📚 Thống kê từng đề</h3>'+exams.map(e=>{const a=rows.filter(x=>String(x.exam_id)===String(e.id)),av=a.length?a.reduce((s,x)=>s+Number(x.score||0),0)/a.length:0,p=a.length?a.filter(x=>Number(x.score||0)>=5).length/a.length*100:0;return '<div class="exam"><div class="row"><div><b>'+esc(e.title)+'</b><div class="muted">'+a.length+' bài • TB '+av.toFixed(2)+' • Đạt '+p.toFixed(1)+'%</div></div><button class="btn gray" onclick="showResults(\''+e.id+'\')">📊 Xem kết quả</button></div><div class="bar" style="margin-top:10px"><i style="width:'+Math.min(100,av*10)+'%"></i></div></div>'}).join('')+'</div><div class="card"><h2>🏆 Top 10 kết quả</h2>'+rows.slice().sort((a,b)=>Number(b.score||0)-Number(a.score||0)).slice(0,10).map((x,i)=>'<div class="row" style="padding:9px 0;border-bottom:1px solid #e2e8f0"><div><b>#'+(i+1)+' '+esc(x.student_name||'')+'</b><div class="muted">'+esc(x.student_id||'')+' • '+esc(x.exam_title||'')+'</div></div><span class="pill">'+Number(x.score||0).toFixed(2)+'</span></div>').join('')+(rows.length?'':'<p class="muted">Chưa có bài nộp.</p>')+'</div>'}function renderExamList(){list.innerHTML='<div class="card"><div class="row"><div><h2>📝 Quản lý đề thi</h2><div class="muted">Quản lý link và xem kết quả từng đề</div></div><button class="btn green" onclick="exportAll()">📥 Xuất tất cả</button></div>'+exams.map(e=>card(e)).join('')+'</div>'}function card(e){const link=location.origin+location.pathname.replace(/admin\.html$/,'')+'#exam='+e.id,qs=currentQuestions(e);return '<div class="exam"><div class="row"><div><b>'+esc(e.title)+'</b><div class="muted">'+(qs.length||0)+' câu • '+e.duration_minutes+' phút</div><span class="badge '+(e.published?'':'off')+'">'+(e.published?'Đang mở':'Đã đóng')+'</span></div><div class="toolbar"><button class="btn" onclick="copyLink(\''+esc(link)+'\')">🔗 Copy link</button><button class="btn gray" onclick="showResults(\''+e.id+'\')">📊 Kết quả</button><button class="btn red" onclick="removeExam(\''+e.id+'\')">Xóa</button></div></div></div>'}async function showResults(id){currentExamId=id;const e=exams.find(x=>String(x.id)===String(id)),box=results;box.classList.remove('hidden');const r=await sb.from('submissions').select('*').eq('exam_id',id).order('submitted_at',{ascending:false});allSubmissions=(r.data||[]).map(x=>recalcSubmission(x,e));const avg=allSubmissions.length?allSubmissions.reduce((s,x)=>s+Number(x.score||0),0)/allSubmissions.length:0;box.innerHTML='<div class="row"><h2>📊 Kết quả: '+esc(e?.title||'')+'</h2><button class="btn gray" onclick="results.classList.add(\'hidden\')">Đóng</button></div><div class="stats"><div class="stat"><span>👥 Bài nộp</span><b>'+allSubmissions.length+'</b></div><div class="stat"><span>📈 Điểm TB</span><b>'+avg.toFixed(2)+'</b></div></div><div id="resultsTable"></div>';resultsTable.innerHTML='<div style="overflow:auto"><table><tr><th>#</th><th>Họ tên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Nộp lúc</th><th></th></tr>'+allSubmissions.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.student_name)+'</td><td>'+esc(x.student_id)+'</td><td><span class="pill">'+Number(x.score||0).toFixed(2)+'</span></td><td>'+esc(x.correct_count)+'/'+esc(x.total_questions)+'</td><td>'+new Date(x.submitted_at).toLocaleString('vi-VN')+'</td><td><button class="btn gray" onclick="viewSubmission(\''+x.id+'\')">Xem bài</button></td></tr>').join('')+'</table></div>'}function viewSubmission(id){const row=allSubmissions.find(x=>String(x.id)===String(id));if(!row)return;const e=exams.find(x=>String(x.id)===String(row.exam_id));const fresh=recalcSubmission(row,e);let answers=parseJson(row.answers??row.student_answers,{}),key=currentKey(e),qs=currentQuestions(e);const letter=v=>{const i=idx(v);return i===null?'':String.fromCharCode(65+i)};let html='<div class="modal-bg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>📋 Chi tiết bài làm</h2><div class="detail"><b>Kết quả hiện tại:</b> '+fresh.correct_count+'/'+fresh.total_questions+' câu đúng • <b>'+fresh.score.toFixed(2)+' điểm</b></div>';qs.forEach((q,i)=>{const g=idx(answers[String(i)]??answers[i]),c=idx(key[i]),ok=g!==null&&c!==null&&g===c,o=q.options||[];html+='<div class="detail"><b>Câu '+(i+1)+'.</b> '+esc(q.text||q.question||'')+'<br><span class="'+(ok?'correct':'wrong')+'">'+(ok?'✅ Đúng':'❌ Sai')+'</span><br>Đáp án chọn: <b>'+esc(g===null?'Chưa trả lời':letter(g)+'. '+(o[g]||''))+'</b> • Đáp án đúng: <b>'+esc(c===null?'Chưa có đáp án':letter(c)+'. '+(o[c]||''))+'</b></div>'});modalRoot.innerHTML=html+'</div></div>'}function closeModal(){modalRoot.innerHTML=''}function copyLink(x){navigator.clipboard?.writeText(x).then(()=>alert('Đã copy link làm bài!')).catch(()=>prompt('Copy link:',x))}async function removeExam(id){if(!confirm('Xóa đề này?'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert(r.error.message);loadExams()}function exportAll(){const rows=allSubmissions;if(!rows.length)return alert('Chưa có dữ liệu.');const csv='\ufeff'+['Đề,Họ tên,MSSV,Điểm,Đúng,Tổng,Thời gian',...rows.map(x=>[x.exam_title||'',x.student_name||'',x.student_id||'',x.score||'',x.correct_count||'',x.total_questions||'',x.submitted_at||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='tat-ca-ket-qua.csv';a.click()}async function logout(){await sb.auth.signOut();auth()}init();</script></body></html>
