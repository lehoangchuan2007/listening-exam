<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Studio - Giáo viên</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#0f172a}
    .wrap{max-width:1200px;margin:auto;padding:24px 18px}
    .top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 0}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 24px rgba(15,23,42,.06)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .btn.gray{background:#e8eef7;color:#0f172a}.btn.red{background:#dc2626}.btn.green{background:#16a34a}
    .muted{color:#64748b;font-size:14px}.auth{max-width:450px;margin:50px auto}.field{margin:10px 0}
    .field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:16px}
    .stat span{color:#64748b;font-size:14px}.stat b{display:block;font-size:27px;margin-top:5px}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:11px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.badge.off{background:#f1f5f9;color:#475569}
    .pill{padding:5px 9px;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-weight:700}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}
    .dist{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:190px;margin-top:16px}.distcol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}
    .distbar{width:55%;margin:0 auto;background:#2563eb;border-radius:8px 8px 0 0;min-height:4px}.distlabel{font-size:13px;font-weight:700;margin-top:7px}.distcount{font-size:12px;color:#64748b;margin-bottom:4px}
    .error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:10px;margin-top:12px}
    @media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.dist{height:160px}}@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:16px 12px}.dist{gap:5px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>🎧 English Studio</h1>
      <div>👨‍🏫 Trang quản lý giáo viên</div>
    </div>
  </header>

  <main class="wrap">
    <div id="app"></div>
  </main>

  <script>
    const cfg = window.SUPABASE_CONFIG || {};
    const app = document.getElementById('app');
    let sb = null;
    let exams = [];
    let submissions = [];

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (m) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));

    function parseJson(value, fallback) {
      if (typeof value !== 'string') return value ?? fallback;
      try { return JSON.parse(value); } catch { return fallback; }
    }

    function normalizeAnswer(value) {
      if (value === undefined || value === null || value === '') return null;
      const s = String(value).trim();
      if (/^[A-Da-d]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
      if (/^\d+$/.test(s)) return Number(s);
      return null;
    }

    function getQuestions(exam) {
      return parseJson(exam?.questions ?? exam?.question, []);
    }

    function getAnswerKey(exam) {
      const key = parseJson(exam?.answer_key, []);
      return Array.isArray(key) ? key : Object.values(key || {});
    }

    function recalculate(submission, exam) {
      const answers = parseJson(submission.answers ?? submission.student_answers, {});
      const questions = getQuestions(exam);
      const key = getAnswerKey(exam);
      const total = questions.length || key.length || Number(submission.total_questions || 0);
      let correct = 0;

      for (let i = 0; i < total; i++) {
        const given = normalizeAnswer(answers?.[String(i)] ?? answers?.[i]);
        const correctAnswer = normalizeAnswer(key[i]);
        if (given !== null && correctAnswer !== null && given === correctAnswer) correct++;
      }

      return {
        ...submission,
        exam_id: exam?.id ?? submission.exam_id,
        exam_title: exam?.title ?? submission.exam_title,
        correct_count: correct,
        total_questions: total,
        score: total ? Number((correct / total * 10).toFixed(2)) : 0
      };
    }

    function showError(message) {
      app.innerHTML = `<div class="card"><h2>⚠️ Không tải được Dashboard</h2><div class="error">${esc(message)}</div><p class="muted">Hãy thử Ctrl + F5. Nếu vẫn lỗi, báo mình nội dung thông báo này.</p></div>`;
    }

    function authView() {
      app.innerHTML = `
        <div class="auth card">
          <h2>🔐 Đăng nhập giáo viên</h2>
          <div class="field"><label>Email</label><input id="loginEmail" type="email"></div>
          <div class="field"><label>Mật khẩu</label><input id="loginPassword" type="password"></div>
          <button class="btn" id="loginButton">Đăng nhập</button>
          <p id="loginMessage" class="muted"></p>
        </div>`;
      document.getElementById('loginButton').onclick = login;
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const result = await sb.auth.signInWithPassword({ email, password });
      if (result.error) {
        document.getElementById('loginMessage').textContent = '❌ ' + result.error.message;
        return;
      }
      await loadDashboard();
    }

    function dashboardShell() {
      app.innerHTML = `
        <div class="row">
          <div><h2>📊 Bảng điều khiển</h2></div>
          <div class="toolbar">
            <a class="btn" href="./manage.html">＋ Tạo đề</a>
            <a class="btn green" href="./manage.html">⚙️ Quản lý đề</a>
            <button class="btn gray" id="refreshButton">↻ Làm mới</button>
            <button class="btn red" id="logoutButton">Đăng xuất</button>
          </div>
        </div>
        <div id="summary"></div>
        <div id="dashboardContent"></div>
        <div id="examList"></div>`;

      document.getElementById('refreshButton').onclick = loadDashboard;
      document.getElementById('logoutButton').onclick = logout;
    }

    async function loadDashboard() {
      try {
        dashboardShell();

        const examResult = await sb.from('exams').select('*').order('created_at', { ascending:false });
        if (examResult.error) throw examResult.error;
        exams = examResult.data || [];

        const all = [];
        for (const exam of exams) {
          const result = await sb.from('submissions').select('*').eq('exam_id', exam.id);
          if (result.error) throw result.error;
          for (const submission of (result.data || [])) all.push(recalculate(submission, exam));
        }
        submissions = all;
        renderDashboard();
        renderExamList();
      } catch (error) {
        showError(error?.message || String(error));
      }
    }

    function renderDashboard() {
      const rows = submissions;
      const average = rows.length ? rows.reduce((sum, r) => sum + Number(r.score || 0), 0) / rows.length : 0;
      const highest = rows.length ? Math.max(...rows.map(r => Number(r.score || 0))) : 0;
      const lowest = rows.length ? Math.min(...rows.map(r => Number(r.score || 0))) : 0;
      const passed = rows.filter(r => Number(r.score || 0) >= 5).length;
      const students = new Set(rows.map(r => String(r.student_id || r.student_name || '').trim()).filter(Boolean)).size;
      const passRate = rows.length ? passed / rows.length * 100 : 0;

      document.getElementById('summary').innerHTML = `
        <div class="stats">
          <div class="stat"><span>📝 Đề thi</span><b>${exams.length}</b></div>
          <div class="stat"><span>🟢 Đang mở</span><b>${exams.filter(e => e.published).length}</b></div>
          <div class="stat"><span>📋 Bài đã nộp</span><b>${rows.length}</b></div>
          <div class="stat"><span>👨‍🎓 Sinh viên</span><b>${students}</b></div>
        </div>`;

      const bins = [0,0,0,0,0];
      rows.forEach(r => {
        const score = Number(r.score || 0);
        if (score < 5) bins[0]++;
        else if (score < 6.5) bins[1]++;
        else if (score < 8) bins[2]++;
        else if (score < 9) bins[3]++;
        else bins[4]++;
      });
      const labels = ['0–<5','5–<6.5','6.5–<8','8–<9','9–10'];
      const maxBin = Math.max(1, ...bins);

      document.getElementById('dashboardContent').innerHTML = `
        <div class="card">
          <h2>📈 Tổng quan kết quả</h2>
          <div class="stats">
            <div class="stat"><span>📊 Điểm trung bình</span><b>${average.toFixed(2)}</b></div>
            <div class="stat"><span>🏆 Cao nhất</span><b>${highest.toFixed(2)}</b></div>
            <div class="stat"><span>📉 Thấp nhất</span><b>${lowest.toFixed(2)}</b></div>
            <div class="stat"><span>🎯 Tỷ lệ đạt ≥ 5</span><b>${passRate.toFixed(1)}%</b></div>
          </div>
          <div class="stats">
            <div class="stat"><span>✅ Số bài đạt</span><b>${passed}</b></div>
            <div class="stat"><span>❌ Chưa đạt</span><b>${rows.length - passed}</b></div>
            <div class="stat"><span>🔁 Lượt làm / sinh viên</span><b>${students ? (rows.length / students).toFixed(2) : '0.00'}</b></div>
            <div class="stat"><span>📚 Có kết quả</span><b>${rows.length}</b></div>
          </div>
        </div>

        <div class="card">
          <h2>📊 Phân bố điểm</h2>
          <div class="dist">
            ${bins.map((n, i) => `
              <div class="distcol">
                <div class="distcount">${n} bài</div>
                <div class="distbar" style="height:${Math.max(4, n / maxBin * 135)}px"></div>
                <div class="distlabel">${labels[i]}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="card">
          <h2>🏆 Top 10 kết quả</h2>
          ${rows.slice().sort((a,b) => Number(b.score || 0) - Number(a.score || 0)).slice(0,10).map((r,i) => `
            <div class="row" style="padding:9px 0;border-bottom:1px solid #e2e8f0">
              <div><b>#${i+1} ${esc(r.student_name || '—')}</b><div class="muted">${esc(r.student_id || '')} • ${esc(r.exam_title || '')}</div></div>
              <span class="pill">${Number(r.score || 0).toFixed(2)}</span>
            </div>`).join('') || '<p class="muted">Chưa có bài nộp.</p>'}
        </div>`;
    }

    function renderExamList() {
      const html = exams.map(exam => {
        const questions = getQuestions(exam);
        const rows = submissions.filter(r => String(r.exam_id) === String(exam.id));
        const average = rows.length ? rows.reduce((sum,r) => sum + Number(r.score || 0),0) / rows.length : 0;
        const link = `${location.origin}${location.pathname.replace(/admin\.html$/, '')}#exam=${exam.id}`;

        return `<div class="exam">
          <div class="row">
            <div>
              <b>${esc(exam.title || 'Không tên')}</b>
              <div class="muted">${questions.length} câu • ${exam.duration_minutes || 0} phút • ${rows.length} bài nộp • TB ${average.toFixed(2)}</div>
              <span class="badge ${exam.published ? '' : 'off'}">${exam.published ? 'Đang mở' : 'Đã đóng'}</span>
            </div>
            <div class="toolbar">
              <button class="btn" onclick="copyLink(${JSON.stringify(link)})">🔗 Copy link</button>
              <a class="btn gray" href="./results.html?exam=${encodeURIComponent(exam.id)}">📊 Kết quả</a>
              <button class="btn red" onclick="removeExam(${JSON.stringify(exam.id)})">Xóa</button>
            </div>
          </div>
          <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100, average * 10)}%"></i></div>
        </div>`;
      }).join('');

      document.getElementById('examList').innerHTML = `<div class="card"><div class="row"><div><h2>📝 Danh sách đề</h2><div class="muted">Quản lý đề và mở trang kết quả riêng cho từng đề.</div></div><a class="btn green" href="./manage.html">＋ Tạo đề</a></div>${html || '<p class="muted">Chưa có đề thi.</p>'}</div>`;
    }

    async function removeExam(id) {
      if (!confirm('Xóa đề này?')) return;
      const result = await sb.from('exams').delete().eq('id', id);
      if (result.error) return alert(result.error.message);
      await loadDashboard();
    }

    function copyLink(link) {
      navigator.clipboard?.writeText(link)
        .then(() => alert('Đã copy link làm bài!'))
        .catch(() => prompt('Copy link:', link));
    }

    async function logout() {
      await sb.auth.signOut();
      authView();
    }

    async function init() {
      if (!window.supabase) return showError('Không tải được thư viện Supabase. Hãy thử Ctrl + F5.');
      if (!cfg.url || !cfg.anonKey) return showError('Thiếu cấu hình Supabase trong config.js.');
      try {
        sb = window.supabase.createClient(cfg.url, cfg.anonKey);
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;
        if (data?.session) await loadDashboard();
        else authView();
      } catch (error) {
        showError(error?.message || String(error));
      }
    }

    init();
  </script>
</body>
</html>
