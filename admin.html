<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Exam Studio - Giáo viên</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#0f172a}.wrap{max-width:1150px;margin:auto;padding:24px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:white;padding:22px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0f172a0a}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.btn.red{background:#dc2626}.btn.green{background:#16a34a}.muted{color:#64748b;font-size:14px}.hidden{display:none}.auth{max-width:450px;margin:50px auto}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.exam{border:1px solid #e2e8f0;border-radius:12px;padding:15px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.stat b{display:block;font-size:24px;margin-top:4px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}table{font-size:13px}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Listening Exam Studio</h1><div>👨‍🏫 Trang quản lý giáo viên</div></div></header><main class="wrap"><div id="app"></div></main><script>
const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);const app=document.getElementById('app');let exams=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){const {data:{session}}=await sb.auth.getSession();session?dashboard(session):auth()}
function auth(){app.innerHTML='<div class="auth card"><h2>🔐 Giáo viên</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mật khẩu</label><input id="pass" type="password"></div><button class="btn" onclick="login()">Đăng nhập</button><p id="msg" class="muted"></p></div>'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error)document.getElementById('msg').textContent='❌ '+r.error.message;else dashboard(r.data.session)}
async function dashboard(session){app.innerHTML='<div class="row"><div><h2>📊 Bảng điều khiển</h2><span class="muted">'+esc(session.user.email)+'</span></div><div><button class="btn" onclick="location.href=\'./\'">＋ Tạo đề</button> <button class="btn gray" onclick="loadExams()">↻ Làm mới</button> <button class="btn red" onclick="logout()">Đăng xuất</button></div></div><div id="stats"></div><div id="list"></div><div id="results" class="card hidden"></div>';loadExams()}
async function loadExams(){const {data,error}=await sb.from('exams').select('id,title,description,duration_minutes,questions,published,created_at,owner_id').order('created_at',{ascending:false});if(error){document.getElementById('list').innerHTML='<div class="card">❌ '+esc(error.message)+'</div>';return}exams=data||[];let total=0;for(const e of exams){const r=await sb.from('submissions').select('id',{count:'exact',head:true}).eq('exam_id',e.id);total+=r.count||0}document.getElementById('stats').innerHTML='<div class="stats"><div class="stat">Đề thi<b>'+exams.length+'</b></div><div class="stat">Lượt làm<b>'+total+'</b></div><div class="stat">Trạng thái<b>'+exams.filter(x=>x.published).length+'</b></div><div class="stat">Tài khoản<b>Giáo viên</b></div></div>';document.getElementById('list').innerHTML='<div class="card"><div class="row"><h2>📝 Đề thi</h2><button class="btn green" onclick="exportAll()">📥 Xuất Excel/CSV</button></div>'+(exams.length?exams.map(card).join(''):'<p class="muted">Chưa có đề.</p>')+'</div>'}
function card(e){const link=location.origin+location.pathname.replace(/admin\.html$/,'')+'#exam='+e.id;return '<div class="exam"><div class="row"><div><b>'+esc(e.title)+'</b><div class="muted">'+(e.questions?.length||0)+' câu • '+e.duration_minutes+' phút • '+new Date(e.created_at).toLocaleString('vi-VN')+'</div></div><div><button class="btn small" onclick="copyLink('+JSON.stringify(link)+')">🔗 Copy link</button> <button class="btn gray" onclick="showResults('+JSON.stringify(e.id)+')">📊 Kết quả</button> <button class="btn red" onclick="removeExam('+JSON.stringify(e.id)+')">Xóa</button></div></div></div>'}
async function showResults(id){const e=exams.find(x=>x.id===id);const box=document.getElementById('results');box.classList.remove('hidden');box.innerHTML='<h2>📊 Kết quả: '+esc(e?.title||'')+'</h2><p class="muted">Đang tải...</p>';const r=await sb.from('submissions').select('*').eq('exam_id',id).order('submitted_at',{ascending:false});if(r.error){box.innerHTML+='<p>❌ '+esc(r.error.message)+'</p>';return}const rows=r.data||[];box.innerHTML='<div class="row"><h2>📊 Kết quả: '+esc(e?.title||'')+'</h2><button class="btn green" onclick="exportExam('+JSON.stringify(id)+')">📥 Xuất CSV</button></div>'+(rows.length?'<div style="overflow:auto"><table><thead><tr><th>Họ tên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Nộp lúc</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.student_name)+'</td><td>'+esc(x.student_id)+'</td><td><b>'+esc(x.score)+'</b></td><td>'+esc(x.correct_count)+'/'+esc(x.total_questions)+'</td><td>'+new Date(x.submitted_at).toLocaleString('vi-VN')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Chưa có sinh viên nộp bài.</p>')}
function csv(rows,filename){if(!rows.length)return alert('Chưa có dữ liệu.');const keys=Object.keys(rows[0]);const text='\ufeff'+[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click()}
async function exportExam(id){const r=await sb.from('submissions').select('student_name,student_id,score,correct_count,total_questions,submitted_at').eq('exam_id',id).order('submitted_at');csv(r.data||[],'ket-qua-listening.csv')}
async function exportAll(){let rows=[];for(const e of exams){const r=await sb.from('submissions').select('student_name,student_id,score,correct_count,total_questions,submitted_at').eq('exam_id',e.id);(r.data||[]).forEach(x=>rows.push({'De':e.title,...x}))}csv(rows,'tat-ca-ket-qua-listening.csv')}
async function removeExam(id){if(!confirm('Xóa đề này?'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert(r.error.message);loadExams()}
async function copyLink(x){await navigator.clipboard.writeText(x);alert('Đã copy link làm bài!')}
async function logout(){await sb.auth.signOut();auth()}init();
</script></body></html>
