<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch sử làm bài - English Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:28px 18px}.wrap{max-width:1050px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 6px 24px #0f172a0b}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.muted{color:#64748b;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.item{border:1px solid #e2e8f0;border-radius:15px;padding:17px;margin:12px 0}.score{font-size:26px;font-weight:900;color:#2563eb}.rubric{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.rubric span{padding:7px 10px;border:1px solid #dbeafe;border-radius:9px;background:#eff6ff}.essay{white-space:pre-wrap;line-height:1.65;background:#f8fafc;padding:14px;border-radius:10px}.notice{padding:13px;border-radius:10px;background:#eff6ff;color:#1e40af}.danger{background:#fef2f2;color:#991b1b}.review{border-radius:14px;padding:15px;margin:10px 0;border:1px solid #e2e8f0}.overall{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;border-left:5px solid #2563eb}.strengths{background:#f0fdf4;border-color:#bbf7d0;color:#166534;border-left:5px solid #16a34a}.improvements{background:#fff7ed;border-color:#fed7aa;color:#9a3412;border-left:5px solid #f97316}.grammar{background:#fef2f2;border-color:#fecaca;color:#991b1b;border-left:5px solid #dc2626}.phrases{background:#faf5ff;border-color:#e9d5ff;color:#6b21a8;border-left:5px solid #9333ea}.rubric-box{background:#f0f9ff;border-color:#bae6fd;color:#0c4a6e;border-left:5px solid #0284c7}.model{background:#f8fafc;border:1px dashed #cbd5e1;color:#475569}.review ul{margin:8px 0 0 20px}.review li{margin:5px 0}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv div{background:#fff;padding:9px 10px;border-radius:9px;border:1px solid #e2e8f0}.empty{color:#64748b;font-style:italic}@media(max-width:700px){.kv{grid-template-columns:1fr}}
</style>
</head>
<body><header class="top"><div class="wrap"><h1>📊 Lịch sử làm bài</h1><div>🧑‍🎓 Xem lại các bài đã nộp</div></div></header><main class="wrap"><div class="row"><h2>📚 Lịch sử của bạn</h2><button class="btn gray" onclick="location.href='./student.html'">← Về thư viện đề</button></div><div id="app" class="card">⏳ Đang tải...</div></main>
<script>
const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);let writing=[],listening=[],exams={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const parse=(v,f)=>{if(v==null)return f;if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return f}};
const list=v=>{const x=parse(v,[]);if(Array.isArray(x))return x;if(x&&typeof x==='object')return Object.values(x);return[]};
function rubricFor(r){const e=exams[r.exam_id]||{},rub=Array.isArray(e.writing_rubric)?e.writing_rubric:parse(e.writing_rubric,[]),scores=parse(r.rubric_scores,{});return rub.map(x=>{const n=String(x.name||x.title||'').trim(),key=n.toLowerCase();let v=scores[n];if(v==null){if(key.includes('task response'))v=r.task_response;else if(key.includes('coherence'))v=r.coherence;else if(key.includes('vocabulary'))v=r.vocabulary;else if(key.includes('grammar'))v=r.grammar}return{name:n,max:Number(x.max??x.max_score??0),value:Number(v??0)}}).filter(x=>x.name)}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="notice danger">🔐 Bạn cần đăng nhập tài khoản sinh viên.</div>';return}const wr=await sb.rpc('get_my_writing_submissions');if(wr.error){app.innerHTML='<div class="notice danger">❌ Không tải được lịch sử Writing: '+esc(wr.error.message)+'</div>';return}writing=wr.data||[];const lr=await sb.from('submissions').select('*').eq('student_user_id',session.user.id).order('submitted_at',{ascending:false});if(!lr.error)listening=lr.data||[];const ids=[...new Set([...writing,...listening].map(x=>x.exam_id).filter(Boolean))];if(ids.length){const er=await sb.from('exams').select('id,title,exam_type,questions,answer_key,writing_rubric').in('id',ids);if(!er.error)(er.data||[]).forEach(e=>exams[e.id]=e)}render()}
function render(){if(!writing.length&&!listening.length){app.innerHTML='<div class="notice">📭 Chưa có bài làm nào.</div>';return}let h='';if(writing.length){h+='<div class="card"><div class="row"><h2>✍️ Writing</h2><span class="muted">'+writing.length+' bài</span></div>';h+=writing.map((r,i)=>{const e=exams[r.exam_id]||{},rr=rubricFor(r);return '<div class="item"><div class="row"><div><h3>'+esc(e.title||'Đề Writing')+'</h3><div class="muted">'+new Date(r.created_at).toLocaleString('vi-VN')+' • '+esc(r.word_count)+' từ</div></div><div class="score">'+esc(r.total_score)+'/10</div></div><div class="rubric">'+rr.map(x=>'<span>'+esc(x.name)+': <b>'+esc(x.value)+'</b>/'+esc(x.max)+'</span>').join('')+'</div><p>'+esc(r.overall_comment||'')+'</p><button class="btn gray" onclick="viewWriting('+i+')">📋 Xem bài Writing</button></div>'}).join('');h+='</div>'}if(listening.length){h+='<div class="card"><div class="row"><h2>🎧 Listening / trắc nghiệm</h2><span class="muted">'+listening.length+' bài</span></div>';h+=listening.map(r=>'<div class="item"><div class="row"><div><h3>'+esc((exams[r.exam_id]||{}).title||'Đề thi')+'</h3><div class="muted">'+esc(r.submitted_at||'')+'</div></div><div class="score">'+esc(r.score)+'</div></div><p>Đúng: '+esc(r.correct_count||0)+'/'+esc(r.total_questions||0)+'</p></div>').join('');h+='</div>'}h+='<div id="detail"></div>';app.innerHTML=h}
function renderList(title,icon,items,cls){if(!items.length)return '<div class="review '+cls+'"><b>'+icon+' '+title+'</b><div class="empty">Không có dữ liệu.</div></div>';return '<div class="review '+cls+'"><b>'+icon+' '+title+'</b><ul>'+items.map(x=>'<li>'+esc(typeof x==='string'?x:(x.text||x.description||JSON.stringify(x)))+'</li>').join('')+'</ul></div>'}
function viewWriting(i){const r=writing[i],e=exams[r.exam_id]||{},rr=rubricFor(r),strengths=list(r.strengths),improvements=list(r.improvements),errors=list(r.grammar_errors),phrases=list(r.better_phrases),model=r.ai_model||r.model||'Gemini AI';let html='<div class="card"><div class="row"><h2>📝 '+esc(e.title||'Bài Writing')+'</h2><button class="btn gray" onclick="document.getElementById(\'detail\').innerHTML=\'\'">Đóng</button></div><p class="muted">'+esc(r.word_count)+' từ • <b>'+esc(r.total_score)+'/10</b> • '+new Date(r.created_at).toLocaleString('vi-VN')+'</p>';
html+='<div class="review rubric-box"><b>🔵 Điểm theo từng tiêu chí</b><div class="kv">'+(rr.length?rr.map(x=>'<div>'+esc(x.name)+' <b>'+esc(x.value)+'</b>/'+esc(x.max)+'</div>').join(''):'<div>Chưa có điểm chi tiết.</div>')+'</div></div>';
html+='<h3>📝 Bài viết</h3><div class="essay">'+esc(r.essay||'Chưa có bài viết.')+'</div>';
html+='<div class="review overall"><b>🟦 Nhận xét tổng quan của AI</b><p>'+esc(r.overall_comment||'Chưa có nhận xét.')+'</p></div>';
html+=renderList('Điểm mạnh','🟢',strengths,'strengths');html+=renderList('Cần cải thiện','🟠',improvements,'improvements');
if(errors.length){html+='<div class="review grammar"><b>🔴 Lỗi ngữ pháp</b>';errors.forEach(x=>{if(typeof x==='object')html+='<div class="kv" style="margin-top:8px"><div><b>Gốc:</b> '+esc(x.original||'')+'</div><div><b>Sửa:</b> '+esc(x.correction||'')+'</div></div><p>'+esc(x.explanation||'')+'</p>';else html+='<div class="answer">'+esc(x)+'</div>'});html+='</div>'}else html+='<div class="review grammar"><b>🔴 Lỗi ngữ pháp</b><p class="empty">Không có lỗi được AI ghi nhận.</p></div>';
if(phrases.length){html+='<div class="review phrases"><b>🟣 Cách diễn đạt tốt hơn</b>';phrases.forEach(x=>{if(typeof x==='object')html+='<div class="kv" style="margin-top:8px"><div><b>Gốc:</b> '+esc(x.original||'')+'</div><div><b>Gợi ý:</b> '+esc(x.better||x.suggestion||'')+'</div></div>';else html+='<div class="answer">'+esc(x)+'</div>'});html+='</div>'}else html+='<div class="review phrases"><b>🟣 Cách diễn đạt tốt hơn</b><p class="empty">Không có gợi ý thêm.</p></div>';
html+='<div class="review model"><b>🤖 Model AI đã chấm</b><div>'+esc(model)+'</div></div></div>';document.getElementById('detail').innerHTML=html;document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
load();
</script></body></html>
