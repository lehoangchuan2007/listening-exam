<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>English Studio - Kết quả</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}
    .wrap{max-width:1200px;margin:auto;padding:22px 18px}
    .top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .gray{background:#e8eef7;color:#0f172a}
    .tablewrap{overflow:auto}
    .table{width:100%;border-collapse:collapse;min-width:760px}
    .table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}
    .table th{background:#f8fafc}
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
    .filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
    .stat span{display:block;color:#64748b;font-size:12px}
    .stat b{font-size:21px}
    .ok{color:#15803d;font-weight:800}
    .bad{color:#b91c1c;font-weight:800}
    .muted{color:#64748b;font-size:14px}
    .review{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}
    .review.ok{border-left:5px solid #16a34a;background:#f0fdf4}
    .review.bad{border-left:5px solid #dc2626;background:#fef2f2}
    .answer{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff}
    .correct{color:#15803d;font-weight:800}
    .wrong{color:#b91c1c;font-weight:800}
    .detail{margin-top:18px}
    @media(max-width:800px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>📊 Kết quả sinh viên</h1>
    <div>Theo dõi, tìm kiếm và xuất kết quả từng đề</div>
  </div>
</header>

<main class="wrap">
  <div class="row">
    <div>
      <h2 id="examTitle">Kết quả</h2>
      <div id="examInfo" class="muted"></div>
    </div>
    <a class="btn gray" href="./admin.html">← Quay lại Dashboard</a>
  </div>

  <div class="card">
    <div class="filters">
      <input id="search" placeholder="🔎 Tìm tên hoặc MSSV..." oninput="render()">
      <select id="pass" onchange="render()">
        <option value="all">Tất cả kết quả</option>
        <option value="pass">Đạt</option>
        <option value="fail">Chưa đạt</option>
      </select>
      <select id="sort" onchange="render()">
        <option value="new">Mới nhất</option>
        <option value="high">Điểm cao → thấp</option>
        <option value="low">Điểm thấp → cao</option>
      </select>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span>👥 Sinh viên</span><b id="sStudents">0</b></div>
    <div class="stat"><span>📋 Bài nộp</span><b id="sSubs">0</b></div>
    <div class="stat"><span>📈 Điểm TB</span><b id="sAvg">0</b></div>
    <div class="stat"><span>🏆 Cao nhất</span><b id="sHigh">0</b></div>
    <div class="stat"><span>🎯 Tỷ lệ đạt</span><b id="sPass">0%</b></div>
  </div>

  <div class="card">
    <div class="row">
      <h3>Danh sách kết quả</h3>
      <button class="btn" onclick="exportCSV()">📥 Xuất CSV</button>
    </div>
    <div class="tablewrap">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Sinh viên</th>
            <th>MSSV</th>
            <th>Điểm</th>
            <th>Đúng</th>
            <th>Thời gian nộp</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="detail" class="detail"></div>
</main>

<script>
const c=window.SUPABASE_CONFIG||{};
const sb=supabase.createClient(c.url,c.anonKey);
let rows=[],exam=null,filtered=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

function parseJson(v,fallback){
  if(typeof v!=='string') return v??fallback;
  try{return JSON.parse(v)}catch{return fallback}
}

function examId(){
  return new URLSearchParams(location.search).get('exam')||'';
}

function getQuestions(e){
  const q=parseJson(e?.questions,[]);
  return Array.isArray(q)?q:[];
}

function normalizeAnswer(v){
  if(v===undefined||v===null||v==='') return null;

  if(typeof v==='object'){
    v=v.value??v.answer??v.correct_answer??v.index??v.option??v.selected;
  }

  if(v===undefined||v===null||v==='') return null;

  const s=String(v).trim().toUpperCase().replace(/^[A-D][.)]\s*/,'');
  const original=String(v).trim().toUpperCase();

  if(/^[A-D]$/.test(original)) return original.charCodeAt(0)-65;
  if(/^[A-D][.)]?$/.test(original)) return original.charAt(0).charCodeAt(0)-65;
  if(/^\d+$/.test(s)) return Number(s);

  return null;
}

function normalizeAnswers(v){
  v=parseJson(v,{});
  if(Array.isArray(v)) return v;
  if(v&&typeof v==='object'){
    if(Array.isArray(v.answers)) return v.answers;
    if(v.answers&&typeof v.answers==='object') return v.answers;
    if(v.student_answers&&typeof v.student_answers==='object') return v.student_answers;
    return v;
  }
  return {};
}

function getAnswerAt(ans,i){
  if(Array.isArray(ans)) return ans[i];
  if(!ans||typeof ans!=='object') return undefined;

  const keys=[String(i),String(i+1),`q${i}`,`q${i+1}`,`question${i}`,`question${i+1}`];
  for(const k of keys){
    if(Object.prototype.hasOwnProperty.call(ans,k)) return ans[k];
  }

  return undefined;
}

/*
 * Ưu tiên answer_key của đề.
 * Nếu answer_key bị thiếu/cũ, lấy trực tiếp q.answer/correct_answer
 * trong từng câu. Đây là điểm quan trọng để các đề cũ vẫn được chấm đúng.
 */
function getAnswerKey(e){
  const qs=getQuestions(e);
  const raw=parseJson(e?.answer_key,[]);
  let key=[];

  if(Array.isArray(raw)) key=raw.slice();
  else if(raw&&typeof raw==='object'){
    const entries=Object.entries(raw).sort((a,b)=>{
      const na=Number(a[0]),nb=Number(b[0]);
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      return a[0].localeCompare(b[0],undefined,{numeric:true});
    });
    key=entries.map(x=>x[1]);
  }

  if(key.length<qs.length){
    key=qs.map((q,i)=>{
      const direct=q?.answer??q?.correct_answer??q?.correctAnswer;
      return direct!==undefined&&direct!==null&&direct!==''?direct:key[i];
    });
  }else{
    key=key.map((v,i)=>{
      if(v!==undefined&&v!==null&&v!=='') return v;
      const q=qs[i]||{};
      return q.answer??q.correct_answer??q.correctAnswer;
    });
  }

  return key;
}

function calc(r){
  const qs=getQuestions(exam);
  const key=getAnswerKey(exam);
  const ans=normalizeAnswers(r.answers??r.student_answers);
  const total=qs.length||key.length||Number(r.total_questions)||0;
  let correct=0;

  for(let i=0;i<total;i++){
    const given=normalizeAnswer(getAnswerAt(ans,i));
    const expected=normalizeAnswer(key[i]);
    if(given!==null&&expected!==null&&given===expected) correct++;
  }

  const score=total?Math.round((correct/total)*10*100)/100:0;
  return {...r,correct,total,score,_answers:ans,_key:key,_questions:qs};
}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='./admin.html';return}

  const id=examId();
  if(!id){document.getElementById('tbody').innerHTML='<tr><td colspan="7">Thiếu mã đề.</td></tr>';return}

  const er=await sb.from('exams').select('*').eq('id',id).single();
  if(er.error){document.getElementById('tbody').innerHTML='<tr><td colspan="7">Không tìm thấy đề.</td></tr>';return}

  exam=er.data;
  document.getElementById('examTitle').textContent='📊 '+(exam.title||'Kết quả');
  document.getElementById('examInfo').textContent=(getQuestions(exam).length||0)+' câu • '+(exam.duration_minutes||0)+' phút';

  const sr=await sb.from('submissions').select('*').eq('exam_id',id).order('submitted_at',{ascending:false});
  if(sr.error){document.getElementById('tbody').innerHTML='<tr><td colspan="7">'+esc(sr.error.message)+'</td></tr>';return}

  rows=sr.data||[];
  render();
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const p=document.getElementById('pass').value;
  const sort=document.getElementById('sort').value;

  filtered=rows.map(calc).filter(r=>{
    const name=(r.student_name||r.full_name||r.name||r.student_email||'').toLowerCase();
    const mssv=String(r.student_id||r.mssv||'').toLowerCase();
    const match=q?name.includes(q)||mssv.includes(q):true;
    const pass=r.score>=5;
    return match&&(p==='all'||(p==='pass'&&pass)||(p==='fail'&&!pass));
  });

  if(sort==='high') filtered.sort((a,b)=>b.score-a.score);
  else if(sort==='low') filtered.sort((a,b)=>a.score-b.score);
  else filtered.sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));

  const unique=new Set(filtered.map(r=>r.student_id||r.mssv||r.student_email||r.user_id||r.id));
  const avg=filtered.length?filtered.reduce((s,r)=>s+r.score,0)/filtered.length:0;
  const passCount=filtered.filter(r=>r.score>=5).length;

  document.getElementById('sStudents').textContent=unique.size;
  document.getElementById('sSubs').textContent=filtered.length;
  document.getElementById('sAvg').textContent=avg.toFixed(2);
  document.getElementById('sHigh').textContent=filtered.length?Math.max(...filtered.map(r=>r.score)).toFixed(2):'0';
  document.getElementById('sPass').textContent=filtered.length?Math.round(passCount/filtered.length*100)+'%':'0%';

  document.getElementById('tbody').innerHTML=filtered.length
    ?filtered.map((r,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${esc(r.student_name||r.full_name||r.name||r.student_email||'—')}</td>
        <td>${esc(r.student_id||r.mssv||'—')}</td>
        <td><b>${r.score.toFixed(2)}</b></td>
        <td class="${r.correct===r.total?'ok':''}">${r.correct}/${r.total}</td>
        <td>${esc(r.submitted_at?new Date(r.submitted_at).toLocaleString('vi-VN'):'—')}</td>
        <td><button class="btn" onclick="viewSubmission('${esc(r.id)}')">👁 Xem bài</button></td>
      </tr>`).join('')
    :'<tr><td colspan="7">Không có kết quả phù hợp.</td></tr>';
}

function viewSubmission(id){
  const r=filtered.find(x=>String(x.id)===String(id))||rows.map(calc).find(x=>String(x.id)===String(id));
  if(!r){alert('Không tìm thấy bài làm.');return}

  const qs=r._questions||getQuestions(exam);
  const key=r._key||getAnswerKey(exam);
  const ans=r._answers||normalizeAnswers(r.answers??r.student_answers);

  let html=`
    <div class="card">
      <div class="row">
        <div>
          <h2>📋 Bài làm: ${esc(r.student_name||r.full_name||r.name||'Sinh viên')}</h2>
          <div class="muted">MSSV: ${esc(r.student_id||r.mssv||'—')} • Điểm: <b>${r.score.toFixed(2)}</b> • Đúng: <b>${r.correct}/${r.total}</b></div>
        </div>
        <button class="btn gray" onclick="closeDetail()">✕ Đóng</button>
      </div>
  `;

  qs.forEach((q,i)=>{
    const given=normalizeAnswer(getAnswerAt(ans,i));
    const expected=normalizeAnswer(key[i]);
    const ok=given!==null&&expected!==null&&given===expected;
    const opts=Array.isArray(q.options)?q.options:[];
    const givenText=given===null?'Chưa trả lời':(opts[given]??'');
    const correctText=expected===null?'Chưa có đáp án':(opts[expected]??'');

    html+=`<div class="review ${ok?'ok':'bad'}">
      <b>Câu ${i+1}. ${esc(q.text||q.question||'')}</b>
      <div class="answer ${ok?'correct':'wrong'}">${ok?'✅ Đúng':'❌ Sai'}</div>
      <div class="answer">Bạn chọn: <b>${given===null?'Chưa trả lời':esc(String.fromCharCode(65+given)+'. '+givenText)}</b></div>
      <div class="answer">Đáp án đúng: <b>${expected===null?'Chưa có đáp án':esc(String.fromCharCode(65+expected)+'. '+correctText)}</b></div>
    </div>`;
  });

  html+='</div>';
  document.getElementById('detail').innerHTML=html;
  document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});
}

function closeDetail(){
  document.getElementById('detail').innerHTML='';
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function exportCSV(){
  const head=['STT','Sinh viên','MSSV','Điểm','Đúng','Tổng câu','Thời gian nộp'];
  const data=filtered.map((r,i)=>[
    i+1,
    r.student_name||r.full_name||r.name||r.student_email||'',
    r.student_id||r.mssv||'',
    r.score.toFixed(2),
    r.correct,
    r.total,
    r.submitted_at?new Date(r.submitted_at).toLocaleString('vi-VN'):''
  ]);
  const csv='\ufeff'+[head,...data].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='ket-qua-'+(exam?.title||'de-thi')+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

init();
</script>
</body>
</html>
