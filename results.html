<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả sinh viên - English Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 18px}.wrap{max-width:1200px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.gray{background:#e8eef7;color:#0f172a}.muted{color:#64748b;font-size:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f8fafc}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px}.stat b{font-size:21px}.rubric{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.rubric span{padding:7px 10px;border:1px solid #dbeafe;border-radius:9px;background:#eff6ff}.essay{white-space:pre-wrap;line-height:1.65;background:#f8fafc;padding:14px;border-radius:10px}.feedback{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}.bad{border-left:5px solid #dc2626;background:#fef2f2}.ok{border-left:5px solid #16a34a;background:#f0fdf4}@media(max-width:800px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><header class="top"><div class="wrap"><h1>📊 Kết quả sinh viên</h1><div>Theo dõi kết quả từng đề</div></div></header><main class="wrap"><div class="row"><div><h2 id="examTitle">Kết quả</h2><div id="examInfo" class="muted"></div></div><a class="btn gray" href="./admin.html">← Dashboard</a></div><div class="card"><div class="filters"><input id="search" placeholder="🔎 Tìm tên sinh viên..." oninput="render()"><select id="pass" onchange="render()"><option value="all">Tất cả</option><option value="pass">Đạt</option><option value="fail">Chưa đạt</option></select><select id="sort" onchange="render()"><option value="new">Mới nhất</option><option value="high">Điểm cao → thấp</option><option value="low">Điểm thấp → cao</option></select></div></div><div class="stats"><div class="stat"><span>👥 Sinh viên</span><b id="sStudents">0</b></div><div class="stat"><span>📋 Bài nộp</span><b id="sSubs">0</b></div><div class="stat"><span>📈 Điểm TB</span><b id="sAvg">0</b></div><div class="stat"><span>🏆 Cao nhất</span><b id="sHigh">0</b></div><div class="stat"><span>🎯 Tỷ lệ đạt</span><b id="sPass">0%</b></div></div><div class="card"><div class="row"><h3>Danh sách bài làm</h3><button class="btn" onclick="exportCSV()">📥 Xuất CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Sinh viên</th><th>Điểm</th><th>Chi tiết tiêu chí</th><th>Thời gian</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="6">Đang tải...</td></tr></tbody></table></div></div><div id="detail"></div></main>
<script>
const cfg=window.SUPABASE_CONFIG||{},sb=supabase.createClient(cfg.url,cfg.anonKey);let exam=null,rows=[],filtered=[],mode='';const id=()=>new URLSearchParams(location.search).get('exam')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const parse=(v,f)=>{if(typeof v!=='string')return v??f;try{return JSON.parse(v)}catch{return f}};
function rubricRows(r){const rub=Array.isArray(exam?.writing_rubric)?exam.writing_rubric:parse(exam?.writing_rubric,[]),scores=parse(r.rubric_scores,{});return rub.map(x=>{const n=String(x.name||x.title||'').trim(),k=n.toLowerCase();let v=scores[n];if(v===undefined){if(k.includes('task response'))v=r.task_response;else if(k.includes('coherence'))v=r.coherence;else if(k.includes('vocabulary'))v=r.vocabulary;else if(k.includes('grammar'))v=r.grammar}return{name:n,max:Number(x.max??x.max_score??0),value:Number(v??0)}}).filter(x=>x.name)}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}const eid=id();if(!eid)return msg('Thiếu mã đề.');const er=await sb.from('exams').select('*').eq('id',eid).single();if(er.error)return msg('Không tìm thấy đề: '+er.error.message);exam=er.data;mode=String(exam.exam_type||'').toLowerCase();document.getElementById('examTitle').textContent='📊 '+(exam.title||'Kết quả');document.getElementById('examInfo').textContent=mode==='writing'?'✍️ Writing • '+(parse(exam.writing_rubric,[]).length)+' tiêu chí':'🎧 Listening';let r;if(mode==='writing')r=await sb.rpc('get_teacher_writing_submissions',{p_exam_id:eid});else r=await sb.from('submissions').select('*').eq('exam_id',eid).order('submitted_at',{ascending:false});if(r.error)return msg('Không tải được kết quả: '+r.error.message);rows=r.data||[];render()}
function msg(t){document.getElementById('tbody').innerHTML='<tr><td colspan="6">'+esc(t)+'</td></tr>'}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),p=document.getElementById('pass').value,s=document.getElementById('sort').value;filtered=rows.filter(r=>{const n=String(r.student_name||'').toLowerCase();const ok=!q||n.includes(q);const score=Number(r.total_score??r.score)||0;return ok&&(p==='all'||(p==='pass'&&score>=5)||(p==='fail'&&score<5))});filtered.sort((a,b)=>s==='high'?Number(b.total_score??b.score||0)-Number(a.total_score??a.score||0):s==='low'?Number(a.total_score??a.score||0)-Number(b.total_score??b.score||0):new Date(b.created_at||b.submitted_at)-new Date(a.created_at||a.submitted_at));const scores=filtered.map(r=>Number(r.total_score??r.score)||0),unique=new Set(filtered.map(r=>r.student_user_id||r.student_name));document.getElementById('sStudents').textContent=unique.size;document.getElementById('sSubs').textContent=filtered.length;document.getElementById('sAvg').textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'0';document.getElementById('sHigh').textContent=scores.length?Math.max(...scores).toFixed(2):'0';document.getElementById('sPass').textContent=scores.length?Math.round(scores.filter(x=>x>=5).length/scores.length*100)+'%':'0%';document.getElementById('tbody').innerHTML=filtered.length?filtered.map((r,i)=>mode==='writing'?writingRow(r,i):listeningRow(r,i)).join(''):'<tr><td colspan="6">Không có bài làm.</td></tr>'}
function writingRow(r,i){const rr=rubricRows(r);return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||'—')+'</td><td><b>'+esc(r.total_score)+'/10</b></td><td>'+rr.map(x=>esc(x.name)+': '+esc(x.value)+'/'+esc(x.max)).join('<br>')+'</td><td>'+esc(new Date(r.created_at).toLocaleString('vi-VN'))+'</td><td><button class="btn" onclick="viewWriting('+i+')">👁 Xem bài</button></td></tr>'}
function listeningRow(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||'—')+'</td><td><b>'+esc(r.score)+'</b></td><td>'+esc(r.correct_count||0)+'/'+esc(r.total_questions||0)+' câu</td><td>'+esc(new Date(r.submitted_at).toLocaleString('vi-VN'))+'</td><td>—</td></tr>'}
function viewWriting(i){const r=filtered[i],rr=rubricRows(r),strengths=parse(r.strengths,[]),improvements=parse(r.improvements,[]),errors=parse(r.grammar_errors,[]),phrases=parse(r.better_phrases,[]);document.getElementById('detail').innerHTML='<div class="card"><div class="row"><h2>✍️ '+esc(r.student_name||'Bài Writing')+'</h2><button class="btn gray" onclick="document.getElementById(\'detail\').innerHTML=\'\'">Đóng</button></div><p class="muted">'+esc(r.word_count)+' từ • '+esc(r.total_score)+'/10 • '+new Date(r.created_at).toLocaleString('vi-VN')+'</p><div class="rubric">'+rr.map(x=>'<span>'+esc(x.name)+': <b>'+esc(x.value)+'</b>/'+esc(x.max)+'</span>').join('')+'</div><h3>📝 Bài viết</h3><div class="essay">'+esc(r.essay)+'</div><div class="feedback"><b>💬 Nhận xét tổng quan</b><p>'+esc(r.overall_comment||'')+'</p></div><div class="feedback ok"><b>💪 Điểm mạnh</b><ul>'+strengths.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="feedback"><b>🎯 Cần cải thiện</b><ul>'+improvements.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'+(errors.length?'<div class="feedback bad"><b>🔎 Lỗi cần chú ý</b>'+errors.map(x=>'<p><b>'+esc(x.original)+' → '+esc(x.correction)+'</b><br>'+esc(x.explanation)+'</p>').join('')+'</div>':'')+(phrases.length?'<div class="feedback"><b>✨ Gợi ý diễn đạt tốt hơn</b>'+phrases.map(x=>'<p>'+esc(x.original)+' → <b>'+esc(x.better)+'</b></p>').join('')+'</div>':'')+'</div>';document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function exportCSV(){const h=['STT','Sinh viên','Điểm','Tiêu chí','Thời gian'],d=filtered.map((r,i)=>[i+1,r.student_name,r.total_score,Object.entries(parse(r.rubric_scores,{})).map(([n,v])=>n+': '+v).join(' | '),r.created_at]),csv='\ufeff'+[h,...d].map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ket-qua-'+(exam?.title||'de')+'.csv';a.click()}
init();
</script></body></html>
