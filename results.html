<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio - Kết quả</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.gray{background:#e8eef7;color:#0f172a}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f8fafc}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px}.stat b{font-size:21px}.ok{color:#15803d;font-weight:800}.bad{color:#b91c1c;font-weight:800}.muted{color:#64748b;font-size:14px}@media(max-width:800px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="wrap"><h1>📊 Kết quả sinh viên</h1><div>Theo dõi, tìm kiếm và xuất kết quả từng đề</div></div></header><main class="wrap"><div class="row"><div><h2 id="examTitle">Kết quả</h2><div id="examInfo" class="muted"></div></div><div><a class="btn gray" href="./admin.html">← Quay lại Dashboard</a></div></div><div class="card"><div class="filters"><input id="search" placeholder="🔎 Tìm tên hoặc MSSV..." oninput="render()"><select id="pass" onchange="render()"><option value="all">Tất cả kết quả</option><option value="pass">Đạt</option><option value="fail">Chưa đạt</option></select><select id="sort" onchange="render()"><option value="new">Mới nhất</option><option value="high">Điểm cao → thấp</option><option value="low">Điểm thấp → cao</option></select></div></div><div class="stats"><div class="stat"><span>👥 Sinh viên</span><b id="sStudents">0</b></div><div class="stat"><span>📋 Bài nộp</span><b id="sSubs">0</b></div><div class="stat"><span>📈 Điểm TB</span><b id="sAvg">0</b></div><div class="stat"><span>🏆 Cao nhất</span><b id="sHigh">0</b></div><div class="stat"><span>🎯 Tỷ lệ đạt</span><b id="sPass">0%</b></div></div><div class="card"><div class="row"><h3>Danh sách kết quả</h3><button class="btn" onclick="exportCSV()">📥 Xuất CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Sinh viên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Thời gian nộp</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="7">Đang tải...</td></tr></tbody></table></div></div></main><script>const c=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(c.url,c.anonKey);let rows=[],exam=null,filtered=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function examId(){return new URLSearchParams(location.search).get('exam')||location.hash.replace(/^#exam=/,'')}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}const id=examId();if(!id){document.getElementById('tbody').innerHTML='<tr><td colspan="7">Thiếu mã đề.</td></tr>';return}const er=await sb.from('exams').select('*').eq('id',id).single();if(er.error){document.getElementById('tbody').innerHTML='<tr><td colspan="7">Không tìm thấy đề.</td></tr>';return}exam=er.data;document.getElementById('examTitle').textContent='📊 '+exam.title;document.getElementById('examInfo').textContent=(exam.questions?.length||0)+' câu • '+(exam.duration_minutes||0)+' phút';const sr=await sb.from('submissions').select('*').eq('exam_id',id).order('submitted_at',{ascending:false});if(sr.error){document.getElementById('tbody').innerHTML='<tr><td colspan="7">'+esc(sr.error.message)+'</td></tr>';return}rows=sr.data||[];render()}function normalizeAnswer(v){let s=String(v??'').trim().toUpperCase().replace(/[.)]+$/,'');const map={'0':'A','1':'B','2':'C','3':'D'};return map[s]||s}function calc(r){const key=Array.isArray(exam.answer_key)?exam.answer_key:[];const ans=Array.isArray(r.answers)?r.answers:[];let correct=0;key.forEach((k,i)=>{if(normalizeAnswer(ans[i])===normalizeAnswer(k))correct++});const total=key.length||exam.questions?.length||r.total_questions||0;const score=total?Math.round(correct/total*10*100)/100:0;return{correct,total,score}}function render(){const q=(document.getElementById('search').value||'').toLowerCase().trim(),p=document.getElementById('pass').value,sort=document.getElementById('sort').value;filtered=rows.map(r=>({...r,...calc(r)})).filter(r=>{const name=(r.student_name||r.full_name||r.name||'').toLowerCase(),mssv=(r.student_id||r.mssv||'').toLowerCase(),match=q?name.includes(q)||mssv.includes(q):true;const pass=r.score>=5;return match&&(p==='all'||(p==='pass'&&pass)||(p==='fail'&&!pass))});if(sort==='high')filtered.sort((a,b)=>b.score-a.score);else if(sort==='low')filtered.sort((a,b)=>a.score-b.score);else filtered.sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));const unique=new Set(filtered.map(r=>r.student_id||r.mssv||r.student_email||r.user_id||r.id));const avg=filtered.length?filtered.reduce((s,r)=>s+r.score,0)/filtered.length:0;const passCount=filtered.filter(r=>r.score>=5).length;document.getElementById('sStudents').textContent=unique.size;document.getElementById('sSubs').textContent=filtered.length;document.getElementById('sAvg').textContent=avg.toFixed(2);document.getElementById('sHigh').textContent=filtered.length?Math.max(...filtered.map(r=>r.score)).toFixed(2):'0';document.getElementById('sPass').textContent=filtered.length?Math.round(passCount/filtered.length*100)+'%':'0%';document.getElementById('tbody').innerHTML=filtered.length?filtered.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||r.full_name||r.name||r.student_email||'—')+'</td><td>'+esc(r.student_id||r.mssv||'—')+'</td><td><b>'+r.score+'</b></td><td class="'+(r.correct===r.total?'ok':'')+'">'+r.correct+'/'+r.total+'</td><td>'+esc(r.submitted_at?new Date(r.submitted_at).toLocaleString('vi-VN'):'—')+'</td><td><button class="btn small" onclick="view(\''+r.id+'\')">👁 Xem bài</button></td></tr>').join(''):'<tr><td colspan="7">Không có kết quả phù hợp.</td></tr>'}function view(id){location.href='./admin.html?submission='+encodeURIComponent(id)}function exportCSV(){const head=['STT','Sinh viên','MSSV','Điểm','Đúng','Tổng câu','Thời gian nộp'];const data=filtered.map((r,i)=>[i+1,r.student_name||r.full_name||r.name||r.student_email||'',r.student_id||r.mssv||'',r.score,r.correct,r.total,r.submitted_at?new Date(r.submitted_at).toLocaleString('vi-VN'):'']);const csv='\ufeff'+[head,...data].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ket-qua-'+(exam?.title||'de-thi')+'.csv';a.click();URL.revokeObjectURL(a.href)}init();</script></body></html>
