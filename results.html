<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả sinh viên - English Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 18px}.wrap{max-width:1200px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.gray{background:#e8eef7;color:#0f172a}.danger{background:#dc2626}.muted{color:#64748b;font-size:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f8fafc}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px}.stat b{font-size:21px}.essay{white-space:pre-wrap;line-height:1.65;background:#f8fafc;padding:16px;border-radius:10px}.feedback{border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin:12px 0}.feedback h4{margin:0 0 8px}.feedback.overall{background:#eff6ff;border-color:#bfdbfe;border-left:5px solid #2563eb}.feedback.strengths{background:#f0fdf4;border-color:#bbf7d0;border-left:5px solid #16a34a}.feedback.improvements{background:#fff7ed;border-color:#fed7aa;border-left:5px solid #f97316}.feedback.grammar{background:#fef2f2;border-color:#fecaca;border-left:5px solid #dc2626}.feedback.phrases{background:#faf5ff;border-color:#e9d5ff;border-left:5px solid #9333ea}.feedback ul{margin:8px 0 0 20px}.rubric{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.rubric span{padding:8px 11px;border:1px solid #dbeafe;border-radius:9px;background:#eff6ff}.review{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.review.ok{border-left:5px solid #16a34a;background:#f0fdf4}.review.bad{border-left:5px solid #dc2626;background:#fef2f2}.answer{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff}.correct{color:#15803d;font-weight:800}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:10px}@media(max-width:800px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="wrap"><h1>📊 Kết quả sinh viên</h1><div>Theo dõi, tìm kiếm và xuất kết quả từng đề</div></div></header><main class="wrap"><div class="row"><div><h2 id="examTitle">Kết quả</h2><div id="examInfo" class="muted"></div></div><a class="btn gray" href="./manage.html">← Quay lại Quản lý đề</a></div><div id="errorBox"></div><div class="card"><div class="filters"><input id="search" placeholder="🔎 Tìm tên hoặc MSSV..."><select id="pass"><option value="all">Tất cả kết quả</option><option value="pass">Đạt</option><option value="fail">Chưa đạt</option></select><select id="sort"><option value="new">Mới nhất</option><option value="high">Điểm cao → thấp</option><option value="low">Điểm thấp → cao</option></select></div></div><div class="stats"><div class="stat"><span>👥 Sinh viên</span><b id="sStudents">0</b></div><div class="stat"><span>📋 Bài nộp</span><b id="sSubs">0</b></div><div class="stat"><span>📈 Điểm TB</span><b id="sAvg">0</b></div><div class="stat"><span>🏆 Cao nhất</span><b id="sHigh">0</b></div><div class="stat"><span>🎯 Tỷ lệ đạt</span><b id="sPass">0%</b></div></div><div class="card"><div class="row"><h3 id="listTitle">Danh sách kết quả</h3><div class="row"><button class="btn" onclick="exportCSV()">📥 Xuất CSV</button><button class="btn danger" onclick="deleteAllSubmissions()">🗑️ Xóa tất cả</button></div></div><div class="tablewrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"><tr><td>Đang tải...</td></tr></tbody></table></div></div><div id="detail"></div></main><script>
const cfg=window.SUPABASE_CONFIG||{},sb=supabase.createClient(cfg.url,cfg.anonKey);let exam=null,rows=[],filtered=[],mode='';const examId=()=>new URLSearchParams(location.search).get('exam')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const parse=(v,f)=>{if(v==null)return f;if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return f}};const scoreOf=r=>Number(r.total_score!=null?r.total_score:r.score)||0;const timeOf=r=>r.created_at||r.submitted_at||null;function msg(t){document.getElementById('errorBox').innerHTML='<div class="error">❌ '+esc(t)+'</div>';document.getElementById('tbody').innerHTML='<tr><td colspan="8">'+esc(t)+'</td></tr>'}function questions(){const q=parse(exam?.questions,[]);return Array.isArray(q)?q:[]}function answerKey(){const qs=questions(),raw=parse(exam?.answer_key,[]);let key=[];if(Array.isArray(raw))key=raw.slice();else if(raw&&typeof raw==='object')key=Object.entries(raw).sort((a,b)=>Number(a[0])-Number(b[0])).map(x=>x[1]);return qs.map((q,i)=>key[i]??q?.answer??q?.correct_answer??q?.correctAnswer)}function normalizeAnswer(v){if(v===undefined||v===null||v==='')return null;if(typeof v==='object')v=v.value??v.answer??v.correct_answer??v.index??v.option??v.selected;if(v===undefined||v===null||v==='')return null;const s=String(v).trim().toUpperCase();if(/^[A-D]$/.test(s))return s.charCodeAt(0)-65;if(/^\d+$/.test(s))return Number(s);return null}function answersOf(r){const v=parse(r?.answers??r?.student_answers,{});return v&&typeof v==='object'?v:{}}function answerAt(ans,i){if(Array.isArray(ans))return ans[i];for(const k of [String(i),String(i+1),'q'+i,'q'+(i+1),'question'+i,'question'+(i+1)])if(Object.prototype.hasOwnProperty.call(ans,k))return ans[k];return undefined}function quizCorrect(r){const key=answerKey(),ans=answersOf(r);let c=0;for(let i=0;i<questions().length;i++){const a=normalizeAnswer(answerAt(ans,i)),k=normalizeAnswer(key[i]);if(a!==null&&k!==null&&a===k)c++}return c}function rubricRows(r){const rub=Array.isArray(exam?.writing_rubric)?exam.writing_rubric:parse(exam?.writing_rubric,[]),scores=parse(r?.rubric_scores,{});return rub.map(x=>{const n=String(x?.name||x?.title||'').trim(),k=n.toLowerCase();let v=scores?.[n];if(v==null){if(k.includes('task response'))v=r?.task_response;else if(k.includes('coherence')||k.includes('cohesion'))v=r?.coherence;else if(k.includes('vocabulary'))v=r?.vocabulary;else if(k.includes('grammar'))v=r?.grammar}return{name:n,max:Number(x?.max??x?.max_score??0),value:Number(v??0)}}).filter(x=>x.name)}
async function init(){try{const {data:{session},error}=await sb.auth.getSession();if(error)return msg(error.message);if(!session){location.href='./admin.html';return}const eid=examId();if(!eid)return msg('Thiếu mã đề.');const {data,error:e}=await sb.rpc('get_teacher_exam_results',{p_exam_id:eid});if(e)return msg('Không tải được kết quả: '+e.message);let p=typeof data==='string'?parse(data,null):data;if(!p?.exam)return msg('Không tìm thấy đề hoặc không có quyền.');exam=p.exam;mode=String(exam.exam_type||'').toLowerCase();rows=Array.isArray(p.rows)?p.rows:[];document.getElementById('examTitle').textContent='📊 '+(exam.title||'Kết quả');document.getElementById('examInfo').textContent=mode==='writing'?'✍️ Writing':mode==='reading'?'📖 Reading':'🎧 Listening';setupHeaders();render()}catch(e){msg(e?.message||'Lỗi tải kết quả')}}function setupHeaders(){document.getElementById('thead').innerHTML=mode==='writing'?'<tr><th>#</th><th>Sinh viên</th><th>Điểm</th><th>Chi tiết tiêu chí</th><th>Thời gian</th><th>Thao tác</th></tr>':'<tr><th>#</th><th>Sinh viên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Thời gian nộp</th><th>Thao tác</th></tr>'}function render(){const q=document.getElementById('search').value.toLowerCase().trim(),p=document.getElementById('pass').value,s=document.getElementById('sort').value;filtered=rows.filter(r=>{const n=String(r.student_name||r.full_name||r.name||'').toLowerCase(),m=String(r.student_id||r.mssv||'').toLowerCase(),ok=!q||n.includes(q)||m.includes(q),sc=scoreOf(r);return ok&&(p==='all'||p==='pass'&&sc>=5||p==='fail'&&sc<5)});filtered.sort((a,b)=>s==='high'?scoreOf(b)-scoreOf(a):s==='low'?scoreOf(a)-scoreOf(b):new Date(timeOf(b)||0)-new Date(timeOf(a)||0);const scores=filtered.map(scoreOf);document.getElementById('sStudents').textContent=new Set(filtered.map(r=>r.student_user_id||r.student_id||r.student_name||r.id)).size;document.getElementById('sSubs').textContent=filtered.length;document.getElementById('sAvg').textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'0';document.getElementById('sHigh').textContent=scores.length?Math.max(...scores).toFixed(2):'0';document.getElementById('sPass').textContent=scores.length?Math.round(scores.filter(x=>x>=5).length/scores.length*100)+'%':'0%';document.getElementById('tbody').innerHTML=filtered.length?filtered.map((r,i)=>mode==='writing'?writingRow(r,i):quizRow(r,i)).join(''):'<tr><td colspan="8">Không có bài làm.</td></tr>'}function actionButtons(i){return '<button class="btn" onclick="'+(mode==='writing'?'viewWriting':'viewQuiz')+'('+i+')">👁 Xem bài làm</button> <button class="btn danger" onclick="deleteSubmissionByIndex('+i+')">🗑️ Xóa</button>'}function writingRow(r,i){const rr=rubricRows(r);return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||'—')+'</td><td><b>'+esc(r.total_score??r.score??0)+'/10</b></td><td>'+rr.map(x=>esc(x.name)+': '+esc(x.value)+'/'+esc(x.max)).join('<br>')+'</td><td>'+esc(timeOf(r)?new Date(timeOf(r)).toLocaleString('vi-VN'):'—')+'</td><td>'+actionButtons(i)+'</td></tr>'}function quizRow(r,i){const c=r.correct_count??quizCorrect(r),t=r.total_questions??questions().length;return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||r.full_name||r.name||'—')+'</td><td>'+esc(r.student_id||r.mssv||'—')+'</td><td><b>'+esc(scoreOf(r).toFixed(2))+'</b></td><td>'+esc(c)+'/'+esc(t)+'</td><td>'+esc(timeOf(r)?new Date(timeOf(r)).toLocaleString('vi-VN'):'—')+'</td><td>'+actionButtons(i)+'</td></tr>'}
function list(v){return Array.isArray(v)?v:[]};function feedbackBox(cls,title,content){if(!content||(Array.isArray(content)&&!content.length))return '';return '<div class="feedback '+cls+'"><h4>'+title+'</h4>'+content+'</div>'}function listHtml(v){const a=list(v);return a.length?'<ul>'+a.map(x=>'<li>'+esc(typeof x==='string'?x:(x?.message||x?.error||x?.suggestion||JSON.stringify(x)))+'</li>').join('')+'</ul>':'<div class="muted">Không có dữ liệu.</div>'}
function viewWriting(i){const r=filtered[i];if(!r)return;const rr=rubricRows(r),strengths=list(r.strengths),improvements=list(r.improvements),errors=list(r.grammar_errors),phrases=list(r.better_phrases);let h='<div class="card"><div class="row"><h3>👁 Chi tiết bài làm — '+esc(r.student_name||'Sinh viên')+'</h3><button class="btn gray" onclick="document.getElementById(\'detail\').innerHTML=\'\'">Đóng</button></div><div class="essay"><b>📝 Bài làm</b><br><br>'+esc(r.essay||r.answer||r.content||'Chưa có bài viết.')+'</div>';h+='<div class="feedback overall"><h4>🤖 Nhận xét tổng quan của AI</h4><div>'+esc(r.overall_comment||'Chưa có nhận xét.')+'</div>'+(r.ai_model?'<div class="muted" style="margin-top:8px">Model: '+esc(r.ai_model)+'</div>':'')+'</div>';if(rr.length)h+='<div class="feedback"><h4>📊 Điểm theo tiêu chí</h4><div class="rubric">'+rr.map(x=>'<span><b>'+esc(x.name)+'</b>: '+esc(x.value)+'/'+esc(x.max)+'</span>').join('')+'</div></div>';h+=feedbackBox('strengths','💪 Điểm mạnh',listHtml(strengths));h+=feedbackBox('improvements','🛠️ Cần cải thiện',listHtml(improvements));h+=feedbackBox('grammar','🔤 Lỗi ngữ pháp',listHtml(errors));h+=feedbackBox('phrases','💡 Cách diễn đạt tốt hơn',listHtml(phrases));h+='</div>';document.getElementById('detail').innerHTML=h;document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function renderQuizDetail(r){const qs=questions(),key=answerKey(),ans=answersOf(r);let h='<div class="card"><div class="row"><h3>👁 Chi tiết bài làm — '+esc(r.student_name||'Sinh viên')+'</h3><button class="btn gray" onclick="document.getElementById(\'detail\').innerHTML=\'\'">Đóng</button></div>';qs.forEach((q,i)=>{const a=normalizeAnswer(answerAt(ans,i)),k=normalizeAnswer(key[i]),ok=a!==null&&k!==null&&a===k;h+='<div class="review '+(ok?'ok':'bad')+'"><b>Câu '+(i+1)+'</b> — '+(ok?'Đúng':'Sai')+'<div>'+esc(q?.question||q?.text||'')+'</div><div class="answer">Đáp án sinh viên: <b>'+esc(a===null?'Chưa chọn':String.fromCharCode(65+a))+'</b></div><div class="answer">Đáp án đúng: <b>'+esc(k===null?'—':String.fromCharCode(65+k))+'</b></div></div>'});h+='</div>';document.getElementById('detail').innerHTML=h;document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}function viewQuiz(i){if(filtered[i])renderQuizDetail(filtered[i])}
async function deleteSubmissionByIndex(i){const r=filtered[i],id=r?.id;if(!id)return;if(!confirm('Xóa bài làm này?'))return;const {data,error}=await sb.rpc('delete_submission',{p_submission_id:id});if(error||data!==true)return alert('❌ Không thể xóa bài nộp.');rows=rows.filter(x=>x.id!==id);render();document.getElementById('detail').innerHTML=''}async function deleteAllSubmissions(){const eid=examId();if(!rows.length)return;if(!confirm('Xóa tất cả bài nộp của đề này?'))return;const {data,error}=await sb.rpc('delete_exam_submissions',{p_exam_id:eid});if(error||data!==true)return alert('❌ Không thể xóa.');rows=[];render();document.getElementById('detail').innerHTML=''}function exportCSV(){const head=['#','Sinh viên','Điểm','Thời gian'],body=filtered.map((r,i)=>[i+1,r.student_name||'',scoreOf(r),timeOf(r)||'']);const csv='\ufeff'+[head,...body].map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ket-qua.csv';a.click()}['search','pass','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));init();
</script></body></html>
