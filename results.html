<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết quả sinh viên - English Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 18px}.wrap{max-width:1200px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.gray{background:#e8eef7;color:#0f172a}.muted{color:#64748b;font-size:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f8fafc}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px}.stat b{font-size:21px}.rubric{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.rubric span{padding:7px 10px;border:1px solid #dbeafe;border-radius:9px;background:#eff6ff}.essay{white-space:pre-wrap;line-height:1.65;background:#f8fafc;padding:14px;border-radius:10px}.feedback{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}.bad{border-left:5px solid #dc2626;background:#fef2f2}.ok{border-left:5px solid #16a34a;background:#f0fdf4}.review{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.review.ok{border-left:5px solid #16a34a;background:#f0fdf4}.review.bad{border-left:5px solid #dc2626;background:#fef2f2}.answer{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff}.correct{color:#15803d;font-weight:800}.wrong{color:#b91c1c;font-weight:800}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:10px}@media(max-width:800px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>📊 Kết quả sinh viên</h1><div>Theo dõi, tìm kiếm và xuất kết quả từng đề</div></div></header>
<main class="wrap">
<div class="row"><div><h2 id="examTitle">Kết quả</h2><div id="examInfo" class="muted"></div></div><a class="btn gray" href="./admin.html">← Quay lại Dashboard</a></div>
<div id="errorBox"></div>
<div class="card"><div class="filters"><input id="search" placeholder="🔎 Tìm tên hoặc MSSV..."><select id="pass"><option value="all">Tất cả kết quả</option><option value="pass">Đạt</option><option value="fail">Chưa đạt</option></select><select id="sort"><option value="new">Mới nhất</option><option value="high">Điểm cao → thấp</option><option value="low">Điểm thấp → cao</option></select></div></div>
<div class="stats"><div class="stat"><span>👥 Sinh viên</span><b id="sStudents">0</b></div><div class="stat"><span>📋 Bài nộp</span><b id="sSubs">0</b></div><div class="stat"><span>📈 Điểm TB</span><b id="sAvg">0</b></div><div class="stat"><span>🏆 Cao nhất</span><b id="sHigh">0</b></div><div class="stat"><span>🎯 Tỷ lệ đạt</span><b id="sPass">0%</b></div></div>
<div class="card"><div class="row"><h3 id="listTitle">Danh sách kết quả</h3><button class="btn" onclick="exportCSV()">📥 Xuất CSV</button></div><div class="tablewrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"><tr><td>Đang tải...</td></tr></tbody></table></div></div>
<div id="detail"></div>
</main>
<script>
const cfg=window.SUPABASE_CONFIG||{},sb=supabase.createClient(cfg.url,cfg.anonKey);let exam=null,rows=[],filtered=[],mode='';
const examId=()=>new URLSearchParams(location.search).get('exam')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const parse=(v,f)=>{if(v==null)return f;if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return f}};
const arr=v=>{const x=parse(v,[]);if(Array.isArray(x))return x;if(x&&typeof x==='object')return Object.values(x);return[]};
const scoreOf=r=>Number(r.total_score!=null?r.total_score:r.score)||0;
const timeOf=r=>r.created_at||r.submitted_at||null;
function msg(t){document.getElementById('errorBox').innerHTML='<div class="error">❌ '+esc(t)+'</div>';document.getElementById('tbody').innerHTML='<tr><td colspan="7">'+esc(t)+'</td></tr>';document.getElementById('examInfo').textContent='Không tải được kết quả';}
function questions(){const q=parse(exam?.questions,[]);return Array.isArray(q)?q:[]}
function answerKey(){const qs=questions(),raw=parse(exam?.answer_key,[]);let key=[];if(Array.isArray(raw))key=raw.slice();else if(raw&&typeof raw==='object')key=Object.entries(raw).sort((a,b)=>Number(a[0])-Number(b[0])).map(x=>x[1]);return qs.map((q,i)=>key[i]??q?.answer??q?.correct_answer??q?.correctAnswer)}
function normalizeAnswer(v){if(v===undefined||v===null||v==='')return null;if(typeof v==='object')v=v.value??v.answer??v.correct_answer??v.index??v.option??v.selected;if(v===undefined||v===null||v==='')return null;const s=String(v).trim().toUpperCase();if(/^[A-D]$/.test(s))return s.charCodeAt(0)-65;if(/^[A-D][.)]$/.test(s))return s.charAt(0).charCodeAt(0)-65;if(/^\d+$/.test(s))return Number(s);return null}
function answersOf(r){const v=parse(r?.answers??r?.student_answers,{});return v&&typeof v==='object'?v:{}}
function answerAt(ans,i){if(Array.isArray(ans))return ans[i];for(const k of [String(i),String(i+1),'q'+i,'q'+(i+1),'question'+i,'question'+(i+1)])if(Object.prototype.hasOwnProperty.call(ans,k))return ans[k];return undefined}
function quizCorrect(r){const qs=questions(),key=answerKey(),ans=answersOf(r);let correct=0;for(let i=0;i<qs.length;i++){const a=normalizeAnswer(answerAt(ans,i)),k=normalizeAnswer(key[i]);if(a!==null&&k!==null&&a===k)correct++}return correct}
function rubricRows(r){const rub=Array.isArray(exam?.writing_rubric)?exam.writing_rubric:parse(exam?.writing_rubric,[]),scores=parse(r?.rubric_scores,{});return rub.map(x=>{const n=String(x?.name||x?.title||'').trim(),k=n.toLowerCase();let v=scores?.[n];if(v==null){if(k.includes('task response'))v=r?.task_response;else if(k.includes('coherence')||k.includes('cohesion'))v=r?.coherence;else if(k.includes('vocabulary'))v=r?.vocabulary;else if(k.includes('grammar'))v=r?.grammar}return{name:n,max:Number(x?.max??x?.max_score??0),value:Number(v??0)}}).filter(x=>x.name)}
async function init(){try{const {data:{session},error}=await sb.auth.getSession();if(error)return msg('Không đọc được phiên đăng nhập: '+error.message);if(!session){location.href='./admin.html';return}const eid=examId();if(!eid)return msg('Thiếu mã đề.');const {data,error:rpcError}=await sb.rpc('get_teacher_exam_results',{p_exam_id:eid});if(rpcError)return msg('Không tải được kết quả: '+rpcError.message);let payload=data;if(typeof payload==='string'){try{payload=JSON.parse(payload)}catch{return msg('Dữ liệu kết quả trả về không hợp lệ.')}}if(!payload?.exam)return msg('Không tìm thấy đề hoặc tài khoản giáo viên không có quyền xem đề này.');exam=payload.exam;mode=String(exam.exam_type||'').toLowerCase();rows=Array.isArray(payload.rows)?payload.rows:[];document.getElementById('examTitle').textContent='📊 '+(exam.title||'Kết quả');document.getElementById('examInfo').textContent=mode==='writing'?'✍️ Writing • '+parse(exam.writing_rubric,[]).length+' tiêu chí':mode==='reading'?'📖 Reading':'🎧 Listening';setupHeaders();render()}catch(e){msg(e?.message||'Lỗi không xác định khi tải kết quả.')}}
function setupHeaders(){const thead=document.getElementById('thead');if(mode==='writing')thead.innerHTML='<tr><th>#</th><th>Sinh viên</th><th>Điểm</th><th>Chi tiết tiêu chí</th><th>Thời gian</th><th></th></tr>';else thead.innerHTML='<tr><th>#</th><th>Sinh viên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Thời gian nộp</th><th></th></tr>';document.getElementById('listTitle').textContent=mode==='writing'?'Danh sách bài làm':'Danh sách kết quả'}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),p=document.getElementById('pass').value,s=document.getElementById('sort').value;filtered=rows.filter(r=>{const n=String(r.student_name||r.full_name||r.name||'').toLowerCase(),m=String(r.student_id||r.mssv||'').toLowerCase(),ok=!q||n.includes(q)||m.includes(q),score=scoreOf(r);return ok&&(p==='all'||(p==='pass'&&score>=5)||(p==='fail'&&score<5))});filtered.sort((a,b)=>s==='high'?scoreOf(b)-scoreOf(a):s==='low'?scoreOf(a)-scoreOf(b):new Date(timeOf(b)||0)-new Date(timeOf(a)||0));const scores=filtered.map(scoreOf),unique=new Set(filtered.map(r=>r.student_user_id||r.student_id||r.student_name||r.id));document.getElementById('sStudents').textContent=unique.size;document.getElementById('sSubs').textContent=filtered.length;document.getElementById('sAvg').textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'0';document.getElementById('sHigh').textContent=scores.length?Math.max(...scores).toFixed(2):'0';document.getElementById('sPass').textContent=scores.length?Math.round(scores.filter(x=>x>=5).length/scores.length*100)+'%':'0%';document.getElementById('tbody').innerHTML=filtered.length?filtered.map((r,i)=>mode==='writing'?writingRow(r,i):quizRow(r,i)).join(''):'<tr><td colspan="7">Không có bài làm.</td></tr>'}
function writingRow(r,i){const rr=rubricRows(r);return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||'—')+'</td><td><b>'+esc(r.total_score??r.score??0)+'/10</b></td><td>'+rr.map(x=>esc(x.name)+': '+esc(x.value)+'/'+esc(x.max)).join('<br>')+'</td><td>'+esc(timeOf(r)?new Date(timeOf(r)).toLocaleString('vi-VN'):'—')+'</td><td><button class="btn" onclick="viewWriting('+i+')">👁 Xem bài</button></td></tr>'}
function quizRow(r,i){const correct=r.correct_count??quizCorrect(r),total=r.total_questions??questions().length;return '<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||r.full_name||r.name||'—')+'</td><td>'+esc(r.student_id||r.mssv||'—')+'</td><td><b>'+esc(scoreOf(r).toFixed(2))+'</b></td><td class="'+(Number(correct)===Number(total)?'correct':'')+'">'+esc(correct)+'/'+esc(total)+'</td><td>'+esc(timeOf(r)?new Date(timeOf(r)).toLocaleString('vi-VN'):'—')+'</td><td><button class="btn" onclick="viewQuiz('+i+')">👁 Xem bài</button></td></tr>'}
function viewQuiz(i){const r=filtered[i],qs=questions(),key=answerKey(),ans=answersOf(r);let html='<div class="card"><div class="row"><div><h2>📋 Bài làm: '+esc(r.student_name||r.full_name||r.name||'Sinh viên')+'</h2><div class="muted">MSSV: '+esc(r.student_id||r.mssv||'—')+' • Điểm: <b>'+scoreOf(r).toFixed(2)+'</b> • Đúng: <b>'+esc(r.correct_count??quizCorrect(r))+'/'+esc(r.total_questions??qs.length)+'</b></div></div><button class="btn gray" onclick="document.getElementById(\'detail\').innerHTML=\'\'">✕ Đóng</button></div>';qs.forEach((q,n)=>{const given=normalizeAnswer(answerAt(ans,n)),expected=normalizeAnswer(key[n]),ok=given!==null&&expected!==null&&given===expected,opts=Array.isArray(q?.options)?q.options:[],letter=x=>x===null?'':String.fromCharCode(65+x);html+='<div class="review '+(ok?'ok':'bad')+'"><b>Câu '+(n+1)+'.</b> '+esc(q?.text||q?.question||'')+'<div class="'+(ok?'correct':'wrong')+'">'+(ok?'✅ Đúng':'❌ Sai')+'</div><div class="answer">Đáp án chọn: <b>'+esc(given===null?'Chưa trả lời':letter(given)+'. '+(opts[given]??''))+'</b></div><div class="answer">Đáp án đúng: <b>'+esc(expected===null?'Chưa có đáp án':letter(expected)+'. '+(opts[expected]??''))+'</b></div></div>'});html+='</div>';document.getElementById('detail').innerHTML=html;document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function viewWriting(i){const r=filtered[i],rr=rubricRows(r),strengths=arr(r.strengths),improvements=arr(r.improvements),errors=arr(r.grammar_errors),phrases=arr(r.better_phrases);document.getElementById('detail').innerHTML='<div class="card"><div class="row"><h2>✍️ '+esc(r.student_name||'Bài Writing')+'</h2><button class="btn gray" onclick="document.getElementById(\'detail\').innerHTML=\'\'">Đóng</button></div><p class="muted">'+esc(r.word_count??0)+' từ • '+esc(r.total_score??r.score??0)+'/10 • '+esc(timeOf(r)?new Date(timeOf(r)).toLocaleString('vi-VN'):'—')+'</p><div class="rubric">'+rr.map(x=>'<span>'+esc(x.name)+': <b>'+esc(x.value)+'</b>/'+esc(x.max)+'</span>').join('')+'</div><h3>📝 Bài viết</h3><div class="essay">'+esc(r.essay||'')+'</div><div class="feedback"><b>💬 Nhận xét tổng quan</b><p>'+esc(r.overall_comment||'')+'</p></div>'+(strengths.length?'<div class="feedback ok"><b>💪 Điểm mạnh</b><ul>'+strengths.map(x=>'<li>'+esc(typeof x==='string'?x:x?.text||'')+'</li>').join('')+'</ul></div>':'')+(improvements.length?'<div class="feedback"><b>🎯 Cần cải thiện</b><ul>'+improvements.map(x=>'<li>'+esc(typeof x==='string'?x:x?.text||'')+'</li>').join('')+'</ul></div>':'')+(errors.length?'<div class="feedback bad"><b>🔎 Lỗi cần chú ý</b>'+errors.map(x=>'<p><b>'+esc(x?.original||'')+' → '+esc(x?.correction||'')+'</b><br>'+esc(x?.explanation||'')+'</p>').join('')+'</div>':'')+(phrases.length?'<div class="feedback"><b>✨ Gợi ý diễn đạt tốt hơn</b>'+phrases.map(x=>'<p>'+esc(x?.original||'')+' → <b>'+esc(x?.better||'')+'</b></p>').join('')+'</div>':'')+'</div>';document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function exportCSV(){const h=mode==='writing'?['STT','Sinh viên','Điểm','Tiêu chí','Thời gian']:['STT','Sinh viên','MSSV','Điểm','Đúng','Thời gian'];const d=filtered.map((r,i)=>mode==='writing'?[i+1,r.student_name,scoreOf(r),Object.entries(parse(r.rubric_scores,{})).map(([n,v])=>n+': '+v).join(' | '),timeOf(r)]:[i+1,r.student_name,r.student_id,scoreOf(r),((r.correct_count??quizCorrect(r))+'/'+(r.total_questions??questions().length)),timeOf(r)]);const csv='\ufeff'+[h,...d].map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ket-qua-'+(exam?.title||'de')+'.csv';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('search').oninput=render;document.getElementById('pass').onchange=render;document.getElementById('sort').onchange=render;init();
</script>
</body>
</html>
