<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio - Kết quả</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.wrap{max-width:1200px;margin:auto;padding:22px 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.gray{background:#e8eef7;color:#0f172a}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f8fafc}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px}.stat b{font-size:21px}.muted{color:#64748b;font-size:14px}.rubric{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.rubric span{padding:7px 10px;border:1px solid #dbeafe;border-radius:9px;background:#eff6ff}.essay{white-space:pre-wrap;line-height:1.65;background:#f8fafc;padding:14px;border-radius:10px}.review{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:10px 0}.ok{border-left:5px solid #16a34a;background:#f0fdf4}.bad{border-left:5px solid #dc2626;background:#fef2f2}.answer{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff}.correct{color:#15803d;font-weight:800}.wrong{color:#b91c1c;font-weight:800}@media(max-width:800px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><header class="top"><div class="wrap"><h1>📊 Kết quả sinh viên</h1><div>Theo dõi, tìm kiếm và xem lại kết quả từng đề</div></div></header>
<main class="wrap"><div class="row"><div><h2 id="examTitle">Kết quả</h2><div id="examInfo" class="muted"></div></div><a class="btn gray" href="./admin.html">← Quay lại Dashboard</a></div>
<div class="card"><div class="filters"><input id="search" placeholder="🔎 Tìm tên hoặc MSSV..." oninput="render()"><select id="pass" onchange="render()"><option value="all">Tất cả kết quả</option><option value="pass">Đạt</option><option value="fail">Chưa đạt</option></select><select id="sort" onchange="render()"><option value="new">Mới nhất</option><option value="high">Điểm cao → thấp</option><option value="low">Điểm thấp → cao</option></select></div></div>
<div class="stats"><div class="stat"><span>👥 Sinh viên</span><b id="sStudents">0</b></div><div class="stat"><span>📋 Bài nộp</span><b id="sSubs">0</b></div><div class="stat"><span>📈 Điểm TB</span><b id="sAvg">0</b></div><div class="stat"><span>🏆 Cao nhất</span><b id="sHigh">0</b></div><div class="stat"><span>🎯 Tỷ lệ đạt</span><b id="sPass">0%</b></div></div>
<div class="card"><div class="row"><h3>Danh sách kết quả</h3><button class="btn" onclick="exportCSV()">📥 Xuất CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Sinh viên</th><th>MSSV</th><th>Điểm</th><th>Chi tiết</th><th>Thời gian nộp</th><th></th></tr></thead><tbody id="tbody"><tr><td colspan="7">Đang tải...</td></tr></tbody></table></div></div><div id="detail"></div></main>
<script>
const c=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(c.url,c.anonKey);let exam=null,rows=[],filtered=[],mode='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const parseJson=(v,f)=>{if(typeof v!=='string')return v??f;try{return JSON.parse(v)}catch{return f}};
const id=()=>new URLSearchParams(location.search).get('exam')||'';
const qs=e=>{const x=parseJson(e?.questions,[]);return Array.isArray(x)?x:[]};
function answer(v){if(v===undefined||v===null||v==='')return null;if(typeof v==='object')v=v.value??v.answer??v.correct_answer??v.index??v.option??v.selected;if(v===undefined||v===null||v==='')return null;const o=String(v).trim().toUpperCase();if(/^[A-D]$/.test(o))return o.charCodeAt(0)-65;if(/^\d+$/.test(o))return Number(o);return null}
function answers(v){v=parseJson(v,{});return Array.isArray(v)?v:(v?.answers&&typeof v.answers==='object'?v.answers:(v||{}))}
function at(a,i){if(Array.isArray(a))return a[i];for(const k of [String(i),String(i+1),`q${i}`,`q${i+1}`])if(Object.prototype.hasOwnProperty.call(a,k))return a[k];return undefined}
function key(e){const q=qs(e),r=parseJson(e.answer_key,[]);let k=Array.isArray(r)?r:Object.values(r||{});return q.map((x,i)=>k[i]??x.answer??x.correct_answer??x.correctAnswer)}
function calc(r){const q=qs(exam),k=key(exam),a=answers(r.answers??r.student_answers);let correct=0;for(let i=0;i<q.length;i++)if(answer(at(a,i))!==null&&answer(at(a,i))===answer(k[i]))correct++;const total=q.length||Number(r.total_questions)||0;return {...r,correct,total,score:total?Math.round(correct/total*10*100)/100:0}}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}const eid=id();if(!eid){msg('Thiếu mã đề.');return}const er=await sb.from('exams').select('*').eq('id',eid).single();if(er.error){msg('Không tìm thấy đề.');return}exam=er.data;mode=String(exam.exam_type||'listening').toLowerCase();document.getElementById('examTitle').textContent='📊 '+(exam.title||'Kết quả');document.getElementById('examInfo').textContent=mode==='writing'?'✍️ Writing • '+(exam.writing_rubric?.length||0)+' tiêu chí chấm':'🎧 Listening / trắc nghiệm • '+qs(exam).length+' câu';let r;if(mode==='writing')r=await sb.from('writing_submissions').select('*').eq('exam_id',eid).order('created_at',{ascending:false});else r=await sb.from('submissions').select('*').eq('exam_id',eid).order('submitted_at',{ascending:false});if(r.error){msg('Không tải được kết quả: '+r.error.message);return}rows=r.data||[];render()}
function msg(t){document.getElementById('tbody').innerHTML='<tr><td colspan="7">'+esc(t)+'</td></tr>'}
function render(){const q=(document.getElementById('search').value||'').toLowerCase().trim(),p=document.getElementById('pass').value,s=document.getElementById('sort').value;filtered=mode==='writing'?rows.slice():rows.map(calc);filtered=filtered.filter(r=>{const n=String(r.student_name||r.name||'').toLowerCase(),m=String(r.student_id||r.mssv||'').toLowerCase(),ok=q?(n.includes(q)||m.includes(q)):true;return ok&&(p==='all'||(p==='pass'&&Number(r.total_score??r.score)>=5)||(p==='fail'&&Number(r.total_score??r.score)<5))});filtered.sort((a,b)=>s==='high'?Number((b.total_score??b.score)||0)-Number((a.total_score??a.score)||0):s==='low'?Number((a.total_score??a.score)||0)-Number((b.total_score??b.score)||0):new Date(b.created_at||b.submitted_at)-new Date(a.created_at||a.submitted_at));const unique=new Set(filtered.map(r=>r.student_user_id||r.student_id||r.student_name||r.id)),scores=filtered.map(r=>Number(r.total_score??r.score)||0),avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0,pass=scores.filter(x=>x>=5).length;document.getElementById('sStudents').textContent=unique.size;document.getElementById('sSubs').textContent=filtered.length;document.getElementById('sAvg').textContent=avg.toFixed(2);document.getElementById('sHigh').textContent=scores.length?Math.max(...scores).toFixed(2):'0';document.getElementById('sPass').textContent=scores.length?Math.round(pass/scores.length*100)+'%':'0%';document.getElementById('tbody').innerHTML=filtered.length?filtered.map((r,i)=>mode==='writing'?writingRow(r,i):listenRow(r,i)).join(''):'<tr><td colspan="7">Không có kết quả phù hợp.</td></tr>'}
function writingRow(r,i){return `<tr><td>${i+1}</td><td>${esc(r.student_name||'—')}</td><td>—</td><td><b>${esc(r.total_score)}/10</b></td><td>${Object.entries(r.rubric_scores||{}).map(([n,v])=>esc(n)+': '+esc(v)).join('<br>')}</td><td>${esc(new Date(r.created_at).toLocaleString('vi-VN'))}</td><td><button class="btn" onclick="viewWriting('${r.id}')">👁 Xem bài</button></td></tr>`}
function listenRow(r,i){return `<tr><td>${i+1}</td><td>${esc(r.student_name||'—')}</td><td>${esc(r.student_id||'—')}</td><td><b>${r.score}</b></td><td>${r.correct}/${r.total}</td><td>${esc(new Date(r.submitted_at).toLocaleString('vi-VN'))}</td><td><button class="btn" onclick="viewListening('${r.id}')">👁 Xem bài</button></td></tr>`}
function viewWriting(id){const r=rows.find(x=>x.id===id);if(!r)return;const scores=r.rubric_scores||{};const strengths=parseJson(r.strengths,[]),improvements=parseJson(r.improvements,[]);document.getElementById('detail').innerHTML=`<div class="card"><div class="row"><h2>✍️ Bài Writing - ${esc(r.student_name)}</h2><button class="btn gray" onclick="closeDetail()">Đóng</button></div><p class="muted">${esc(r.word_count)} từ • ${esc(r.total_score)}/10 • ${esc(new Date(r.created_at).toLocaleString('vi-VN'))}</p><div class="rubric">${Object.entries(scores).map(([n,v])=>`<span>${esc(n)}: <b>${esc(v)}</b></span>`).join('')}</div><h3>📝 Bài viết</h3><div class="essay">${esc(r.essay)}</div><h3>💬 Nhận xét tổng quan</h3><p>${esc(r.overall_comment||'')}</p><h3>💪 Điểm mạnh</h3><ul>${strengths.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><h3>🎯 Cần cải thiện</h3><ul>${improvements.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`;document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function viewListening(id){const r=rows.map(calc).find(x=>x.id===id);if(!r)return;const q=qs(exam),k=key(exam),a=answers(r.answers);let h=`<div class="card"><div class="row"><h2>📋 Bài làm - ${esc(r.student_name)}</h2><button class="btn gray" onclick="closeDetail()">Đóng</button></div><p class="muted">Điểm: ${r.score} • Đúng: ${r.correct}/${r.total}</p>`;q.forEach((x,i)=>{const g=answer(at(a,i)),e=answer(k[i]),ok=g!==null&&g===e,o=x.options||[];h+=`<div class="review ${ok?'ok':'bad'}"><b>Câu ${i+1}. ${esc(x.text||x.question||'')}</b><div class="answer ${ok?'correct':'wrong'}">${ok?'✅ Đúng':'❌ Sai'}</div><div class="answer">Bạn chọn: <b>${g===null?'Chưa trả lời':esc(String.fromCharCode(65+g)+'. '+(o[g]||''))}</b></div><div class="answer">Đáp án đúng: <b>${e===null?'Chưa có':esc(String.fromCharCode(65+e)+'. '+(o[e]||''))}</b></div></div>`});document.getElementById('detail').innerHTML=h+'</div>';document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function closeDetail(){document.getElementById('detail').innerHTML=''}
function exportCSV(){const h=mode==='writing'?['STT','Sinh viên','Điểm','Rubric','Thời gian']:['STT','Sinh viên','MSSV','Điểm','Đúng','Tổng câu','Thời gian'];const d=filtered.map((r,i)=>mode==='writing'?[i+1,r.student_name,r.total_score,Object.entries(r.rubric_scores||{}).map(([n,v])=>n+': '+v).join(' | '),r.created_at]:[i+1,r.student_name,r.student_id,r.score,r.correct,r.total,r.submitted_at]);const csv='\ufeff'+[h,...d].map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ket-qua-'+(exam?.title||'de')+'.csv';a.click()}
init();
</script></body></html>
