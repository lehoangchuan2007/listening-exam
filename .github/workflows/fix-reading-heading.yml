name: Fix Reading heading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-heading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename Reading question heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('student.html')
          s = p.read_text(encoding='utf-8')
          old = '❓ Câu hỏi & đáp án'
          new = '❓ Câu hỏi'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Heading updated.')
          else:
              print('Heading already updated or not found.')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- student.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html
          git commit -m 'Fix Reading student question heading'
          git push
