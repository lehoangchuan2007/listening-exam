<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Practice - Học sinh</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:28px 18px}.wrap{max-width:1050px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 6px 24px #0f172a0b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.exam{border:1px solid #e2e8f0;border-radius:16px;padding:18px;transition:.15s}.exam:hover{border-color:#60a5fa;transform:translateY(-2px);box-shadow:0 8px 20px #2563eb12}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.muted{color:#64748b;font-size:14px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.search{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.notice{padding:14px;border-radius:11px;background:#eff6ff;color:#1e40af;margin:12px 0}.danger{background:#fef2f2;color:#991b1b}.q{border-bottom:1px solid #e2e8f0;padding:20px 0}.choice{display:block;border:1px solid #cbd5e1;padding:12px;border-radius:9px;margin:8px 0;cursor:pointer}.timer{position:sticky;top:10px;z-index:5;background:#fff;border:2px solid #2563eb;border-radius:12px;padding:12px;text-align:center;font-weight:900;font-size:20px}.result{text-align:center;font-size:42px;font-weight:900;color:#2563eb}.review{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.review.ok{border-left:5px solid #16a34a;background:#f0fdf4}.review.bad{border-left:5px solid #dc2626;background:#fef2f2}.review .answer{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff}.review .correct{color:#15803d;font-weight:800}.review .wrong{color:#b91c1c;font-weight:800}audio{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Listening Practice</h1><div>🧑‍🎓 Khu vực ôn tập & làm bài</div></div></header><main class="wrap"><div id="app"></div></main><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);const app=document.getElementById('app');let exams=[],exam=null,timer=null;const UNLIMITED=2147483647;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const friendly=x=>{const s=String(x||'').toLowerCase();if(s.includes('maximum attempts'))return'🚫 Bạn đã hết số lần làm bài.';if(s.includes('not available')||s.includes('closed'))return'🔒 Đề thi hiện đã đóng hoặc không còn khả dụng.';if(s.includes('not yet'))return'⏰ Chưa đến thời gian thi.';if(s.includes('ended'))return'⏰ Thời gian thi đã kết thúc.';return'❌ '+x};function error(x){app.innerHTML='<div class="card notice danger"><h2>Không thể tải đề</h2><p>'+esc(x)+'</p></div>'}async function init(){const direct=location.hash.startsWith('#exam=');if(direct)return loadExam(location.hash.slice(6));await loadList()}async function loadList(){app.innerHTML='<div class="card"><h2>📚 Thư viện đề thi</h2><p class="muted">Các đề đã được giáo viên mở. Chọn đề để luyện tập hoặc làm bài.</p><input id="search" class="search" placeholder="🔎 Tìm kiếm tên đề..."></div><div id="list" class="grid"><div class="card">⏳ Đang tải danh sách đề...</div></div>';const r=await sb.rpc('get_published_exams_for_student');if(r.error)return error(r.error.message);exams=r.data||[];renderList();document.getElementById('search').oninput=e=>renderList(e.target.value)}function renderList(q=''){q=q.toLowerCase().trim();const rows=exams.filter(e=>!q||String(e.title||'').toLowerCase().includes(q)||String(e.description||'').toLowerCase().includes(q));document.getElementById('list').innerHTML=rows.length?rows.map(e=>'<div class="exam"><span class="badge">🟢 Đang mở</span><h2>'+esc(e.title)+'</h2><p class="muted">'+esc(e.description||'Chưa có mô tả')+'</p><p>📝 '+esc(e.question_count)+' câu &nbsp;•&nbsp; ⏱️ '+esc(e.duration_minutes)+' phút &nbsp;•&nbsp; 🔢 '+(Number(e.max_attempts)>=UNLIMITED?'♾️ Không giới hạn':esc(e.max_attempts||1)+' lần')+'</p><button class="btn" onclick="loadExam(\''+esc(e.id)+'\')">🚀 Làm bài</button></div>').join(''):'<div class="card">🔎 Không tìm thấy đề phù hợp.</div>'}async function loadExam(id){app.innerHTML='<div class="card">⏳ Đang tải đề thi...</div>';const r=await sb.rpc('get_exam_for_student',{p_exam_id:id});if(r.error)return error(friendly(r.error.message));let d=r.data;if(Array.isArray(d))d=d[0];if(d&&d.data&&Array.isArray(d.data))d=d.data[0];if(typeof d==='string'){try{d=JSON.parse(d)}catch{}}if(!d||!d.id)return error('❌ Không nhận được dữ liệu đề thi từ máy chủ.');exam=d;showInfo()}function showInfo(){const maxText=Number(exam.max_attempts)>=UNLIMITED?'♾️ Không giới hạn':((exam.max_attempts||1)+' lần');const now=Date.now(),st=exam.start_at?new Date(exam.start_at).getTime():null,en=exam.end_at?new Date(exam.end_at).getTime():null;let statusNotice='';if(st&&now<st)statusNotice='<div class="notice">⏰ Đề chưa mở. Bắt đầu từ: <b>'+new Date(st).toLocaleString('vi-VN')+'</b></div>';else if(en&&now>en)statusNotice='<div class="notice danger">🔒 Đề đã hết hạn vào: <b>'+new Date(en).toLocaleString('vi-VN')+'</b></div>';else if(en)statusNotice='<div class="notice">🟢 Đang mở đến: <b>'+new Date(en).toLocaleString('vi-VN')+'</b></div>';app.innerHTML='<div class="card"><button class="btn gray" onclick="goLibrary()">← Danh sách đề</button><h2>🎧 '+esc(exam.title)+'</h2><p class="muted">'+esc(exam.description||'')+'</p>'+statusNotice+'<div class="notice">⏱️ Thời gian: <b>'+exam.duration_minutes+' phút</b><br>🔢 Số lần làm tối đa: <b>'+maxText+'</b></div><div class="field"><label>Họ và tên</label><input id="name" placeholder="Nguyễn Văn A"></div><div class="field"><label>MSSV</label><input id="sid" placeholder="B1234567"></div><button class="btn" onclick="start()" '+(st&&now<st||en&&now>en?'disabled style="opacity:.55;cursor:not-allowed"':'')+'>🚀 Bắt đầu làm bài</button></div>'}function goLibrary(){if(timer){clearInterval(timer);timer=null}location.href='./student.html'}async function start(){const name=document.getElementById('name').value.trim(),sid=document.getElementById('sid').value.trim();if(!name||!sid)return alert('Vui lòng nhập Họ tên và MSSV.');const now=Date.now(),st=exam.start_at?new Date(exam.start_at).getTime():null,en=exam.end_at?new Date(exam.end_at).getTime():null;if(st&&now<st)return alert('⏰ Chưa đến thời gian mở đề.');if(en&&now>en)return alert('⏰ Thời gian thi đã kết thúc.');const r=await sb.rpc('check_exam_attempts',{p_exam_id:exam.id,p_student_id:sid});if(r.error)return alert(friendly(r.error.message));if(Number(exam.max_attempts)<UNLIMITED&&Number(r.data)>=Number(exam.max_attempts||1))return alert('🚫 Bạn đã hết số lần làm bài.');renderExam(name,sid)}function renderExam(name,sid){let h='<div class="timer" id="timer">⏱️ Đang chuẩn bị...</div><div class="card"><h2>'+esc(exam.title)+'</h2>';if(exam.audio_url)h+='<audio controls src="'+esc(exam.audio_url)+'"></audio>';h+='<div id="questions">';(exam.questions||[]).forEach((q,i)=>{h+='<div class="q"><b>Câu '+(i+1)+'. '+esc(q.question||q.text||'')+'</b>';(q.options||[]).forEach((o,j)=>h+='<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>');h+='</div>'});h+='</div><button class="btn" onclick="submitExam(\''+esc(name).replace(/'/g,"\\'")+'\',\''+esc(sid).replace(/'/g,"\\'")+'\')">📤 Nộp bài</button></div>';app.innerHTML=h;let end=Date.now()+Number(exam.duration_minutes||30)*60000;timer=setInterval(()=>{let left=Math.max(0,end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const t=document.getElementById('timer');if(t)t.textContent='⏱️ Còn '+m+':'+String(s).padStart(2,'0');if(!left){clearInterval(timer);submitExam(name,sid)}},500)}async function submitExam(name,sid){if(timer)clearInterval(timer);const answers={};(exam.questions||[]).forEach((q,i)=>{const x=document.querySelector('input[name="q'+i+'"]:checked');if(x)answers[i]=Number(x.value)});const r=await sb.rpc('submit_exam',{p_exam_id:exam.id,p_student_name:name,p_student_id:sid,p_answers:answers});if(r.error)return alert(friendly(r.error.message));let d=r.data||{};if(Array.isArray(d))d=d[0]||{};if(typeof d==='string'){try{d=JSON.parse(d)}catch{}}showResult(d,answers)}function showResult(d,answers){const questions=exam.questions||d.questions||[];const key=d.answer_key||exam.answer_key||exam.answers_key||[];if(Array.isArray(key))exam.answer_key=key;let html='<div class="card"><div class="result">'+esc(d.score??'—')+'</div><h2 style="text-align:center">🎉 Đã nộp bài thành công!</h2><p style="text-align:center">Đúng: '+esc(d.correct_count??'—')+'/'+esc(d.total_questions??questions.length)+'</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="reviewBtn">📋 Xem đáp án & bài làm</button><button class="btn gray" onclick="goLibrary()">📚 Về thư viện đề</button></div></div><div id="reviewBox" class="card hidden"><h2>📋 Xem đáp án & bài làm</h2><p class="muted">Kiểm tra câu bạn chọn và đáp án đúng.</p><div id="reviewList"></div></div>';app.innerHTML=html;document.getElementById('reviewBtn').onclick=()=>{const box=document.getElementById('reviewBox');box.classList.toggle('hidden');if(!box.dataset.rendered){renderReview(answers,questions,key);box.dataset.rendered='1'}}}function renderReview(answers,questions,key){const box=document.getElementById('reviewList');if(!Array.isArray(key)||key.length!==questions.length){box.innerHTML='<div class="notice danger">Máy chủ chưa trả answer_key sau khi nộp bài. Cần cập nhật function submit_exam để trả answer_key sau khi chấm.</div>';return}box.innerHTML=questions.map((q,i)=>{const given=answers[String(i)];const correct=Number(key[i]);const ok=given!==undefined&&Number(given)===correct;const givenText=given===undefined?'Chưa trả lời':(q.options||[])[Number(given)]??('Đáp án '+String.fromCharCode(65+Number(given)));const correctText=(q.options||[])[correct]??('Đáp án '+String.fromCharCode(65+correct));return '<div class="review '+(ok?'ok':'bad')+'"><b>Câu '+(i+1)+'. '+esc(q.question||q.text||'')+'</b><div class="answer '+(ok?'correct':'wrong')+'">'+(ok?'✅ Đúng':'❌ Sai')+'</div><div class="answer">Bạn chọn: <b>'+esc(given===undefined?'Chưa trả lời':String.fromCharCode(65+Number(given))+'. '+givenText)+'</b></div><div class="answer">Đáp án đúng: <b>'+esc(String.fromCharCode(65+correct)+'. '+correctText)+'</b></div></div>'}).join('')}init();</script></body></html>
