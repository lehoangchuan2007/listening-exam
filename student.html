<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Exam - Học sinh</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:25px 18px}.wrap{max-width:900px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0f172a0b}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn.green{background:#16a34a}.muted{color:#64748b;font-size:14px}.notice{padding:14px;border-radius:11px;background:#eff6ff;color:#1e40af;margin:12px 0}.danger{background:#fef2f2;color:#991b1b}.q{border-bottom:1px solid #e2e8f0;padding:20px 0}.choice{display:block;border:1px solid #cbd5e1;padding:12px;border-radius:9px;margin:8px 0;cursor:pointer}.choice:hover{background:#f8fafc}.timer{position:sticky;top:10px;z-index:5;background:#fff;border:2px solid #2563eb;border-radius:12px;padding:12px;text-align:center;font-weight:900;font-size:20px}.result{text-align:center;font-size:42px;font-weight:900;color:#2563eb}.hidden{display:none!important}audio{width:100%}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Listening Exam</h1><div>🧑‍🎓 Khu vực làm bài học sinh</div></div></header><main class="wrap"><div id="app"></div></main><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);const app=document.getElementById('app');let exam=null,timer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function id(){return location.hash.startsWith('#exam=')?location.hash.slice(6):''}async function init(){if(!id())return error('❌ Link đề thi không hợp lệ.');const r=await sb.rpc('get_exam_for_student',{p_exam_id:id()});if(r.error)return error(friendly(r.error.message));exam=r.data;showInfo()}function friendly(x){const s=String(x||'').toLowerCase();if(s.includes('not available')||s.includes('closed'))return '🔒 Đề thi hiện đã đóng hoặc không còn khả dụng.';if(s.includes('not yet'))return '⏰ Chưa đến thời gian thi.';if(s.includes('ended'))return '⏰ Thời gian thi đã kết thúc.';return '❌ '+x}function error(x){app.innerHTML='<div class="card notice danger"><h2>Không thể vào đề</h2><p>'+esc(x)+'</p></div>'}function showInfo(){app.innerHTML='<div class="card"><h2>'+esc(exam.title)+'</h2><p class="muted">'+esc(exam.description||'')+'</p><div class="notice">⏱️ Thời gian: <b>'+exam.duration_minutes+' phút</b><br>🔢 Số lần làm tối đa: <b>'+((exam.max_attempts||1))+'</b></div><div class="field"><label>Họ và tên</label><input id="name" placeholder="Nguyễn Văn A"></div><div class="field"><label>MSSV</label><input id="sid" placeholder="B1234567"></div><button class="btn" onclick="start()">🚀 Bắt đầu làm bài</button></div>'}async function start(){const name=document.getElementById('name').value.trim(),sid=document.getElementById('sid').value.trim();if(!name||!sid)return alert('Vui lòng nhập Họ tên và MSSV.');const r=await sb.rpc('check_exam_attempts',{p_exam_id:exam.id,p_student_id:sid});if(r.error){alert(friendly(r.error.message));return}if(Number(r.data)>=Number(exam.max_attempts||1))return alert('🚫 Bạn đã hết số lần làm bài.');renderExam(name,sid)}function renderExam(name,sid){let h='<div class="timer" id="timer">⏱️ Đang chuẩn bị...</div><div class="card"><h2>'+esc(exam.title)+'</h2>';if(exam.audio_url)h+='<audio controls src="'+esc(exam.audio_url)+'"></audio>';h+='<div id="questions">';(exam.questions||[]).forEach((q,i)=>{h+='<div class="q"><b>Câu '+(i+1)+'. '+esc(q.question||q.text||'')+'</b>';const opts=q.options||[];opts.forEach((o,j)=>h+='<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>');h+='</div>'});h+='</div><button class="btn green" onclick="submitExam(\''+esc(name).replace(/'/g,"\\'")+'\',\''+esc(sid).replace(/'/g,"\\'")+'\')">📤 Nộp bài</button></div>';app.innerHTML=h;let end=Date.now()+Number(exam.duration_minutes||30)*60000;timer=setInterval(()=>{let left=Math.max(0,end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;document.getElementById('timer').textContent='⏱️ Còn '+m+':'+String(s).padStart(2,'0');if(!left){clearInterval(timer);submitExam(name,sid,true)}},500)}async function submitExam(name,sid,auto){if(timer)clearInterval(timer);const answers={};(exam.questions||[]).forEach((q,i)=>{const x=document.querySelector('input[name="q'+i+'"]:checked');if(x)answers[i]=Number(x.value)});const r=await sb.rpc('submit_exam',{p_exam_id:exam.id,p_student_name:name,p_student_id:sid,p_answers:answers});if(r.error){alert(friendly(r.error.message));return}const d=r.data||{};app.innerHTML='<div class="card"><div class="result">'+esc(d.score??'—')+'</div><h2 style="text-align:center">🎉 Đã nộp bài thành công!</h2><p style="text-align:center">Đúng: '+esc(d.correct_count??'—')+'/'+esc(d.total_questions??exam.questions.length)+'</p></div>'}init();</script></body></html>
