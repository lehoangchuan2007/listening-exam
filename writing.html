<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio - Writing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=3"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:25px 18px}.wrap{max-width:1050px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 6px 24px #0f172a0b}.muted{color:#64748b}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.btn:disabled{opacity:.55;cursor:not-allowed}.prompt{background:#eff6ff;border-left:5px solid #2563eb;padding:18px;border-radius:12px;line-height:1.7;white-space:pre-wrap}.writing-box{width:100%;min-height:360px;border:1px solid #cbd5e1;border-radius:14px;padding:16px;font:16px/1.8 Inter,system-ui,sans-serif;resize:vertical;outline:none}.writing-box:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.score{font-size:48px;font-weight:900;color:#2563eb}.rubric-result{margin:14px 0 18px;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#fff}.rubric-title{padding:14px 16px;font-weight:900;background:#f8fafc;border-bottom:1px solid #e2e8f0}.rubric-row{display:flex;align-items:center;min-height:52px;padding:12px 16px;border-bottom:1px solid #eef2f7;font-size:16px}.rubric-row:last-of-type{border-bottom:0}.rubric-name{flex:1;font-weight:700}.rubric-row strong{font-size:20px;min-width:42px;text-align:right}.rubric-max{font-weight:800;color:#64748b;min-width:38px;text-align:left}.rubric-total{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;background:#eff6ff;border-top:2px solid #dbeafe;font-size:18px;font-weight:900}.rubric-total strong{font-size:25px;color:#2563eb}.feedback{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}.error{background:#fff7ed;border-left:4px solid #f59e0b}.ok{background:#f0fdf4;border-left:4px solid #16a34a}.ai-status{margin:14px 0;padding:18px 20px;border:1px solid #bfdbfe;border-left:5px solid #2563eb;border-radius:14px;background:linear-gradient(135deg,#eff6ff,#f8fbff);display:flex;align-items:center;gap:14px}.ai-status-icon{font-size:28px;line-height:1}.ai-status-main{font-weight:900;color:#1e3a8a;font-size:16px}.ai-status-sub{margin-top:4px;color:#64748b;font-size:14px}.ai-spinner{width:20px;height:20px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:ai-spin .8s linear infinite;flex:none}@keyframes ai-spin{to{transform:rotate(360deg)}}.ai-retry{background:#fff7ed;border-color:#fed7aa;border-left-color:#f97316}.ai-retry .ai-status-main{color:#9a3412}.ai-retry .ai-spinner{border-color:#fed7aa;border-top-color:#f97316}@media(max-width:500px){.score{font-size:38px}.rubric-row{padding:11px 12px}.rubric-row strong{font-size:18px}.rubric-max{min-width:32px}}</style></head><body><header class="top"><div class="wrap"><h1>✍️ English Studio — Writing</h1><div>AI chấm bài tự động</div></div></header><main class="wrap"><div id="app"><div class="card">⏳ Đang tải đề Writing...</div></div></main><script src="writing-ai.js?v=6"></script></body></html>
