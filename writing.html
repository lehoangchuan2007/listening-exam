<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio - Writing</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=3"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:25px 18px}.wrap{max-width:1050px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 6px 24px #0f172a0b}.muted{color:#64748b}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.btn:disabled{opacity:.55;cursor:not-allowed}.prompt{background:#eff6ff;border-left:5px solid #2563eb;padding:18px;border-radius:12px;line-height:1.7;white-space:pre-wrap}.writing-box{width:100%;min-height:360px;border:1px solid #cbd5e1;border-radius:14px;padding:16px;font:16px/1.8 Inter,system-ui,sans-serif;resize:vertical;outline:none}.writing-box:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.score{font-size:48px;font-weight:900;color:#2563eb}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.criterion{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px;text-align:center}.criterion b{display:block;font-size:25px;margin-top:5px}.feedback{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}.error{background:#fff7ed;border-left:4px solid #f59e0b}.ok{background:#f0fdf4;border-left:4px solid #16a34a}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>✍️ English Studio — Writing</h1><div>AI chấm bài tự động</div></div></header><main class="wrap"><div id="app"><div class="card">⏳ Đang tải đề Writing...</div></div></main><script src="writing-ai.js?v=4"></script></body></html>
