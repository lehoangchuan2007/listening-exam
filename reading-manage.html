<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio - Tạo đề Reading</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.wrap{max-width:1150px;margin:auto;padding:22px 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 5px 20px #0f172a0b}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.field textarea{min-height:100px;resize:vertical}.passage{min-height:300px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.gray{background:#e8eef7;color:#0f172a}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#f59e0b}.muted{color:#64748b;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.q{border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:12px 0;background:#f8fafc}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.option{display:grid;grid-template-columns:1fr 130px 38px;gap:8px;margin:8px 0;align-items:center}.option input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af}.error{background:#fef2f2;color:#991b1b}.exam{border:1px solid #e2e8f0;border-radius:13px;padding:14px;margin-top:10px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.off{background:#f1f5f9;color:#475569}@media(max-width:700px){.grid{grid-template-columns:1fr}.option{grid-template-columns:1fr}.option button{width:max-content}}</style></head><body><header class="top"><div class="wrap"><h1>📖 English Studio - Reading</h1><div>👨‍🏫 Tạo và quản lý đề Reading</div></div></header><main class="wrap"><div id="app">⏳ Đang tải...</div></main><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);const app=document.getElementById('app');let user=null,exams=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function qs(){return document.querySelectorAll('#questions .q')}function questionTemplate(i=0){return '<div class="q"><div class="qhead"><b>Câu '+(i+1)+'</b><button class="btn red" onclick="this.closest(\'.q\').remove();renumber()">🗑️ Xóa câu</button></div><div class="field"><label>Nội dung câu hỏi</label><textarea class="qtext" placeholder="Nhập câu hỏi..."></textarea></div><label><b>Các lựa chọn</b></label><div class="options">'+['A','B','C','D'].map((l,j)=>'<div class="option"><input class="opttext" placeholder="Đáp án '+l+'"><select class="correct"><option value="1">Không đúng</option><option value="0" '+(j===0?'selected':'')+'>✅ Đáp án đúng</option></select><button class="btn red" onclick="this.parentElement.remove()">×</button></div>').join('')+'</div><button class="btn gray" onclick="addOption(this)">＋ Thêm lựa chọn</button></div>'}function addOption(btn){const box=btn.closest('.q'),n=box.querySelectorAll('.option').length;const d=document.createElement('div');d.className='option';d.innerHTML='<input class="opttext" placeholder="Đáp án '+String.fromCharCode(65+n)+'"><select class="correct"><option value="1">Không đúng</option><option value="0">✅ Đáp án đúng</option></select><button class="btn red" onclick="this.parentElement.remove()">×</button>';box.querySelector('.options').appendChild(d)}function renumber(){[...qs()].forEach((q,i)=>q.querySelector('.qhead b').textContent='Câu '+(i+1))}function addQuestion(){document.getElementById('questions').insertAdjacentHTML('beforeend',questionTemplate(qs().length));renumber()}function collect(){const out=[];for(const q of qs()){const text=q.querySelector('.qtext').value.trim();const opts=[...q.querySelectorAll('.opttext')].map(x=>x.value.trim());const correct=[...q.querySelectorAll('.correct')].findIndex(x=>x.value==='0');if(!text||opts.length<2||opts.some(x=>!x)||correct<0)return null;out.push({text,options:opts,answer:correct})}return out}function form(){app.innerHTML='<div class="row"><div><h2>＋ Tạo đề Reading</h2><div class="muted">Nhập bài đọc ở bên trái và các câu hỏi trắc nghiệm bên dưới.</div></div><div class="actions"><a class="btn gray" href="./admin.html">← Dashboard</a><a class="btn gray" href="./manage.html">🎧 Quản lý Listening</a></div></div><div class="card"><div class="field"><label>Tên đề Reading *</label><input id="title" placeholder="Ví dụ: Reading Test 01"></div><div class="field"><label>Mô tả</label><textarea id="desc" placeholder="Mô tả ngắn về đề..."></textarea></div><div class="grid"><div class="field"><label>Thời gian làm bài (phút)</label><input id="duration" type="number" min="1" value="30"></div><div class="field"><label>Số lần làm tối đa / sinh viên</label><select id="attempts"><option value="1">1 lần</option><option value="2">2 lần</option><option value="3">3 lần</option><option value="5">5 lần</option><option value="10">10 lần</option><option value="2147483647">♾️ Không giới hạn</option></select></div><div class="field"><label>Mở từ</label><input id="start" type="datetime-local"></div><div class="field"><label>Đóng lúc</label><input id="end" type="datetime-local"></div></div></div><div class="card"><div class="field"><label>📖 Nội dung bài Reading *</label><textarea id="passage" class="passage" placeholder="Dán hoặc nhập toàn bộ bài Reading tại đây..."></textarea></div></div><div class="card"><div class="row"><div><h2>❓ Câu hỏi</h2><div class="muted">Mỗi câu cần ít nhất 2 lựa chọn và đúng 1 đáp án.</div></div><button class="btn green" onclick="addQuestion()">＋ Thêm câu</button></div><div id="questions">${questionTemplate(0)}</div></div><div class="card"><div class="notice">🔐 Đề mới sẽ được gắn tự động với tài khoản giáo viên đang đăng nhập bằng <b>auth.uid()</b>.</div><br><label><input id="published" type="checkbox"> 🟢 Xuất bản ngay sau khi lưu</label><div class="actions" style="margin-top:15px"><button class="btn" onclick="save()">💾 Lưu đề Reading</button><button class="btn gray" onclick="form()">↻ Làm lại</button></div></div><div class="card"><h2>📚 Reading của tôi</h2><div id="myExams">Đang tải...</div></div>'}async function save(){const title=document.getElementById('title').value.trim(),desc=document.getElementById('desc').value,passage=document.getElementById('passage').value.trim(),duration=Math.max(1,Number(document.getElementById('duration').value)||30),max=Math.max(1,Number(document.getElementById('attempts').value)||1),st=document.getElementById('start').value,en=document.getElementById('end').value,questions=collect(),published=document.getElementById('published').checked;if(!title)return alert('Tên đề không được trống.');if(!passage)return alert('Nội dung Reading không được trống.');if(!questions||!questions.length)return alert('⚠️ Cần ít nhất 1 câu hỏi và phải chọn đúng 1 đáp án cho mỗi câu.');if(st&&en&&new Date(en)<=new Date(st))return alert('Thời gian đóng phải sau thời gian mở.');const r=await sb.from('exams').insert({owner_id:user.id,exam_type:'reading',title,description:desc,duration_minutes:duration,max_attempts:max,start_at:st?new Date(st).toISOString():null,end_at:en?new Date(en).toISOString():null,published,reading_passage:passage,questions,answer_key:questions.map(q=>q.answer)}).select().single();if(r.error)return alert('❌ '+r.error.message);alert('✅ Đã tạo đề Reading!');location.href='./reading-manage.html'}async function loadExams(){const r=await sb.from('exams').select('id,title,published,created_at,questions,duration_minutes').eq('owner_id',user.id).eq('exam_type','reading').order('created_at',{ascending:false});if(r.error){document.getElementById('myExams').innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}exams=r.data||[];document.getElementById('myExams').innerHTML=exams.length?exams.map(e=>'<div class="exam"><div class="row"><div><b>'+esc(e.title)+'</b><div class="muted">'+(Array.isArray(e.questions)?e.questions.length:0)+' câu • '+(e.duration_minutes||0)+' phút</div></div><div class="actions"><span class="badge '+(e.published?'':'off')+'">'+(e.published?'Đang mở':'Đã đóng')+'</span><button class="btn gray" onclick="copyLink(\''+e.id+'\')">🔗 Link</button></div></div></div>').join(''):'<div class="muted">Chưa có đề Reading.</div>'}async function copyLink(id){const link=location.origin+location.pathname.replace(/reading-manage\.html$/,'')+'reading.html?exam='+encodeURIComponent(id);try{await navigator.clipboard.writeText(link);alert('✅ Đã copy link sinh viên!\n\n'+link)}catch{prompt('Copy link:',link)}}async function init(){const{data:{session},error}=await sb.auth.getSession();if(error)return app.innerHTML='<div class="card"><div class="notice error">'+esc(error.message)+'</div></div>';if(!session){location.href='./admin.html';return}user=session.user;form();loadExams()}init();</script></body></html>
