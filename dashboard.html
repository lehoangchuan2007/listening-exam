<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Exam Studio - Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#0f172a}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:white}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 24px rgba(15,23,42,.06)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:16px}.stat span{color:#64748b;font-size:14px}.stat b{display:block;font-size:27px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.fill{height:100%;background:#2563eb;border-radius:999px}.muted{color:#64748b;font-size:14px}.search{padding:11px;border:1px solid #cbd5e1;border-radius:10px;width:min(420px,100%)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0}th{background:#f8fafc;color:#475569}@media(max-width:800px){.stats,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.grid{grid-template-columns:1fr}.wrap{padding:16px 12px}}</style></head><body><header class="top"><div class="wrap"><div class="row"><div><h1>📊 Listening Exam Dashboard</h1><div>👨‍🏫 Thống kê giáo viên</div></div><div class="toolbar"><button class="btn gray" onclick="location.href='./admin.html'">← Về Admin</button><button class="btn gray" onclick="load()">↻ Làm mới</button></div></div></div></header><main class="wrap"><div id="app"><div class="card">Đang tải...</div></div></main><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey);let exams=[],subs=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='./admin.html';load()}async function load(){const e=await sb.from('exams').select('*').order('created_at',{ascending:false});if(e.error)return app.innerHTML='<div class="card">❌ '+esc(e.error.message)+'</div>';exams=e.data||[];const s=await sb.from('submissions').select('exam_id,student_name,student_id,score,correct_count,total_questions,submitted_at').order('submitted_at',{ascending:false});if(s.error)return app.innerHTML='<div class="card">❌ '+esc(s.error.message)+'</div>';subs=s.data||[];render()}function render(){const scores=subs.map(x=>Number(x.score)).filter(Number.isFinite),avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0,high=scores.length?Math.max(...scores):0,low=scores.length?Math.min(...scores):0;const students=new Set(subs.map(x=>String(x.student_id||x.student_name||'')).filter(Boolean));const open=exams.filter(x=>x.published).length;const per=exams.map(e=>{const r=subs.filter(x=>String(x.exam_id)===String(e.id)),ss=r.map(x=>Number(x.score)).filter(Number.isFinite),a=ss.length?ss.reduce((p,q)=>p+q,0)/ss.length:0;return{e,r,a,high:ss.length?Math.max(...ss):0}});const top=[...subs].sort((a,b)=>Number(b.score||0)-Number(a.score||0)).slice(0,10);app.innerHTML='<div class="stats"><div class="stat"><span>📝 Tổng số đề</span><b>'+exams.length+'</b></div><div class="stat"><span>👨‍🎓 Sinh viên</span><b>'+students.size+'</b></div><div class="stat"><span>📋 Tổng bài nộp</span><b>'+subs.length+'</b></div><div class="stat"><span>🟢 Đề đang mở</span><b>'+open+'</b></div></div><div class="card"><div class="row"><div><h2>📈 Tổng quan kết quả</h2><span class="muted">Dựa trên tất cả bài đã nộp</span></div></div><div class="stats"><div class="stat"><span>Điểm trung bình</span><b>'+avg.toFixed(2)+'</b></div><div class="stat"><span>Điểm cao nhất</span><b>'+high.toFixed(2)+'</b></div><div class="stat"><span>Điểm thấp nhất</span><b>'+low.toFixed(2)+'</b></div><div class="stat"><span>Tỷ lệ đạt ≥ 5</span><b>'+(scores.length?(scores.filter(x=>x>=5).length/scores.length*100).toFixed(1):'0')+'%</b></div></div></div><div class="grid"><div class="card"><h2>📝 Thống kê từng đề</h2><input id="q" class="search" placeholder="🔎 Tìm tên đề..."><div id="examStats" style="margin-top:14px"></div></div><div class="card"><h2>🏆 Top kết quả</h2><div style="overflow:auto"><table><tr><th>#</th><th>Sinh viên</th><th>Điểm</th><th>Đúng</th></tr>'+top.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.student_name||x.student_id)+'</td><td><b>'+esc(x.score)+'</b></td><td>'+esc(x.correct_count)+'/'+esc(x.total_questions)+'</td></tr>').join('')+'</table></div></div></div>';document.getElementById('q').oninput=x=>drawExamStats(x.target.value);drawExamStats('')}function drawExamStats(filter){const list=document.getElementById('examStats'),q=filter.trim().toLowerCase();const per=exams.map(e=>{const r=subs.filter(x=>String(x.exam_id)===String(e.id)),ss=r.map(x=>Number(x.score)).filter(Number.isFinite),a=ss.length?ss.reduce((p,v)=>p+v,0)/ss.length:0;return{e,r,a}}).filter(x=>String(x.e.title||'').toLowerCase().includes(q));list.innerHTML=per.length?per.map(x=>{const pct=Math.max(0,Math.min(100,x.a*10));return '<div style="padding:13px 0;border-bottom:1px solid #e2e8f0"><div class="row"><div><b>'+esc(x.e.title)+'</b><div class="muted">'+x.r.length+' bài • '+(x.e.published?'🟢 Đang mở':'🔒 Đã đóng')+'</div></div><b>'+x.a.toFixed(2)+'/10</b></div><div class="bar" style="margin-top:9px"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join(''):'<p class="muted">Không có đề phù hợp.</p>'}init();</script></body></html>
