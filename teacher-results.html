<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả sinh viên</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#0f172a;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:14px 0}.btn{border:0;border-radius:8px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.danger{background:#dc2626}.muted{color:#64748b}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f8fafc}.answer{padding:10px;margin:8px 0;border-radius:8px;background:#f8fafc}.ok{border-left:4px solid #16a34a}.bad{border-left:4px solid #dc2626}.detail{line-height:1.6}</style></head><body><main class="wrap"><div class="card"><h1>📊 Kết quả sinh viên</h1><div id="info" class="muted">Đang tải...</div></div><div class="card"><div style="overflow:auto"><table class="table"><thead id="head"></thead><tbody id="body"><tr><td>Đang tải...</td></tr></tbody></table></div></div><div id="detail"></div></main><script>const c=window.SUPABASE_CONFIG||{},sb=supabase.createClient(c.url,c.anonKey),eid=new URLSearchParams(location.search).get('exam');let exam=null,rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const parse=(v,f)=>{if(v==null)return f;if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return f}};const questions=()=>{const q=parse(exam?.questions,[]);return Array.isArray(q)?q:[]};const answers=r=>{const a=parse(r?.answers??r?.student_answers,{});return a&&typeof a==='object'?a:{}};const at=(a,i)=>{if(Array.isArray(a))return a[i];for(const k of [String(i),String(i+1),'q'+i,'q'+(i+1),'question'+i,'question'+(i+1)])if(k in a)return a[k];return null};const norm=v=>{if(v===null||v===undefined||v==='')return null;if(typeof v==='object')v=v.value??v.answer??v.index??v.option??v.selected;const s=String(v).trim().toUpperCase();if(/^[A-D]$/.test(s))return s.charCodeAt(0)-65;if(/^\d+$/.test(s))return Number(s);return null};const key=()=>{const q=questions(),raw=parse(exam?.answer_key,[]);let k=Array.isArray(raw)?raw:Object.entries(raw||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(x=>x[1]);return q.map((x,i)=>k[i]??x?.answer??x?.correct_answer??x?.correctAnswer)};function show(i){const r=rows[i];if(!r)return;const q=questions(),a=answers(r),k=key();let h='<div class="card detail"><h2>👁 Xem bài làm — '+esc(r.student_name||r.full_name||r.name||'Sinh viên')+'</h2><button class="btn" onclick="document.getElementById(\'detail\').innerHTML=\'\'">Đóng</button>';q.forEach((x,j)=>{const av=norm(at(a,j)),kv=norm(k[j]),ok=av!==null&&kv!==null&&av===kv;h+='<div class="answer '+(ok?'ok':'bad')+'"><b>Câu '+(j+1)+' — '+(ok?'Đúng':'Sai')+'</b><div>'+esc(x?.question||x?.text||'')+'</div><div>Đáp án sinh viên: <b>'+esc(av===null?'Chưa chọn':String.fromCharCode(65+av))+'</b></div><div>Đáp án đúng: <b>'+esc(kv===null?'—':String.fromCharCode(65+kv))+'</b></div></div>'});document.getElementById('detail').innerHTML=h+'</div>';document.getElementById('detail').scrollIntoView({behavior:'smooth'})}async function init(){if(!eid){document.getElementById('info').textContent='Thiếu mã đề';return}const {data,error}=await sb.rpc('get_teacher_exam_results',{p_exam_id:eid});if(error){document.getElementById('info').textContent='Lỗi: '+error.message;return}exam=data?.exam;rows=Array.isArray(data?.rows)?data.rows:[];if(!exam){document.getElementById('info').textContent='Không tìm thấy đề';return}const type=String(exam.exam_type||'').toLowerCase();document.getElementById('info').textContent=(type==='reading'?'📖 Reading':type==='writing'?'✍️ Writing':'🎧 Listening')+' • '+(exam.title||'');if(type==='writing'){document.getElementById('head').innerHTML='<tr><th>#</th><th>Sinh viên</th><th>Điểm</th><th>Thời gian</th><th>Thao tác</th></tr>';document.getElementById('body').innerHTML=rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||'—')+'</td><td><b>'+esc(r.total_score??r.score??0)+'/10</b></td><td>'+esc(r.created_at?new Date(r.created_at).toLocaleString('vi-VN'):'—')+'</td><td><button class="btn" onclick="show('+i+')">👁 Xem bài làm</button></td></tr>').join('')}else{document.getElementById('head').innerHTML='<tr><th>#</th><th>Sinh viên</th><th>MSSV</th><th>Điểm</th><th>Thời gian</th><th>Thao tác</th></tr>';document.getElementById('body').innerHTML=rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.student_name||r.full_name||r.name||'—')+'</td><td>'+esc(r.student_id||r.mssv||'—')+'</td><td><b>'+esc(Number(r.total_score??r.score??0).toFixed(2))+'</b></td><td>'+esc(r.created_at?new Date(r.created_at).toLocaleString('vi-VN'):'—')+'</td><td><button class="btn" onclick="show('+i+')">👁 Xem bài làm</button></td></tr>').join('')}}init();</script></body></html>
