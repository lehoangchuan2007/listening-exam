<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý đề - Listening Exam Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 5px 20px rgba(15,23,42,.05)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-weight:700;margin:7px 0}.field input,.field textarea,.search{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.field textarea{min-height:75px;resize:vertical}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn:hover{opacity:.9}.gray{background:#e8eef7;color:#0f172a}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#f59e0b}.purple{background:#7c3aed}.muted{color:#64748b;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:11px;background:#fff}.exam:hover{border-color:#93c5fd}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.off{background:#f1f5f9;color:#475569}.scheduled{background:#fef3c7;color:#92400e}.closed{background:#fee2e2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px}.stat span{font-size:13px;color:#64748b}.stat b{display:block;font-size:24px;margin-top:4px}.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal{background:#fff;border-radius:16px;padding:20px;width:min(720px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eef2ff;border-radius:8px;padding:7px 10px;cursor:pointer}.notice{padding:11px 13px;border-radius:10px;background:#eff6ff;color:#1e40af;margin:10px 0}.linkbox{word-break:break-all;background:#f8fafc;padding:9px;border-radius:8px;font-size:13px}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.stats{grid-template-columns:1fr}.wrap{padding:16px 12px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>🎧 Quản lý đề thi</h1><div>Chỉnh sửa • Nhân bản • Đóng/mở • Thời gian • Số lần làm</div></div></header>
<main class="wrap"><div id="app">Đang tải...</div></main>
<div id="modal"></div>
<script>
const c=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(c.url,c.anonKey);let exams=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const app=document.getElementById('app'),modal=document.getElementById('modal');
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}load()}
async function load(){const r=await sb.from('exams').select('*').order('created_at',{ascending:false});if(r.error){app.innerHTML='<div class="card">❌ '+esc(r.error.message)+'</div>';return}exams=r.data||[];render()}
function status(e){const now=Date.now();const st=e.start_at?new Date(e.start_at).getTime():null;const en=e.end_at?new Date(e.end_at).getTime():null;if(!e.published)return {text:'⚪ Đã đóng',cls:'off'};if(st&&now<st)return {text:'🕐 Chưa đến giờ',cls:'scheduled'};if(en&&now>en)return {text:'🔴 Hết hạn',cls:'closed'};return {text:'🟢 Đang mở',cls:''}}
function render(){const open=exams.filter(e=>status(e).text==='🟢 Đang mở').length;app.innerHTML=`<div class="row"><div><h2>📚 Danh sách đề</h2><span class="muted">Thay đổi cài đặt trực tiếp cho từng đề.</span></div><div class="actions"><button class="btn gray" onclick="location.href='./admin.html'">← Giáo viên</button><button class="btn" onclick="location.href='./'">＋ Tạo đề</button></div></div><div class="stats"><div class="stat"><span>📝 Tổng đề</span><b>${exams.length}</b></div><div class="stat"><span>🟢 Đang mở</span><b>${open}</b></div><div class="stat"><span>🔒 Đã đóng</span><b>${exams.filter(e=>!e.published).length}</b></div><div class="stat"><span>🕐 Có lịch thi</span><b>${exams.filter(e=>e.start_at||e.end_at).length}</b></div></div>${exams.length?exams.map(card).join(''):'<div class="card">Chưa có đề.</div>'}
`}
function card(e){const s=status(e);const link=location.origin+location.pathname.replace(/manage\.html$/,'')+'#exam='+e.id;const time=(e.start_at?new Date(e.start_at).toLocaleString('vi-VN'):'Ngay lập tức')+' → '+(e.end_at?new Date(e.end_at).toLocaleString('vi-VN'):'Không giới hạn');return `<div class="exam"><div class="row"><div style="min-width:260px;flex:1"><h3 style="margin:0 0 6px">${esc(e.title)}</h3><div class="muted">${e.questions?.length||0} câu • ${e.duration_minutes||0} phút • Tối đa ${e.max_attempts||1} lần</div><div style="margin-top:8px"><span class="badge ${s.cls}">${s.text}</span></div><div class="muted" style="margin-top:7px">🕐 ${esc(time)}</div></div><div class="actions"><button class="btn gray" onclick="edit('${e.id}')">✏️ Sửa</button><button class="btn" onclick="duplicate('${e.id}')">📑 Nhân bản</button><button class="btn orange" onclick="toggle('${e.id}')">${e.published?'🔒 Đóng':'🔓 Mở'}</button><button class="btn purple" onclick="copyLink('${e.id}')">🔗 Link</button><button class="btn red" onclick="removeExam('${e.id}')">🗑️ Xóa</button></div></div></div>`}
function edit(id){const e=exams.find(x=>String(x.id)===String(id));modal.innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>✏️ Sửa cài đặt đề</h2><div class="field"><label>Tên đề</label><input id="et" value="${esc(e.title)}"></div><div class="field"><label>Mô tả</label><textarea id="ed">${esc(e.description||'')}</textarea></div><div class="grid"><div class="field"><label>Thời gian làm bài (phút)</label><input id="emin" type="number" min="1" value="${e.duration_minutes||30}"></div><div class="field"><label>Số lần làm tối đa / sinh viên</label><input id="emax" type="number" min="1" value="${e.max_attempts||1}"></div><div class="field"><label>Mở từ</label><input id="est" type="datetime-local" value="${localInput(e.start_at)}"></div><div class="field"><label>Đóng lúc</label><input id="eet" type="datetime-local" value="${localInput(e.end_at)}"></div></div><div class="notice">💡 Để trống thời gian = không giới hạn. Thay đổi sẽ được lưu trực tiếp vào đề.</div><div class="actions"><button class="btn" onclick="save('${e.id}')">💾 Lưu thay đổi</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>`}
function localInput(v){if(!v)return '';const d=new Date(v),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
async function save(id){const title=document.getElementById('et').value.trim(),description=document.getElementById('ed').value,duration=Math.max(1,Number(document.getElementById('emin').value)||30),max=Math.max(1,Number(document.getElementById('emax').value)||1),st=document.getElementById('est').value,en=document.getElementById('eet').value;if(!title)return alert('Tên đề không được trống.');if(en&&st&&new Date(en)<=new Date(st))return alert('Thời gian đóng phải sau thời gian mở.');const payload={title,description,duration_minutes:duration,max_attempts:max,start_at:st?new Date(st).toISOString():null,end_at:en?new Date(en).toISOString():null};const r=await sb.from('exams').update(payload).eq('id',id);if(r.error)return alert('❌ '+r.error.message);closeModal();await load();alert('✅ Đã lưu cài đặt đề.')}
async function toggle(id){const e=exams.find(x=>String(x.id)===String(id));const next=!e.published;if(next&&e.end_at&&new Date(e.end_at)<=new Date())return alert('Đề đã quá thời gian đóng. Hãy chỉnh lại thời gian trước khi mở.');const r=await sb.from('exams').update({published:next}).eq('id',id);if(r.error)return alert('❌ '+r.error.message);load()}
async function duplicate(id){const e=exams.find(x=>String(x.id)===String(id));const {data:{user}}=await sb.auth.getUser();const payload={owner_id:user.id,title:e.title+' - Bản sao',description:e.description,duration_minutes:e.duration_minutes,audio_url:e.audio_url,audio_name:e.audio_name,questions:e.questions,answer_key:e.answer_key,published:false,start_at:null,end_at:null,max_attempts:e.max_attempts||1};const r=await sb.from('exams').insert(payload).select().single();if(r.error)return alert('❌ '+r.error.message);await load();alert('✅ Đã nhân bản đề. Bản sao đang đóng.')}
async function copyLink(id){const link=location.origin+location.pathname.replace(/manage\.html$/,'')+'#exam='+id;try{await navigator.clipboard.writeText(link);alert('✅ Đã copy link đề!')}catch{prompt('Copy link:',link)}}
async function removeExam(id){if(!confirm('Xóa đề này? Hãy chắc chắn bạn muốn xóa.'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert('❌ '+r.error.message);load()}
function closeModal(){modal.innerHTML=''}
init();
</script>
</body>
</html>
