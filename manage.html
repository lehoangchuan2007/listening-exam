<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đề - Listening Exam Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-weight:700;margin:7px 0}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.field textarea{min-height:75px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.gray{background:#e8eef7;color:#0f172a}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#f59e0b}.purple{background:#7c3aed}.muted{color:#64748b;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:11px;background:#fff}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.off{background:#f1f5f9;color:#475569}.scheduled{background:#fef3c7;color:#92400e}.closed{background:#fee2e2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px}.stat span{font-size:13px;color:#64748b}.stat b{display:block;font-size:24px;margin-top:4px}.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal{background:#fff;border-radius:16px;padding:20px;width:min(900px,100%);max-height:92vh;overflow:auto}.close{float:right;border:0;background:#eef2ff;border-radius:8px;padding:7px 10px;cursor:pointer}.qedit{border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:12px 0;background:#f8fafc}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.optionrow{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:center;margin:7px 0}.optionrow input{width:100%}.small{padding:7px 10px;font-size:13px}.unlimited{color:#166534;font-weight:800}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}.optionrow{grid-template-columns:1fr 95px 38px}}@media(max-width:500px){.grid,.stats{grid-template-columns:1fr}.optionrow{grid-template-columns:1fr}.optionrow button{width:max-content}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Quản lý đề thi</h1><div>Chỉnh sửa nội dung • Nhân bản • Đóng/mở • Thời gian • Số lần làm</div></div></header><main class="wrap"><div id="app">Đang tải...</div></main><div id="modal"></div><script>const c=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(c.url,c.anonKey);const UNLIMITED=2147483647;let exams=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const app=document.getElementById('app'),modal=document.getElementById('modal');function studentLink(id){return location.origin+location.pathname.replace(/manage\.html$/,'')+'student.html#exam='+encodeURIComponent(id)}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}load()}async function load(){const r=await sb.from('exams').select('*').order('created_at',{ascending:false});if(r.error){app.innerHTML='<div class="card">❌ '+esc(r.error.message)+'</div>';return}exams=r.data||[];render()}function status(e){const n=Date.now(),st=e.start_at?new Date(e.start_at).getTime():null,en=e.end_at?new Date(e.end_at).getTime():null;if(!e.published)return{text:'⚪ Đã đóng',cls:'off'};if(st&&n<st)return{text:'🕐 Chưa đến giờ',cls:'scheduled'};if(en&&n>en)return{text:'🔴 Hết hạn',cls:'closed'};return{text:'🟢 Đang mở',cls:''}}function attemptsText(e){return Number(e.max_attempts)>=UNLIMITED?'Không giới hạn':'Tối đa '+(e.max_attempts||1)+' lần'}function render(){const open=exams.filter(e=>status(e).text==='🟢 Đang mở').length;app.innerHTML='<div class="row"><div><h2>📚 Danh sách đề</h2><span class="muted">Quản lý nội dung và cài đặt trực tiếp cho từng đề.</span></div><div class="actions"><a class="btn gray" href="./admin.html">← Quay lại</a><button class="btn" onclick="location.href=\'./\'">＋ Tạo đề</button></div></div><div class="stats"><div class="stat"><span>📝 Tổng đề</span><b>'+exams.length+'</b></div><div class="stat"><span>🟢 Đang mở</span><b>'+open+'</b></div><div class="stat"><span>🔒 Đã đóng</span><b>'+exams.filter(e=>!e.published).length+'</b></div><div class="stat"><span>🕐 Có lịch thi</span><b>'+exams.filter(e=>e.start_at||e.end_at).length+'</b></div></div>'+(exams.length?exams.map(card).join(''):'<div class="card">Chưa có đề.</div>')}function card(e){const s=status(e),time=(e.start_at?new Date(e.start_at).toLocaleString('vi-VN'):'Ngay lập tức')+' → '+(e.end_at?new Date(e.end_at).toLocaleString('vi-VN'):'Không giới hạn');return '<div class="exam"><div class="row"><div style="min-width:260px;flex:1"><h3 style="margin:0 0 6px">'+esc(e.title)+'</h3><div class="muted">'+(e.questions?.length||0)+' câu • '+(e.duration_minutes||0)+' phút • <span class="'+(Number(e.max_attempts)>=UNLIMITED?'unlimited':'')+'">'+attemptsText(e)+'</span></div><div style="margin-top:8px"><span class="badge '+s.cls+'">'+s.text+'</span></div><div class="muted" style="margin-top:7px">🕐 '+esc(time)+'</div></div><div class="actions"><button class="btn gray" onclick="edit(\''+e.id+'\')">✏️ Sửa</button><button class="btn" onclick="duplicate(\''+e.id+'\')">📑 Nhân bản</button><button class="btn orange" onclick="toggle(\''+e.id+'\')">'+(e.published?'🔒 Đóng':'🔓 Mở')+'</button><button class="btn purple" onclick="copyLink(\''+e.id+'\')">🔗 Link học sinh</button><button class="btn red" onclick="removeExam(\''+e.id+'\')">🗑️ Xóa</button></div></div></div>'}function edit(id){const e=exams.find(x=>String(x.id)===String(id));if(!e)return;let qs=Array.isArray(e.questions)?e.questions:[];let answerKey=Array.isArray(e.answer_key)?e.answer_key:[];qs=qs.map((q,i)=>({...q,answer:q.answer??q.correct_answer??answerKey[i]??0}));const unlimited=Number(e.max_attempts)>=UNLIMITED;modal.innerHTML='<div class="modalbg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>✏️ Chỉnh sửa đề</h2><div class="field"><label>Tên đề</label><input id="et" value="'+esc(e.title)+'"></div><div class="field"><label>Mô tả</label><textarea id="ed">'+esc(e.description||'')+'</textarea></div><div class="grid"><div class="field"><label>Thời gian làm bài (phút)</label><input id="emin" type="number" min="1" value="'+(e.duration_minutes||30)+'"></div><div class="field"><label>Số lần làm tối đa / sinh viên</label><select id="emax"><option value="1" '+(!unlimited&&Number(e.max_attempts||1)===1?'selected':'')+'>1 lần</option><option value="2" '+(!unlimited&&Number(e.max_attempts)===2?'selected':'')+'>2 lần</option><option value="3" '+(!unlimited&&Number(e.max_attempts)===3?'selected':'')+'>3 lần</option><option value="5" '+(!unlimited&&Number(e.max_attempts)===5?'selected':'')+'>5 lần</option><option value="10" '+(!unlimited&&Number(e.max_attempts)===10?'selected':'')+'>10 lần</option><option value="'+UNLIMITED+'" '+(unlimited?'selected':'')+'>♾️ Không giới hạn</option></select></div><div class="field"><label>Mở từ</label><input id="est" type="datetime-local" value="'+localInput(e.start_at)+'"></div><div class="field"><label>Đóng lúc</label><input id="eet" type="datetime-local" value="'+localInput(e.end_at)+'"></div></div><div class="notice" style="padding:10px;background:#eff6ff;border-radius:9px">♾️ Chọn <b>Không giới hạn</b> để sinh viên có thể làm lại đề không giới hạn số lần. Thời gian mở/đóng đề vẫn được áp dụng.</div><div class="row"><h3>📝 Nội dung câu hỏi</h3><button class="btn green" onclick="addQuestion()">＋ Thêm câu</button></div><div id="questionsEditor">'+qs.map((q,i)=>questionEditor(q,i)).join('')+'</div><div class="actions" style="margin-top:16px"><button class="btn" onclick="saveFull(\''+e.id+'\')">💾 Lưu toàn bộ đề</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>'}function questionEditor(q,i){const opts=Array.isArray(q.options)?q.options:['','','',''];let correct=q.answer??q.correct_answer;if(correct===undefined)correct=0;if(typeof correct==='string'&&/^[A-Da-d]$/.test(correct))correct=correct.toUpperCase().charCodeAt(0)-65;return '<div class="qedit" data-q="'+i+'"><div class="qhead"><b>Câu '+(i+1)+'</b><button class="btn red small" onclick="this.closest(\'.qedit\').remove();renumber()">🗑️ Xóa câu</button></div><div class="field"><label>Nội dung câu hỏi</label><textarea class="qtext">'+esc(q.text??q.question??'')+'</textarea></div><label><b>Các lựa chọn</b></label>'+opts.map((o,j)=>'<div class="optionrow"><input class="qopt" value="'+esc(o)+'" placeholder="Đáp án '+String.fromCharCode(65+j)+'"><select class="qcorrect"><option value="0" '+(Number(correct)===j?'selected':'')+'>Đáp án đúng</option><option value="1" '+(Number(correct)!==j?'selected':'')+'>Không đúng</option></select><button class="btn red small" onclick="this.parentElement.remove()">×</button></div>').join('')+'<button class="btn gray small" onclick="addOption(this)">＋ Thêm lựa chọn</button></div>'}function addOption(btn){const box=btn.closest('.qedit'),rows=box.querySelectorAll('.optionrow'),j=rows.length;const d=document.createElement('div');d.className='optionrow';d.innerHTML='<input class="qopt" placeholder="Đáp án '+String.fromCharCode(65+j)+'"><select class="qcorrect"><option value="0">Đáp án đúng</option><option value="1" selected>Không đúng</option></select><button class="btn red small" onclick="this.parentElement.remove()">×</button>';box.insertBefore(d,btn)}function addQuestion(){const box=document.getElementById('questionsEditor'),i=box.querySelectorAll('.qedit').length;box.insertAdjacentHTML('beforeend',questionEditor({text:'',options:['','','',''],answer:0},i));renumber()}function renumber(){document.querySelectorAll('#questionsEditor .qedit').forEach((x,i)=>x.querySelector('.qhead b').textContent='Câu '+(i+1))}function collectQuestions(){const out=[];let valid=true;document.querySelectorAll('#questionsEditor .qedit').forEach(box=>{const text=box.querySelector('.qtext').value.trim();const opts=[...box.querySelectorAll('.qopt')].map(x=>x.value.trim());const selects=[...box.querySelectorAll('.qcorrect')];let correct=selects.findIndex(x=>x.value==='0');if(!text||opts.length<2||opts.some(x=>!x)||correct<0)valid=false;out.push({text,options:opts,answer:correct})});return valid?out:null}function localInput(v){if(!v)return '';const d=new Date(v),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}async function saveFull(id){const title=document.getElementById('et').value.trim(),description=document.getElementById('ed').value,duration=Math.max(1,Number(document.getElementById('emin').value)||30),max=Math.max(1,Number(document.getElementById('emax').value)||1),st=document.getElementById('est').value,en=document.getElementById('eet').value,questions=collectQuestions();if(!title)return alert('Tên đề không được trống.');if(!questions)return alert('⚠️ Kiểm tra lại câu hỏi: nội dung, ít nhất 2 lựa chọn và phải chọn đúng 1 đáp án đúng cho mỗi câu.');if(en&&st&&new Date(en)<=new Date(st))return alert('Thời gian đóng phải sau thời gian mở.');const answer_key=questions.map(q=>q.answer);const r=await sb.from('exams').update({title,description,duration_minutes:duration,max_attempts:max,start_at:st?new Date(st).toISOString():null,end_at:en?new Date(en).toISOString():null,questions,answer_key}).eq('id',id);if(r.error)return alert('❌ '+r.error.message);closeModal();await load();alert('✅ Đã lưu toàn bộ nội dung và cài đặt đề.')}async function toggle(id){const e=exams.find(x=>String(x.id)===String(id)),next=!e.published;if(next&&e.end_at&&new Date(e.end_at)<=new Date())return alert('Đề đã quá thời gian đóng.');const r=await sb.from('exams').update({published:next}).eq('id',id);if(r.error)return alert('❌ '+r.error.message);load()}async function duplicate(id){const e=exams.find(x=>String(x.id)===String(id)),{data:{user}}=await sb.auth.getUser();const r=await sb.from('exams').insert({owner_id:user.id,title:e.title+' - Bản sao',description:e.description,duration_minutes:e.duration_minutes,audio_url:e.audio_url,audio_name:e.audio_name,questions:e.questions,answer_key:e.answer_key,published:false,start_at:null,end_at:null,max_attempts:e.max_attempts||1}).select().single();if(r.error)return alert('❌ '+r.error.message);await load();alert('✅ Đã nhân bản đề.')}async function copyLink(id){const link=studentLink(id);try{await navigator.clipboard.writeText(link);alert('✅ Đã copy link học sinh!\n\n'+link)}catch{prompt('Copy link học sinh:',link)}}async function removeExam(id){if(!confirm('Xóa đề này?'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert('❌ '+r.error.message);load()}function closeModal(){modal.innerHTML=''}init();</script></body></html>
