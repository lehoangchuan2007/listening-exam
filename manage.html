<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đề - Listening Exam Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;margin:7px 0}.field input,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.field textarea{min-height:70px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.gray{background:#e8eef7;color:#0f172a}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#f59e0b}.muted{color:#64748b;font-size:14px}.exam{border:1px solid #e2e8f0;border-radius:13px;padding:15px;margin-top:10px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.off{background:#f1f5f9;color:#475569}.actions{display:flex;gap:7px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;border-radius:16px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Quản lý đề thi</h1><div>Chỉnh sửa • Nhân bản • Đóng/mở • Thời gian • Số lần làm</div></div></header><main class="wrap"><div id="app">Đang tải...</div></main><div id="modal"></div><script>const c=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(c.url,c.anonKey);let exams=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}load()}async function load(){const r=await sb.from('exams').select('*').order('created_at',{ascending:false});if(r.error)return app.innerHTML='<div class="card">❌ '+esc(r.error.message)+'</div>';exams=r.data||[];app.innerHTML='<div class="row"><div><h2>📚 Danh sách đề</h2><span class="muted">Thay đổi cài đặt trực tiếp cho từng đề.</span></div><div class="actions"><button class="btn gray" onclick="location.href=\'./admin.html\'">← Giáo viên</button><button class="btn" onclick="location.href=\'./\'">＋ Tạo đề</button></div></div>'+ (exams.length?exams.map(card).join(''):'<div class="card">Chưa có đề.</div>') }function card(e){const open=e.published;const time=(e.start_at?new Date(e.start_at).toLocaleString('vi-VN'):'Ngay lập tức')+' → '+(e.end_at?new Date(e.end_at).toLocaleString('vi-VN'):'Không giới hạn');return '<div class="exam"><div class="row"><div><h3>'+esc(e.title)+'</h3><div class="muted">'+(e.questions?.length||0)+' câu • '+e.duration_minutes+' phút • Tối đa '+(e.max_attempts||1)+' lần</div><div style="margin-top:7px"><span class="badge '+(open?'':'off')+'">'+(open?'🟢 Đang mở':'⚪ Đã đóng')+'</span> <span class="muted">'+esc(time)+'</span></div></div><div class="actions"><button class="btn gray" onclick="edit(\''+e.id+'\')">✏️ Sửa</button><button class="btn" onclick="duplicate(\''+e.id+'\')">📑 Nhân bản</button><button class="btn orange" onclick="toggle(\''+e.id+'\')">'+(open?'🔒 Đóng':'🔓 Mở')+'</button><button class="btn red" onclick="remove(\''+e.id+'\')">Xóa</button></div></div></div>'}
function edit(id){const e=exams.find(x=>x.id===id);modal.innerHTML='<div class="modalbg"><div class="modal"><h2>✏️ Sửa cài đặt đề</h2><div class="field"><label>Tên đề</label><input id="et" value="'+esc(e.title)+'"></div><div class="field"><label>Mô tả</label><textarea id="ed">'+esc(e.description||'')+'</textarea></div><div class="grid"><div class="field"><label>Thời gian làm bài (phút)</label><input id="emin" type="number" min="1" value="'+(e.duration_minutes||30)+'"></div><div class="field"><label>Số lần làm tối đa / sinh viên</label><input id="emax" type="number" min="1" value="'+(e.max_attempts||1)+'"></div><div class="field"><label>Mở từ</label><input id="est" type="datetime-local" value="'+localInput(e.start_at)+'"></div><div class="field"><label>Đóng lúc</label><input id="eet" type="datetime-local" value="'+localInput(e.end_at)+'"></div></div><p class="muted">Để trống thời gian = không giới hạn. Thay đổi này áp dụng ngay cho link đề.</p><div class="actions"><button class="btn" onclick="save(\''+id+'\')">💾 Lưu</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>'}function localInput(v){if(!v)return '';const d=new Date(v),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}async function save(id){const payload={title:et.value.trim(),description:ed.value,duration_minutes:+emin.value,max_attempts:Math.max(1,+emax.value||1),start_at:est.value?new Date(est.value).toISOString():null,end_at:eet.value?new Date(eet.value).toISOString():null};if(!payload.title)return alert('Tên đề không được trống.');if(payload.end_at&&payload.start_at&&new Date(payload.end_at)<=new Date(payload.start_at))return alert('Thời gian đóng phải sau thời gian mở.');const r=await sb.from('exams').update(payload).eq('id',id);if(r.error)return alert(r.error.message);closeModal();load()}async function toggle(id){const e=exams.find(x=>x.id===id);const r=await sb.from('exams').update({published:!e.published}).eq('id',id);if(r.error)return alert(r.error.message);load()}async function duplicate(id){const e=exams.find(x=>x.id===id);const {data:{user}}=await sb.auth.getUser();const payload={owner_id:user.id,title:e.title+' - Bản sao',description:e.description,duration_minutes:e.duration_minutes,audio_url:e.audio_url,audio_name:e.audio_name,questions:e.questions,answer_key:e.answer_key,published:false,start_at:null,end_at:null,max_attempts:e.max_attempts||1};const r=await sb.from('exams').insert(payload).select().single();if(r.error)return alert(r.error.message);alert('✅ Đã nhân bản đề. Bản sao đang đóng.');load()}async function remove(id){if(!confirm('Xóa đề này và toàn bộ kết quả?'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert(r.error.message);load()}function closeModal(){modal.innerHTML=''}init();</script></body></html>
