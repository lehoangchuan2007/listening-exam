<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đề - English Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}.card,.exam{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-weight:700;margin:7px 0}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.field textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.gray{background:#e8eef7;color:#0f172a}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#f59e0b}.purple{background:#7c3aed}.muted{color:#64748b;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.off{background:#f1f5f9;color:#475569}.scheduled{background:#fef3c7;color:#92400e}.closed{background:#fee2e2;color:#991b1b}.type{display:inline-block;margin-left:6px;padding:4px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px}.stat span{font-size:13px;color:#64748b}.stat b{display:block;font-size:24px;margin-top:4px}.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal{background:#fff;border-radius:16px;padding:20px;width:min(900px,100%);max-height:92vh;overflow:auto}.close{float:right;border:0;background:#eef2ff;border-radius:8px;padding:7px 10px;cursor:pointer}.qedit{border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:12px 0;background:#f8fafc}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.optionrow{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:center;margin:7px 0}.optionrow input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.small{padding:7px 10px;font-size:13px}.notice{padding:10px;background:#eff6ff;border-radius:9px;margin:10px 0}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}.optionrow{grid-template-columns:1fr 95px 38px}}@media(max-width:500px){.grid,.stats{grid-template-columns:1fr}.optionrow{grid-template-columns:1fr}.optionrow button{width:max-content}}</style></head><body><header class="top"><div class="wrap"><h1>📚 English Studio</h1><div>👨‍🏫 Quản lý đề Listening • Reading • Writing</div></div></header><main class="wrap"><div id="app">Đang tải...</div></main><div id="modal"></div><script>const c=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(c.url,c.anonKey),UNLIMITED=2147483647,app=document.getElementById('app'),modal=document.getElementById('modal');let exams=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const parse=v=>{if(typeof v!=='string')return v??[];try{return JSON.parse(v)}catch{return[]}};const qs=e=>Array.isArray(e?.questions)?e.questions:parse(e?.questions);function studentLink(id){return location.origin+location.pathname.replace(/manage\.html$/,'')+'student.html#exam='+encodeURIComponent(id)}function typeName(t){return({listening:'🎧 Listening',reading:'📖 Reading',writing:'✍️ Writing',mixed:'🧩 Kết hợp'})[t]||'🎧 Listening'}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./admin.html';return}load()}async function load(){const r=await sb.from('exams').select('*').order('created_at',{ascending:false});if(r.error){app.innerHTML='<div class="card">❌ '+esc(r.error.message)+'</div>';return}exams=r.data||[];render()}function status(e){const n=Date.now(),st=e.start_at?new Date(e.start_at).getTime():null,en=e.end_at?new Date(e.end_at).getTime():null;if(!e.published)return{text:'⚪ Đã đóng',cls:'off'};if(st&&n<st)return{text:'🕐 Chưa đến giờ',cls:'scheduled'};if(en&&n>en)return{text:'🔴 Hết hạn',cls:'closed'};return{text:'🟢 Đang mở',cls:''}}function render(){const open=exams.filter(e=>status(e).text==='🟢 Đang mở').length;app.innerHTML='<div class="row"><div><h2>📚 Danh sách đề</h2><span class="muted">Mỗi đề có thể là Listening, Reading hoặc Writing.</span></div><div class="actions"><a class="btn gray" href="./admin.html">← Dashboard</a><button class="btn" onclick="createExam()">＋ Tạo đề</button></div></div><div class="stats"><div class="stat"><span>📝 Tổng đề</span><b>'+exams.length+'</b></div><div class="stat"><span>🟢 Đang mở</span><b>'+open+'</b></div><div class="stat"><span>🎧 Listening</span><b>'+exams.filter(e=>e.exam_type==='listening').length+'</b></div><div class="stat"><span>📖 Reading</span><b>'+exams.filter(e=>e.exam_type==='reading').length+'</b></div></div>'+(exams.length?exams.map(card).join(''):'<div class="card">Chưa có đề.</div>')}function card(e){const s=status(e),time=(e.start_at?new Date(e.start_at).toLocaleString('vi-VN'):'Ngay lập tức')+' → '+(e.end_at?new Date(e.end_at).toLocaleString('vi-VN'):'Không giới hạn');return '<div class="exam"><div class="row"><div style="min-width:260px;flex:1"><h3 style="margin:0 0 6px">'+esc(e.title||'Không tên')+' <span class="type">'+typeName(e.exam_type)+'</span></h3><div class="muted">'+qs(e).length+' câu • '+(e.duration_minutes||0)+' phút</div><div style="margin-top:8px"><span class="badge '+s.cls+'">'+s.text+'</span></div><div class="muted" style="margin-top:7px">🕐 '+esc(time)+'</div></div><div class="actions"><button class="btn gray" onclick="edit(\''+e.id+'\')">✏️ Sửa</button><button class="btn" onclick="duplicate(\''+e.id+'\')">📑 Nhân bản</button><button class="btn orange" onclick="toggle(\''+e.id+'\')">'+(e.published?'🔒 Đóng':'🔓 Mở')+'</button><button class="btn purple" onclick="copyLink(\''+e.id+'\')">🔗 Link học sinh</button><a class="btn gray" href="./results.html?exam=${encodeURIComponent(e.id)}">📊 Kết quả</a><button class="btn red" onclick="removeExam(\''+e.id+'\')">🗑️ Xóa</button></div></div></div>'}function createExam(){modal.innerHTML='<div class="modalbg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>＋ Tạo đề mới</h2><div class="field"><label>Loại đề</label><select id="ct"><option value="listening">🎧 Listening</option><option value="reading">📖 Reading</option><option value="writing">✍️ Writing (sắp có AI)</option></select></div><div class="field"><label>Tên đề</label><input id="ctitle" placeholder="Ví dụ: Reading Test 01"></div><div class="field"><label>Mô tả</label><textarea id="cdesc" placeholder="Mô tả ngắn về đề..."></textarea></div><div class="field" id="readingField" style="display:none"><label>📖 Nội dung bài Reading</label><textarea id="creading" style="min-height:220px" placeholder="Dán nội dung bài Reading vào đây..."></textarea></div><div class="field" id="audioField" style="display:block"><label>🎧 Audio URL</label><input id="caudio" placeholder="https://.../audio.mp3"></div><div class="grid"><div class="field"><label>Thời gian (phút)</label><input id="cmin" type="number" min="1" value="30"></div><div class="field"><label>Số lần làm tối đa</label><select id="cmax"><option value="1">1 lần</option><option value="2">2 lần</option><option value="3">3 lần</option><option value="5">5 lần</option><option value="10">10 lần</option><option value="2147483647">♾️ Không giới hạn</option></select></div></div><div id="writingNotice" class="notice" style="display:none">✍️ Writing sẽ được hoàn thiện ở bước AI chấm tự động.</div><div class="row"><h3>📝 Câu hỏi</h3><button class="btn green" onclick="addQuestion()">＋ Thêm câu</button></div><div id="questionsEditor"></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="saveNew()">💾 Tạo đề</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>';document.getElementById('ct').onchange=updateCreateType;updateCreateType();addQuestion()}function updateCreateType(){const t=document.getElementById('ct').value;document.getElementById('readingField').style.display=t==='reading'?'block':'none';document.getElementById('audioField').style.display=t==='listening'?'block':'none';document.getElementById('writingNotice').style.display=t==='writing'?'block':'none'}function questionEditor(q,i){const opts=Array.isArray(q.options)?q.options:['','','',''];return '<div class="qedit"><div class="qhead"><b>Câu '+(i+1)+'</b><button class="btn red small" onclick="this.closest(\'.qedit\').remove();renumber()">🗑️ Xóa câu</button></div><div class="field"><label>Nội dung câu hỏi</label><textarea class="qtext">'+esc(q.text||'')+'</textarea></div><label><b>Các lựa chọn</b></label>'+opts.map((o,j)=>'<div class="optionrow"><input class="qopt" value="'+esc(o)+'" placeholder="Đáp án '+String.fromCharCode(65+j)+'"><select class="qcorrect"><option value="0" '+(Number(q.answer||0)===j?'selected':'')+'>Đáp án đúng</option><option value="1" '+(Number(q.answer||0)!==j?'selected':'')+'>Không đúng</option></select><button class="btn red small" onclick="this.parentElement.remove()">×</button></div>').join('')+'<button class="btn gray small" onclick="addOption(this)">＋ Thêm lựa chọn</button></div>'}function addQuestion(){const box=document.getElementById('questionsEditor');if(!box)return;box.insertAdjacentHTML('beforeend',questionEditor({text:'',options:['','','',''],answer:0},box.querySelectorAll('.qedit').length));renumber()}function addOption(btn){const box=btn.closest('.qedit'),n=box.querySelectorAll('.optionrow').length,d=document.createElement('div');d.className='optionrow';d.innerHTML='<input class="qopt" placeholder="Đáp án '+String.fromCharCode(65+n)+'"><select class="qcorrect"><option value="0">Đáp án đúng</option><option value="1" selected>Không đúng</option></select><button class="btn red small" onclick="this.parentElement.remove()">×</button>';box.insertBefore(d,btn)}function renumber(){document.querySelectorAll('#questionsEditor .qedit').forEach((x,i)=>x.querySelector('.qhead b').textContent='Câu '+(i+1))}function collectQuestions(){const out=[];let valid=true;document.querySelectorAll('#questionsEditor .qedit').forEach(box=>{const text=box.querySelector('.qtext').value.trim(),opts=[...box.querySelectorAll('.qopt')].map(x=>x.value.trim()),ss=[...box.querySelectorAll('.qcorrect')],answer=ss.findIndex(x=>x.value==='0');if(!text||opts.length<2||opts.some(x=>!x)||answer<0)valid=false;out.push({text,options:opts,answer})});return valid?out:null}async function saveNew(){const{data:{user}}=await sb.auth.getUser(),exam_type=document.getElementById('ct').value,title=document.getElementById('ctitle').value.trim(),description=document.getElementById('cdesc').value,questions=collectQuestions();if(!user)return alert('❌ Phiên đăng nhập đã hết.');if(!title)return alert('Tên đề không được trống.');if(exam_type==='writing')return alert('✍️ Writing sẽ được bật ở bước AI chấm tự động.');if(!questions)return alert('⚠️ Kiểm tra lại câu hỏi.');const payload={owner_id:user.id,exam_type,title,description,duration_minutes:Math.max(1,Number(document.getElementById('cmin').value)||30),max_attempts:Number(document.getElementById('cmax').value)||1,questions,answer_key:questions.map(q=>q.answer),published:false};if(exam_type==='reading')payload.reading_text=document.getElementById('creading').value;else payload.audio_url=document.getElementById('caudio').value.trim();const r=await sb.from('exams').insert(payload);if(r.error)return alert('❌ '+r.error.message);closeModal();await load();alert('✅ Đã tạo đề '+typeName(exam_type)+'.')}function edit(id){const e=exams.find(x=>String(x.id)===String(id));if(!e)return;let questions=qs(e).map((q,i)=>({...q,answer:q.answer??q.correct_answer??parse(e.answer_key)[i]??0}));modal.innerHTML='<div class="modalbg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>✏️ Chỉnh sửa đề</h2><div class="field"><label>Loại đề</label><select id="et"><option value="listening" '+(e.exam_type==='listening'?'selected':'')+'>🎧 Listening</option><option value="reading" '+(e.exam_type==='reading'?'selected':'')+'>📖 Reading</option><option value="writing" '+(e.exam_type==='writing'?'selected':'')+'>✍️ Writing</option></select></div><div class="field"><label>Tên đề</label><input id="ett" value="'+esc(e.title)+'"></div><div class="field"><label>Mô tả</label><textarea id="ed">'+esc(e.description||'')+'</textarea></div><div class="field" id="editReading"><label>📖 Nội dung Reading</label><textarea id="ert" style="min-height:220px">'+esc(e.reading_text||'')+'</textarea></div><div class="field" id="editAudio"><label>🎧 Audio URL</label><input id="eau" value="'+esc(e.audio_url||'')+'"></div><div class="grid"><div class="field"><label>Thời gian (phút)</label><input id="emin" type="number" min="1" value="'+(e.duration_minutes||30)+'"></div><div class="field"><label>Số lần làm tối đa</label><select id="emax"><option value="1">1 lần</option><option value="2">2 lần</option><option value="3">3 lần</option><option value="5">5 lần</option><option value="10">10 lần</option><option value="2147483647">♾️ Không giới hạn</option></select></div></div><div class="row"><h3>📝 Câu hỏi</h3><button class="btn green" onclick="addQuestion()">＋ Thêm câu</button></div><div id="questionsEditor">'+questions.map(questionEditor).join('')+'</div><div class="actions"><button class="btn" onclick="saveFull(\''+e.id+'\')">💾 Lưu</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>';document.getElementById('et').onchange=updateEditType;document.getElementById('emax').value=String(e.max_attempts||1);updateEditType()}function updateEditType(){const t=document.getElementById('et').value;document.getElementById('editReading').style.display=t==='reading'?'block':'none';document.getElementById('editAudio').style.display=t==='listening'?'block':'none'}async function saveFull(id){const e=exams.find(x=>String(x.id)===String(id)),questions=collectQuestions(),type=document.getElementById('et').value;if(!questions)return alert('⚠️ Kiểm tra lại câu hỏi.');const payload={exam_type:type,title:document.getElementById('ett').value.trim(),description:document.getElementById('ed').value,duration_minutes:Math.max(1,Number(document.getElementById('emin').value)||30),max_attempts:Number(document.getElementById('emax').value)||1,questions,answer_key:questions.map(q=>q.answer)};if(type==='reading')payload.reading_text=document.getElementById('ert').value;else if(type==='listening')payload.audio_url=document.getElementById('eau').value.trim();const r=await sb.from('exams').update(payload).eq('id',id);if(r.error)return alert('❌ '+r.error.message);closeModal();await load();alert('✅ Đã lưu đề.')}async function toggle(id){const e=exams.find(x=>String(x.id)===String(id)),r=await sb.from('exams').update({published:!e.published}).eq('id',id);if(r.error)return alert('❌ '+r.error.message);load()}async function duplicate(id){const e=exams.find(x=>String(x.id)===String(id)),{data:{user}}=await sb.auth.getUser();const r=await sb.from('exams').insert({owner_id:user.id,exam_type:e.exam_type||'listening',title:e.title+' - Bản sao',description:e.description,duration_minutes:e.duration_minutes,audio_url:e.audio_url,reading_text:e.reading_text,questions:e.questions,answer_key:e.answer_key,published:false,start_at:null,end_at:null,max_attempts:e.max_attempts||1});if(r.error)return alert('❌ '+r.error.message);await load();alert('✅ Đã nhân bản đề.')}async function copyLink(id){const link=studentLink(id);try{await navigator.clipboard.writeText(link);alert('✅ Đã copy link học sinh!\n\n'+link)}catch{prompt('Copy link học sinh:',link)}}async function removeExam(id){if(!confirm('Xóa đề này?'))return;const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert('❌ '+r.error.message);load()}function closeModal(){modal.innerHTML=''}init();</script></body></html>
