<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý đề - English Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:1150px;margin:auto;padding:22px 18px}
    .top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff}
    .card,.exam{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 5px 20px #0f172a0a}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{margin:9px 0}.field label{display:block;font-weight:700;margin:7px 0}
    .field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}
    .field textarea{min-height:90px;resize:vertical}
    .btn{border:0;border-radius:9px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .gray{background:#e8eef7;color:#0f172a}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#f59e0b}.purple{background:#7c3aed}
    .muted{color:#64748b;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}
    .badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}
    .off{background:#f1f5f9;color:#475569}.scheduled{background:#fef3c7;color:#92400e}.closed{background:#fee2e2;color:#991b1b}
    .type{display:inline-block;margin-left:6px;padding:4px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}
    .stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px}.stat span{font-size:13px;color:#64748b}.stat b{display:block;font-size:24px;margin-top:4px}
    .modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}
    .modal{background:#fff;border-radius:16px;padding:20px;width:min(900px,100%);max-height:92vh;overflow:auto}
    .close{float:right;border:0;background:#eef2ff;border-radius:8px;padding:7px 10px;cursor:pointer}
    .q{border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:12px 0;background:#f8fafc}
    .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
    .optionrow{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;margin:7px 0}
    .optionrow input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
    .small{padding:7px 10px;font-size:13px}
    .notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;margin:10px 0}
    .notice.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
    .upload{border:2px dashed #93c5fd;border-radius:13px;padding:18px;background:#f8fbff}
    .upload input{margin-top:8px}.file-name{margin-top:8px;font-weight:700}.audio-preview{width:100%;margin-top:12px}.hidden{display:none!important}
    @media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}.optionrow{grid-template-columns:1fr 38px}}
    @media(max-width:500px){.grid,.stats{grid-template-columns:1fr}.optionrow{grid-template-columns:1fr}.optionrow button{width:max-content}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><h1>📚 English Studio</h1><div>👨‍🏫 Quản lý đề Listening • Reading • Writing</div></div></header>
  <main class="wrap"><div id="app">Đang tải...</div></main>
  <div id="modal"></div>
  <script src="red-word-import.js?v=7"></script>
  <script>
    const cfg=window.SUPABASE_CONFIG||{};
    const sb=supabase.createClient(cfg.url,cfg.anonKey);
    const UNLIMITED=2147483647;
    const AUDIO_BUCKET="exam-audio";
    const app=document.getElementById("app");
    const modal=document.getElementById("modal");
    let exams=[];
    let editingExamId=null;
    let localAudioUrl="";
    const esc=value=>String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
    const parse=value=>{if(typeof value!=="string")return value??[];try{return JSON.parse(value)}catch{return[]}};
    const qs=exam=>Array.isArray(exam?.questions)?exam.questions:parse(exam?.questions);
    function studentLink(id){return location.origin+location.pathname.replace(/manage\.html$/,'')+"student.html#exam="+encodeURIComponent(id)}
    function typeName(type){return({listening:"🎧 Listening",reading:"📖 Reading",writing:"✍️ Writing",mixed:"🧩 Kết hợp"})[type]||"🎧 Listening"}
    async function init(){const {data,error}=await sb.auth.getSession();if(error){showError(error.message);return}if(!data?.session){location.href="./admin.html";return}await load()}
    function showError(message){app.innerHTML=`<div class="card"><h2>⚠️ Không tải được</h2><div class="notice warn">${esc(message)}</div></div>`}
    async function load(){const result=await sb.from("exams").select("*").order("created_at",{ascending:false});if(result.error){showError(result.error.message);return}exams=result.data||[];render()}
    function status(exam){const now=Date.now(),start=exam.start_at?new Date(exam.start_at).getTime():null,end=exam.end_at?new Date(exam.end_at).getTime():null;if(!exam.published)return{text:"⚪ Đã đóng",cls:"off"};if(start&&now<start)return{text:"🕐 Chưa đến giờ",cls:"scheduled"};if(end&&now>end)return{text:"🔴 Hết hạn",cls:"closed"};return{text:"🟢 Đang mở",cls:""}}
    function render(){const open=exams.filter(e=>status(e).text==="🟢 Đang mở").length;app.innerHTML=`<div class="row"><div><h2>📚 Danh sách đề</h2><span class="muted">Listening giữ đầy đủ Word + Audio; Reading dùng nội dung bài đọc riêng.</span></div><div class="actions"><a class="btn gray" href="./admin.html">← Dashboard</a><button class="btn" onclick="createExam()">＋ Tạo đề</button></div></div><div class="stats"><div class="stat"><span>📝 Tổng đề</span><b>${exams.length}</b></div><div class="stat"><span>🟢 Đang mở</span><b>${open}</b></div><div class="stat"><span>🎧 Listening</span><b>${exams.filter(e=>e.exam_type==="listening").length}</b></div><div class="stat"><span>📖 Reading</span><b>${exams.filter(e=>e.exam_type==="reading").length}</b></div></div>${exams.length?exams.map(card).join(""):"<div class='card'>Chưa có đề.</div>"}`}
    function card(exam){const s=status(exam),time=(exam.start_at?new Date(exam.start_at).toLocaleString("vi-VN"):"Ngay lập tức")+" → "+(exam.end_at?new Date(exam.end_at).toLocaleString("vi-VN"):"Không giới hạn");return `<div class="exam"><div class="row"><div style="min-width:260px;flex:1"><h3 style="margin:0 0 6px">${esc(exam.title||"Không tên")} <span class="type">${typeName(exam.exam_type)}</span></h3><div class="muted">${qs(exam).length} câu • ${exam.duration_minutes||0} phút</div><div style="margin-top:8px"><span class="badge ${s.cls}">${s.text}</span></div><div class="muted" style="margin-top:7px">🕐 ${esc(time)}</div></div><div class="actions"><button class="btn gray" onclick="edit('${exam.id}')">✏️ Sửa</button><button class="btn" onclick="duplicate('${exam.id}')">📑 Nhân bản</button><button class="btn orange" onclick="toggle('${exam.id}')">${exam.published?"🔒 Đóng":"🔓 Mở"}</button><button class="btn purple" onclick="copyLink('${exam.id}')">🔗 Link học sinh</button><a class="btn gray" href="./results.html?exam=${encodeURIComponent(exam.id)}">📊 Kết quả</a><button class="btn red" onclick="removeExam('${exam.id}')">🗑️ Xóa</button></div></div></div>`}
    function createExam(existing=null){editingExamId=existing?.id||null;localAudioUrl="";const type=existing?.exam_type||"listening",questions=qs(existing||{}),key=parse(existing?.answer_key);modal.innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>${existing?"✏️ Chỉnh sửa đề":"＋ Tạo đề mới"}</h2><div class="field"><label>Loại đề</label><select id="ct"><option value="listening" ${type==="listening"?"selected":""}>🎧 Listening</option><option value="reading" ${type==="reading"?"selected":""}>📖 Reading</option><option value="writing" ${type==="writing"?"selected":""}>✍️ Writing</option></select></div><div class="field"><label>Tên đề</label><input id="ctitle" value="${esc(existing?.title||"")}" placeholder="Ví dụ: Listening Test 01"></div><div class="field"><label>Mô tả</label><textarea id="cdesc" placeholder="Mô tả ngắn về đề...">${esc(existing?.description||"")}</textarea></div><div id="listeningTools"><div class="card" style="margin:12px 0;padding:15px"><h3 style="margin-top:0">📄 Import Word</h3><p class="muted">Mẫu Word: Câu 1... → A... → B... → C... → D...; đáp án đúng có thể tô <b>màu đỏ</b>.</p><div class="upload"><label class="btn gray" for="word">📄 Chọn file Word (.docx)</label><input id="word" class="hidden" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div id="wordStatus" class="file-name">Chưa chọn file</div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="importWord()">📥 Đọc Word</button><button class="btn gray" onclick="clearQuestions()">🧹 Xóa câu hỏi</button></div></div><div class="card" style="margin:12px 0;padding:15px"><h3 style="margin-top:0">🎵 Audio</h3><div class="upload"><label class="btn green" for="audioFile">🎵 Tải file audio</label><input id="audioFile" class="hidden" type="file" accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/mp4"><div id="audioStatus" class="file-name">${existing?.audio_url?"🎵 Audio đã có sẵn":"Chưa chọn file"}</div><audio id="audioPreview" class="audio-preview hidden" controls></audio><div class="notice">Chọn file MP3/WAV/M4A từ máy. File sẽ được upload lên Supabase Storage khi bạn bấm <b>Tạo đề/Lưu thay đổi</b>, sau đó học sinh có thể nghe trực tiếp.</div></div></div></div><div id="readingField"><div class="field"><label>📖 Nội dung bài Reading</label><textarea id="creading" style="min-height:260px" placeholder="Dán nội dung bài Reading vào đây...">${esc(existing?.reading_text||"")}</textarea></div></div><div id="writingNotice" class="notice" style="display:none">✍️ Writing sẽ được hoàn thiện ở bước AI chấm tự động.</div><div class="grid"><div class="field"><label>Thời gian (phút)</label><input id="cmin" type="number" min="1" value="${Number(existing?.duration_minutes)||30}"></div><div class="field"><label>Số lần làm tối đa</label><select id="cmax">${[[1,"1 lần"],[2,"2 lần"],[3,"3 lần"],[5,"5 lần"],[10,"10 lần"],[UNLIMITED,"♾️ Không giới hạn"]].map(([v,label])=>`<option value="${v}" ${Number(existing?.max_attempts||1)===v?"selected":""}>${label}</option>`).join("")}</select></div></div><div class="row"><h3>📝 Câu hỏi</h3><button class="btn green" onclick="addQ()">＋ Thêm câu</button></div><div id="qs"></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="saveExam()">💾 ${existing?"Lưu thay đổi":"Tạo đề"}</button><button class="btn gray" onclick="closeModal()">Hủy</button></div></div></div>`;document.getElementById("ct").onchange=updateCreateType;const audioInput=document.getElementById("audioFile");if(audioInput){audioInput.addEventListener("change",previewAudio);audioInput.addEventListener("input",previewAudio)}updateCreateType();if(questions.length){questions.forEach((q,i)=>addQ({text:q.text||"",options:Array.isArray(q.options)?q.options:["","","",""],answer:q.answer??q.correct_answer??key[i]??0}))}else addQ()}
    function updateCreateType(){const type=document.getElementById("ct")?.value,listening=document.getElementById("listeningTools"),reading=document.getElementById("readingField"),writing=document.getElementById("writingNotice");if(!listening||!reading||!writing)return;listening.style.display=type==="listening"?"block":"none";reading.style.display=type==="reading"?"block":"none";writing.style.display=type==="writing"?"block":"none"}
    function questionHtml(q={},index=0){const options=Array.isArray(q.options)?q.options:["","","",""];const answer=Number(q.answer??0);return `<div class="q"><div class="qhead"><b>Câu ${index+1}</b><button class="btn red small" onclick="removeQ(${index})">🗑️ Xóa câu</button></div><div class="field"><label>Nội dung câu hỏi</label><textarea class="qt" placeholder="Nhập nội dung câu hỏi...">${esc(q.text||"")}</textarea></div><label><b>Các lựa chọn</b></label>${options.map((option,j)=>`<div class="optionrow"><input class="qo" value="${esc(option)}" placeholder="Đáp án ${String.fromCharCode(65+j)}"><button class="btn red small" onclick="this.parentElement.remove();syncQ()">×</button></div>`).join("")}<div class="field"><label>Đáp án đúng</label><select class="qa">${options.map((_,j)=>`<option value="${j}" ${answer===j?"selected":""}>${String.fromCharCode(65+j)}</option>`).join("")}</select></div><button class="btn gray small" onclick="addOption(this)">＋ Thêm lựa chọn</button></div>`}
    function addQ(data={}){const box=document.getElementById("qs");if(!box)return;const index=box.querySelectorAll(".q").length;box.insertAdjacentHTML("beforeend",questionHtml(data,index));syncQ()}
    function removeQ(index){const box=document.getElementById("qs");if(!box)return;const items=box.querySelectorAll(".q");if(items.length<=1){items[0].querySelector(".qt").value="";items[0].querySelectorAll(".qo").forEach(x=>x.value="");items[0].querySelector(".qa").value="0";return}items[index]?.remove();syncQ()}
    function addOption(button){const q=button.closest(".q");if(!q)return;const n=q.querySelectorAll(".optionrow").length,row=document.createElement("div");row.className="optionrow";row.innerHTML=`<input class="qo" placeholder="Đáp án ${String.fromCharCode(65+n)}"><button class="btn red small" onclick="this.parentElement.remove();syncQ()">×</button>`;q.insertBefore(row,button);q.querySelector(".qa").insertAdjacentHTML("beforeend",`<option value="${n}">${String.fromCharCode(65+n)}</option>`);syncQ()}
    function syncQ(){document.querySelectorAll("#qs .q").forEach((q,i)=>{const title=q.querySelector(".qhead b");if(title)title.textContent="Câu "+(i+1);q.querySelectorAll(".optionrow").forEach((row,j)=>{const input=row.querySelector(".qo");if(input)input.placeholder="Đáp án "+String.fromCharCode(65+j)})})}
    function clearQuestions(){const box=document.getElementById("qs");if(!box)return;box.innerHTML="";addQ();const status=document.getElementById("wordStatus");if(status)status.textContent="Đã xóa câu hỏi."}
    function collectQuestions(){const out=[];let valid=true;document.querySelectorAll("#qs .q").forEach(q=>{const text=q.querySelector(".qt")?.value.trim()||"",opts=[...q.querySelectorAll(".qo")].map(x=>x.value.trim()).filter(Boolean),answer=Number(q.querySelector(".qa")?.value??0);if(!text||opts.length<2||answer<0||answer>=opts.length)valid=false;out.push({text,options:opts,answer})});return valid&&out.length?out:null}
    function previewAudio(){const input=document.getElementById("audioFile"),status=document.getElementById("audioStatus"),audio=document.getElementById("audioPreview");if(!input||!status)return;const file=input.files?.[0];if(!file){status.textContent="Chưa chọn file";audio?.classList.add("hidden");return}if(localAudioUrl)URL.revokeObjectURL(localAudioUrl);localAudioUrl=URL.createObjectURL(file);if(audio){audio.src=localAudioUrl;audio.classList.remove("hidden")}status.innerHTML="✅ Đã chọn: <b>"+esc(file.name)+"</b> • "+(file.size/1024/1024).toFixed(2)+" MB • sẵn sàng upload"}
    async function uploadAudio(file,userId){if(!file)return null;if(file.size>25*1024*1024)throw new Error("File audio quá lớn. Vui lòng chọn file dưới 25 MB.");const ext=(file.name.split(".").pop()||"mp3").toLowerCase();const safeExt=["mp3","wav","m4a"].includes(ext)?ext:"mp3";const path=`${userId}/${crypto.randomUUID()}.${safeExt}`;const result=await sb.storage.from(AUDIO_BUCKET).upload(path,file,{upsert:false,contentType:file.type||undefined,cacheControl:"3600"});if(result.error)throw new Error("Không upload được audio: "+result.error.message);const publicResult=sb.storage.from(AUDIO_BUCKET).getPublicUrl(path);return publicResult.data?.publicUrl||null}
    async function importWord(){if(typeof window.redWordImportHandler!=="function")return alert("❌ Bộ đọc Word chưa tải xong. Hãy Ctrl + F5 rồi thử lại.");await window.redWordImportHandler()}
    async function saveExam(){const {data,error:userError}=await sb.auth.getUser();if(userError||!data?.user)return alert("❌ Phiên đăng nhập đã hết.");const type=document.getElementById("ct").value,title=document.getElementById("ctitle").value.trim(),description=document.getElementById("cdesc").value;if(!title)return alert("Tên đề không được trống.");if(type==="writing")return alert("✍️ Writing sẽ được bật ở bước AI chấm tự động.");const questions=collectQuestions();if(!questions)return alert("⚠️ Kiểm tra lại nội dung câu hỏi và đáp án.");const payload={owner_id:data.user.id,exam_type:type,title,description,duration_minutes:Math.max(1,Number(document.getElementById("cmin").value)||30),max_attempts:Number(document.getElementById("cmax").value)||1,questions,answer_key:questions.map(q=>q.answer)};if(!editingExamId)payload.published=false;if(type==="reading")payload.reading_text=document.getElementById("creading").value;if(type==="listening"){const file=document.getElementById("audioFile")?.files?.[0];if(file){const status=document.getElementById("audioStatus");if(status)status.textContent="⏳ Đang upload audio...";try{const url=await uploadAudio(file,data.user.id);if(!url)return alert("❌ Không lấy được URL audio sau khi upload.");payload.audio_url=url}catch(error){if(status)status.textContent="❌ Upload thất bại";return alert("❌ "+error.message)}}else{payload.audio_url=exams.find(e=>String(e.id)===String(editingExamId))?.audio_url||""}}const result=editingExamId?await sb.from("exams").update(payload).eq("id",editingExamId):await sb.from("exams").insert(payload);if(result.error)return alert("❌ "+result.error.message);const wasEditing=Boolean(editingExamId);closeModal();await load();alert(wasEditing?"✅ Đã lưu thay đổi.":"✅ Đã tạo đề "+typeName(type)+".")}
    function edit(id){const exam=exams.find(e=>String(e.id)===String(id));if(exam)createExam(exam)}
    async function duplicate(id){const exam=exams.find(e=>String(e.id)===String(id));if(!exam)return;const {data,error}=await sb.auth.getUser();if(error||!data?.user)return alert("❌ Phiên đăng nhập đã hết.");const payload={owner_id:data.user.id,exam_type:exam.exam_type,title:(exam.title||"Đề thi")+" - Bản sao",description:exam.description||"",duration_minutes:exam.duration_minutes||30,max_attempts:exam.max_attempts||1,questions:qs(exam),answer_key:parse(exam.answer_key),published:false};if(exam.exam_type==="reading")payload.reading_text=exam.reading_text||"";if(exam.exam_type==="listening")payload.audio_url=exam.audio_url||"";const result=await sb.from("exams").insert(payload);if(result.error)return alert("❌ "+result.error.message);await load();alert("✅ Đã nhân bản đề.")}
    async function toggle(id){const exam=exams.find(e=>String(e.id)===String(id));if(!exam)return;const result=await sb.from("exams").update({published:!exam.published}).eq("id",id);if(result.error)return alert("❌ "+result.error.message);await load()}
    async function removeExam(id){if(!confirm("Bạn có chắc muốn xóa đề này không?"))return;const result=await sb.from("exams").delete().eq("id",id);if(result.error)return alert("❌ "+result.error.message);await load();alert("✅ Đã xóa đề.")}
    async function copyLink(id){const link=studentLink(id);try{await navigator.clipboard.writeText(link);alert("✅ Đã sao chép link học sinh.")}catch{prompt("Sao chép link:",link)}}
    function closeModal(){if(localAudioUrl){URL.revokeObjectURL(localAudioUrl);localAudioUrl=""}editingExamId=null;modal.innerHTML=""}
    window.addQ=addQ;window.removeQ=removeQ;window.syncQ=syncQ;window.importWord=importWord;
    init();
  </script>
</body>
</html>
