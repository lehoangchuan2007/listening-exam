<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Exam Studio - Giáo viên</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.top{background:linear-gradient(135deg,#172554,#2563eb,#38bdf8);color:#fff;padding:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:16px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.btn.gray{background:#e8eef7;color:#0f172a}.btn.red{background:#dc2626}.btn.green{background:#16a34a}.muted{color:#64748b;font-size:14px}.hidden{display:none}.auth{max-width:450px;margin:50px auto}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.search{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:16px}.stat span{color:#64748b;font-size:14px}.stat b{display:block;font-size:27px;margin-top:5px}.exam{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:11px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.badge.off{background:#f1f5f9;color:#475569}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e2e8f0;white-space:nowrap}th{background:#f8fafc;color:#475569;font-size:13px}.pill{padding:5px 9px;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-weight:700}.detail{background:#f8fafc;border-radius:12px;padding:14px;margin-top:10px}.correct{color:#15803d;font-weight:700}.wrong{color:#b91c1c;font-weight:700}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:22px}.close{float:right;border:0;background:#eef2ff;border-radius:9px;padding:8px 11px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🎧 Listening Exam Studio</h1><div>👨‍🏫 Trang quản lý giáo viên</div></div></header><main class="wrap"><div id="app"></div></main><div id="modalRoot"></div><script>const cfg=window.SUPABASE_CONFIG||{};const sb=supabase.createClient(cfg.url,cfg.anonKey),app=document.getElementById('app');let exams=[],allSubmissions=[],currentExamId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const letter=i=>i==null?'':String.fromCharCode(65+Number(i));async function init(){const{data:{session}}=await sb.auth.getSession();session?dashboard(session):auth()}function auth(){app.innerHTML='<div class="auth card"><h2>🔐 Đăng nhập giáo viên</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mật khẩu</label><input id="pass" type="password"></div><button class="btn" id="loginBtn">Đăng nhập</button><p id="msg" class="muted"></p></div>';loginBtn.onclick=login}async function login(){const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)msg.textContent='❌ '+r.error.message;else dashboard(r.data.session)}async function dashboard(session){app.innerHTML='<div class="row"><div><h2>📊 Bảng điều khiển</h2><span class="muted">'+esc(session.user.email)+'</span></div><div class="toolbar"><button class="btn">＋ Tạo đề</button><button class="btn green" onclick="location.href=\'./manage.html\'">⚙️ Quản lý đề</button><button class="btn gray" onclick="loadExams()">↻ Làm mới</button><button class="btn red" onclick="logout()">Đăng xuất</button></div></div><div id="stats"></div><div id="list"></div><div id="results" class="card hidden"></div>';loadExams()}async function loadExams(){const{data,error}=await sb.from('exams').select('*').order('created_at',{ascending:false});if(error)return list.innerHTML='<div class="card">❌ '+esc(error.message)+'</div>';exams=data||[];stats.innerHTML='<div class="stats"><div class="stat"><span>📝 Đề thi</span><b>'+exams.length+'</b></div><div class="stat"><span>🟢 Đang mở</span><b>'+exams.filter(e=>e.published).length+'</b></div></div>';list.innerHTML='<div class="card"><h2>📝 Quản lý đề thi</h2>'+exams.map(e=>'<div class="exam"><div class="row"><div><b>'+esc(e.title)+'</b><div class="muted">'+((e.questions??e.question??[]).length)+' câu</div></div><div class="toolbar"><button class="btn" onclick="copyLink(\''+location.origin+location.pathname.replace(/admin(-v2)?\.html$/,'')+'#exam='+e.id+'\')">🔗 Copy link</button><button class="btn gray" onclick="showResults(\''+e.id+'\')">📊 Kết quả</button></div></div></div>').join('')+'</div>'}async function showResults(id){currentExamId=id;const e=exams.find(x=>String(x.id)===String(id));results.classList.remove('hidden');const r=await sb.from('submissions').select('*').eq('exam_id',id).order('submitted_at',{ascending:false});allSubmissions=r.data||[];results.innerHTML='<div class="row"><h2>📊 Kết quả: '+esc(e.title)+'</h2><button class="btn gray" onclick="results.classList.add(\'hidden\')">Đóng</button></div><div id="resultsTable"></div>';resultsTable.innerHTML='<div style="overflow:auto"><table><tr><th>Họ tên</th><th>MSSV</th><th>Điểm</th><th>Đúng</th><th>Chi tiết</th></tr>'+allSubmissions.map(x=>'<tr><td>'+esc(x.student_name)+'</td><td>'+esc(x.student_id)+'</td><td>'+esc(x.score)+'</td><td>'+esc(x.correct_count)+'/'+esc(x.total_questions)+'</td><td><button class="btn gray" onclick="viewSubmission(\''+x.id+'\')">Xem bài</button></td></tr>').join('')+'</table></div>'}function viewSubmission(id){const row=allSubmissions.find(x=>String(x.id)===String(id));if(!row)return;const e=exams.find(x=>String(x.id)===String(row.exam_id));let answers=row.answers||{};if(typeof answers==='string')try{answers=JSON.parse(answers)}catch{answers={}}let key=e.answer_key||[];if(typeof key==='string')try{key=JSON.parse(key)}catch{key=[]}let qs=e.questions??e.question??[];if(typeof qs==='string')try{qs=JSON.parse(qs)}catch{qs=[]}let html='<div class="modal-bg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>📋 Chi tiết bài làm</h2><p><b>Họ tên:</b> '+esc(row.student_name)+'<br><b>MSSV:</b> '+esc(row.student_id)+'<br><b>Điểm:</b> '+esc(row.score)+' • <b>Đúng:</b> '+esc(row.correct_count)+'/'+esc(row.total_questions)+'</p><hr>';qs.forEach((q,i)=>{const given=answers[String(i)]??answers[i],correct=key[i],ok=Number(given)===Number(correct),opts=q.options||[];html+='<div class="detail"><b>Câu '+(i+1)+'.</b> '+esc(q.text||q.question||'')+'<br><span class="'+(ok?'correct':'wrong')+'">'+(ok?'✅ Đúng':'❌ Sai')+'</span><br>Đáp án chọn: <b>'+esc(given==null?'Chưa trả lời':letter(given)+'. '+(opts[given]??''))+'</b> • Đáp án đúng: <b>'+esc(correct==null?'Chưa có đáp án':letter(correct)+'. '+(opts[correct]??''))+'</b></div>'});html+='</div></div>';modalRoot.innerHTML=html}function closeModal(){modalRoot.innerHTML=''}async function copyLink(x){try{await navigator.clipboard.writeText(x);alert('Đã copy link làm bài!')}catch{prompt('Copy link:',x)}}async function logout(){await sb.auth.signOut();auth()}init();</script></body></html>
